# folio2 判断の記録 ADR-10 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-10.html・生成物・手で直さない）。
# 状態: proposed（持ち主の承認待ち・裁定 3「ひとまず全部推奨でよい。」2026-09-19 で方向は承認済み・発効の逐語は approval 欄に）。条文の改訂ではない（amends は空）。天井の正本 ceiling.yaml v0.2 を本判断と同じ承認で発効する。
# 位置: 天井の 1 周目（2026-09-19・f2-648 notes）の結果 = 判断の記録 ADR-8 の撤退条件 ① に 1 周目で触れた値（止める 5 件のうち反証で退けた 4 件）の扱い。

id: ADR-10
title: 天井の 1 周目の結果を受け、観点の組み直しの前に天井の正本を 第 2 版（v0.2）（重さの基準・領分・読む欄・束に語彙と規則の表）に上げてから 2 周目を回し、撤退条件 ① は 2 周で数える
status: proposed
date: 2026-09-19
context: 判断の記録 ADR-8 の撤退条件 ① は「最初の 2 周で、止めるの所見のうち反証で退けられたものが半数を超えたら 4 観点を捨てて組み直す」と決めた。1 周目（2026-09-19・folio2 自身の設計文書・main 100774d）の実測は、止める 5 件のうち退けた 4 件（半数超え）だった。ただし退けた 4 件はすべて「読みやすさ」で、審査役自身が「3 件は事実誤認か過大評価」と認め、重さの基準（止める = 読み進められない／直す = 読めるが引っかかる）は席の指示にだけ在って天井の正本の問いの文に無かった。忠実さ・整合・実態の 3 観点は機能し（整合の止める 1 件は反証で支持され、判断の記録 ADR-9 の是正に繋がった）、凍結 fixture に仕込んだ欠陥も忠実さの観点が拾った。1 周目はほかに、束に語彙（vocabulary.yaml）と規則の表（rules.yaml）が無く忠実さの母集団のうち「語彙の判定」が恒久に まだ分からない になること、読む欄が観点の間で不揃いなこと（要件書の 非機能要件（nonfunctional） と 図の根拠（figures.refs）・判断の記録の 前提（context） と 退けた案（options）・規則の表の読む欄の名が実在しない 行（rows） になっていること）、図の凡例の言語や数えの日本語の崩れがどちらの領分か問いの文が決めていないことを示した。持ち主は 2026-09-19 に裁定 3 として案 P（正本を先に直してから 2 周目）を推奨どおり承認した。
decision: (1) 撤退条件 ① の 1 周目の値（退けた 4／止める 5）は「問いの文の穴」に起因する値として台帳に記帳し、①の判定は 2 周目の値と合わせて行う（ADR-8 の約束「最初の 2 周で数える」のとおり・観点は捨てない）。(2) 2 周目の前に天井の正本を 第 2 版（v0.2） に上げる。中身 = ① 各観点の問いの文に重さの基準（止める = 義務・要件・決定を変える食い違いか、非エンジニアが読み進められない導線の断絶／直す = 直すべきだが義務は変わらない・読めるが引っかかる／参考 = 提案）と、床の領分（見た目の崩れ・参照 id の解決・欄の非空・件数）は挙げないことを書く。読みやすさの問いに、図の凡例の言語と数えの日本語の崩れは天井の領分（言葉の問題）と明記する。② 読む欄を揃える＝忠実さに語彙（terms・field_terms）と規則の表（thresholds・discipline）と要件書の 図の根拠（figures.refs） を足す／読みやすさに語彙と規則の表と憲法の 順位（precedence）・出所（sources）、要件書の 制約（constraints） と 非機能要件（nonfunctional） を足す／整合の規則の表の読む欄を 閾値の行（thresholds）・規律の行（discipline） に直し、判断の記録に 前提（context） と 退けた案（options） を足す／実態に要件書の 非機能要件（nonfunctional） を足す。③ 文書の一覧・観点の一覧・所見と記録の欄の決まり・3 値・重さの値域・束の要約値の規則は変えない（便 37 の床の定数と一致したまま）。(3) 直前の版の写し（改番の判定の材料）は文書の一覧を広げる床の変更が要るので 第 2 版（v0.2） には入れず、便 42 で床の定数に置いた反証の規則の文と重さの基準を正本へ移す便と一緒に、第 3 版（v0.3） の候補として台帳に記す。(4) 2 周目は 第 2 版（v0.2） の束で回し、費用・時間・所見の数・反証の数・退けた数を台帳に記帳する。
options:
  - id: p
    name: 天井の正本 第 2 版（v0.2） を先に発効し、その後に 2 周目
    text: 問いの文に重さの基準と領分を書き、読む欄を揃え、束に語彙と規則の表を足してから 2 周目を回す。①は 2 周の値で判断する。
    verdict: adopted
    reason: 2 周目の値が「直した問いの文」の実力を測るので、①の判断が観点の設計そのものの当否に近づく。退けられた 4 件は全部同じ穴（重さの基準の不在）に起因し、穴を塞がずに数え直すのは同じ結果を再現するだけである。
  - id: q
    name: 今の問いの文のまま 2 周目を回して判断
    text: 正本を変えずに 2 周目を回し、①の値で判断する。
    verdict: rejected
    reason: 約束の字面どおりで早いが、同じ穴で同じ種類の「退けた」が出る見込みが高く、①が「問いの文の穴」で発動して 4 観点を捨てることになる（設計の当否と運用の穴を混同する）。
  - id: r
    name: 今すぐ ① を発動して観点を組み直す
    text: 1 周目の値で 4 観点を捨て、観点の数と問いの文を組み直す判断の記録を起こす。
    verdict: rejected
    reason: 約束（2 周で数える）に反する。忠実さ・整合・実態の 3 観点は機能しており、捨てる根拠が無い。
basis: [P-4, P-5, P-8, P-11, N-5, ADR-8, FR17, FR18]
retreat:
  kind: measure
  condition: 数えるのは planner 席で、台帳に記帳する。第 2 版（v0.2） で回した 2 周目でも、止めるの所見のうち反証で退けられたものが半数を超えたら、判断の記録 ADR-8 の撤退条件 ① のとおり 4 観点を捨て、観点の数と問いの文を組み直す判断の記録を起こす（本判断はそれを先延ばしにしない）。
amends: []
plain: AI に意味の検査をさせた 1 回目で、「止めるべき」と言った指摘の多くが、別の AI の確かめで「そこまでではない」と覆りました。覆った 4 件は全部「読みやすさ」で、原因は「どのくらい重いか」の物差しを AI に渡す文書に書いていなかったことです。そこで観点を捨てる前に、物差しと読む範囲を文書に書き足し（版 0.2）、もう 1 回回してから判断します。2 回目でも半分以上が覆ったら、約束どおり観点を作り直します。
consequences:
  - 天井の正本 天井の正本（ceiling.yaml） を 第 2 版（v0.2） に上げる（問いの文・読む欄・meta の版と承認欄）。床（便 37）の定数と一致する範囲なので実装の変更は要らず、材料の束（便 38）は正本から組み直すだけで新しい束になる。
  - 語彙と規則の表が束に入るので、忠実さの母集団のうち「語彙の判定」を 2 周目から数えられる。改番の判定（直前の版の写し）は 第 3 版（v0.3） の候補。
  - 便 42 で床の定数に置いた反証の規則の文と、重さの基準の文を正本へ移す便を 第 3 版（v0.3） の候補として台帳に記す（P-5.1）。
  - 2 周目の結果（所見の数・反証で退けた数・費用と時間）を台帳に記帳し、撤退条件 ① を 2 周の値で判定する。
note: 元になった持ち主の逐語は台帳 f2-648 notes 2026-09-19「ひとまず全部推奨でよい。」（裁定 3 = 案 P）。1 周目の記録は台帳 f2-648 notes と報告（~/.local/share/folio2/reports/2026-09-19-ceiling-round1/）。発効の前に反対側からの検証（grill）を独立の文脈で行い、記録を grill 欄に写す。
