plain: 憲法は「守らせたい決まりは、文章ではなく表に載せる」と言い、表の置き場を 3 つ名指ししていました。ところが今の folio は、書類の書き方の決まりの一部を道具の中（プログラムの中に型を付けて書いた値）に持っていて、そこは名指しされた 3 つに入っていませんでした。前の判断の記録は「それも表の 1 つとして扱う」と 1 文で済ませていましたが、憲法の言葉の範囲は憲法を直さないと広げられません。そこで憲法を直します。道具の中の決まりも置き場に数えますが、条件を付けます。人が読める写しを機械が自動で作り、設計文書の置き場に置くことです。道具の中にしか無くて誰も読めない決まりは認めません。あわせて、同じ一覧を 2 か所に人が書いて機械が見張る形がまだ何か所か残っているので、「どちらが元でどちらが写しか」を決める 4 つの決まりを置き、ファイル 1 つずつ順に直していきます。
consequences:
  - 憲法は第 1.1 版になる（初めての条文の改訂）。承認の後に、判断の記録の状態と承認欄・条 P-5 の改訂来歴・凍結 anchor の第 1.1 版・CLAUDE.md の生成区間の再注入を同じ変更で置く（P-14）。実の憲法の版と anchor の本数を字面で固定している歯（版の凍結の歯ほか）は、改訂の前に版に依らない形へ直す便を先に運ぶ。
  - 発効した時点で、決定 (2) の範囲に入るのに写しが無い定数（下調べの ③）と、向きが決まっていない二重の記述（① と ②）は、条と決定に対して未達のまま残る。解くのは決定 (4) の便で、着地までの天井の周はそれを所見として挙げうる。天井の門（裁定 1・案 A）を掛けるのは、少なくとも ① 天井の正本 ② 憲法と規則の表の値域 ③ 部品目録 の便が着地し、次の周で整合の止めるが消えたのを確かめた後とする。
  - 天井の正本は ① の便で第 3 版になる（人が書く一覧 6 か所が生成区間へ移る・発効は持ち主の承認）。台帳に記した第 3 版の候補 4 つ（直前の版の写し・反証の規則の文の置き場・生成区間を持つ file への所見の直す先・整合の束に語彙）は同じ版で扱う。
  - 規則の表に閾値の行が増える（決定 (3)(エ)・⑦ の便）。行の追加は裁定 id と時刻を要する（P-17.1）ので、値と行の文面は便の前に持ち主へ問う。
  - 要件書は、生成区間の対象が増える便のたびに FR19 の受入基準（対象の file の一覧）を版付きで足す（P-13.3）。判断の記録と設計ノートの欄の決まりそのもの・床の出す文言は、本判断では変えない。
note: 元になった持ち主の逐語は台帳 f2-648 notes 2026-09-19 22:39 JST「１．推奨で」（対象 = 天井の 2 周目の裁定 3 点・② 整合の 1 つ目は憲法 P-5.1 / P-5.5 と語彙の改訂・③ 整合の 2 つ目は同じ判断の記録で方針を決め便は file ごと）。裁定は P-5.5 も改訂の対象に挙げていたが、起草の結果 P-5.5 の文は変えずに済む（語彙の定義の側で 2 面のまま成り立つ）と判断し、その代わりに P-5.6 を新設する案を発効の承認で問う。所見と反証の逐語は ~/.local/share/folio2/ceiling/2026-09-19-round2/（整合の止める所見 2 つの反証の理由）。下調べの全数は設計判断の席の控え（adr-11-survey）に在り、要旨を台帳 f2-648.63 notes に記す。
