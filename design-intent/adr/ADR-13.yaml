# folio2 判断の記録 ADR-13 — 設計文書をグラフとして持ち、天井を増分で回す
# 状態: proposed（未承認・拘束力なし）。下調べの設計ノート = docs/design/graph-and-incremental-ceiling.md（第 2 版）
# 起点: 持ち主の問い 2026-09-22 01:1x（対話面 R-8）。判断の記録 ADR-8 の注が持つ門の撤退条件の発動。
# 第 2 版（2026-09-22）: 敵対的検証（条 A-2.3）の 12 点を反映した。検証の報告と数えの script は note を見ること。
# 持ち主の判断を要する 5 点は設計ノート §10.2 に置き、本 file では推奨の案として書く（確定させていない）。

id: ADR-13
title: 設計文書の id 参照を辺とするグラフを導出物として持ち、天井の 1 周が読む範囲を影響集合に絞る
status: proposed
date: 2026-09-22

plain: |
  設計文書の中の「この決まりはあの条が根拠」「この受入基準はあの要件を確かめる」といった指し合いを、
  機械が 1 枚の地図として取り出せるようにします。地図は新しく書くものではなく、いま文書が持っている欄から
  作り直せる写しです（手で書く面は作りません）。
  地図があると 2 つのことができます。1 つ目は、AI が最初に「この repo の設計文書には何があって何が何を指しているか」を
  33 キロバイトほどの表 1 枚で受け取れること。全部の文書を読むと 550 キロバイトなので、17 分の 1 で全体像が得られます。
  2 つ目は、AI による意味の検査（天井）を回すとき、変わった所とその近くだけを読ませられること。
  いまは文書が 1 文字でも変わると 4 つの読み方すべてが全部を読み直しており、3 日で 25 周まわしました。
  読む量はおよそ 4 分の 1 になります。
  正直に書いておくべきことが 3 つあります。第 1 に、この案の第 1 版は「近くを 2 つ分たどれば取りこぼしは無い」と
  書きましたが、敵対的な検証で数え直したところ、1 件の指摘に要る相手を全部そろえる数え方では 65% しか入らず、
  重い指摘 12 件のうち 4 件が 3 つ分より遠くにありました。第 2 に、4 つの読み方のうち 3 つには「近く」を
  まったく与えていません。全部に与えると読む量が 9 割近くに戻り、増分の意味が消えるからです。
  つまりこれは、正しさで選んだのではなく費用が選ばせた妥協です。第 3 に、前の回の合格を持ち越す仕掛けは
  取り下げました。まったく同じ材料で 2 回まわした記録を見つけて比べたところ、出てきた指摘 7 件のうち
  両方に出たのは 1 件だけでした。AI の読みは、材料が同じでも同じ指摘を返しません。

context: |
  (1) 事実。設計文書の正本は 9 つの文書（憲法・数値の表・語彙・要件書・入口・相談窓口・判断の記録・設計ノート・天井の正本）
  で、合計 550,398 byte。その中に id を持つ節点が 285、欄に id を並べた型付きの辺が 721 本ある（向きを落とすと
  対が 568・辺を持つ節点が 218・次数は中央値 3・最大 35）。節点と辺の数は、敵対的検証が独立に数えて一致した。

  (2) 第 1 版は辺の一覧に 規範文と条をつなぐ構造の辺（in-article・134 本）を載せていなかったのに、段を数えるときは
  それを使っていた。この辺が無いと規範文 67 本は 1 本の辺も持たない（根拠の欄も関係の欄も条の id を持ち、
  規範文の id を持たないため）。第 2 版で閉じた一覧に足し、型を 9 から 10 にする。

  (3) いまの天井の費用。1 周は観点 4 つぶんの材料の束を組み、AI を 4 本と反証を回す。束は文書の単位でしか絞っておらず、
  観点が「この欄だけ読む」と宣言していても名指された file の全部を写す。直近の 1 周の正本の写しの合計は 2,083,365 byte、
  置き場の総量は 141,619,070 byte（第 1 版の 1,818,116 と 148 メガバイトはどちらも測り方の誤りで、第 2 版で直した）。
  今の正本を 4 観点ぶんで測ると file 全部が 2,177,001 byte、読む欄だけが 862,970 byte（39.6%）。
  設計文書が 1 byte でも変われば印は古くなる（判断の記録 ADR-8 の注が定める厳格な鮮度）。
  結果、2026-09-19 から 2026-09-22 までの 3 日で 25 周、うち 2026-09-21 の 1 日で 14 周を回した。
  ADR-8 の注が門に付けた撤退条件（設計文書を触る便が 1 週間に 5 本を超え、周の費用が便の費用の合計を超えたら、
  文書ごとの印の設計ノートを起こす）は、この実測で満たされている。

  (4) 何が変わるのか。直近 40 commit の実測で、変わった節点は中央値 2・平均 7.0・最大 43。
  40 回のうち 14 回は節点が 1 つも変わっていない。文書の単位で古さを測ると中央値 2 文書（9 つのうち 22%）が
  丸ごと読み直しになる。

  (5) 近くの取り方の実測（敵対的検証で数え直した）。過去 23 周の文書どうしの整合の指摘 142 件のうち、
  id の付いた場所に置かれたのは 88 件。指す先のうち最も近い 1 つまでの段は 1 段 64・2 段 23・3 段 1（2 段以内 98.9%）。
  ところが、その指摘を立てるのに要る相手を全部そろえる数え方では 1 段 14・2 段 43・3 段 29・4 段 2（2 段以内 64.8%）で、
  重さが「止める」の 12 件では 3 段が 3 件・4 段が 1 件になる。第 1 版が旗艦として挙げた例（2026-09-20 の 3 周目の
  規則の表の行 R-8 の指摘）も、測ると 3〜4 段だった。**第 1 版の「2 段で 100%」は取り下げる。**

  (6) 整合 以外の 3 観点は第 1 版が 1 度も数えていなかった。同じ手順で数えると、指す先の id を 1 つも持たない指摘が
  忠実さ 34・読みやすさ 42・実態 32 件あり、グラフでは扱えない。床の外に相手を要する指摘は忠実さ 36%・
  読みやすさ 25%・実態 57%（止めるを合わせて 13 件）。4 観点とも近くを 2 つ分にすると 1 周の読む量は中央値 88% になり、
  増分の意味が消える。**3 観点に近くを与えないのは、測って選んだのではなく費用が選ばせた妥協である。**

  (7) 持ち越しの前提は実測で偽だった。過去 25 周のうち、材料の束の要約値が 1 byte も違わない 2 周が 2 組ある。
  判定（合格）は両方とも一致したが、忠実さで挙がった指摘 7 種のうち両方に出たのは 1 種だけ、実態でも 4 種のうち 1 種だけ。
  持ち越しの条件を過去 23 周に当てると、指摘の 27.6%（402 件のうち 111 件・止める 3 件を含む）が消える。
  さらに 実態 の観点の入力には実装が入っており、節点の要約値には現れない。

  (8) 散文の言及を捨てる損は 0 ではない。検証の数えでは、本文で指して型付きの辺が無い依存が 422 件（27.5%）あり、
  そのうち 49 件が 3 段・7 件が 4 段・1 件が 5 段で、近くを 2 つ分にしても届かない。
  本判断が独立に数え直すと辺が無い言及 337 件・3 段以上 52 件で、分類の内訳は揃わないが向きは同じである。
  言及の総数そのものは走査の範囲で 1,187 から 1,805 まで動くので、範囲を実装の定数で閉じるまで数として使えない。

  (9) 既に約束されていて未実装のもの。要件書は「機械が読む id の索引を出す」「契約表から導出物を生成して差分を数える」
  「着地は commit の末尾の印だけから読む」の 3 つを定めているが、口はいずれも無い（台帳の起票あり）。
  材料は既に在る（契約表の行 87 本と要件への参照 181 件・末尾の印を持つ commit 34 本・
  設計への案内（design pointer）を持つ台帳の行 42 件）。
  要件書の注には実装の状態が日付つきの散文で手書きされており（注の合計 14,577 byte・うち状態を述べる注が
  8 件 7,647 byte）、実態との整合の観点が毎周それを読み、注を手で実態へ合わせ直すためだけの版上げが繰り返されている。
  いま要件書の面には「未実装」が 7 か所出ており、持ち主は面を開けば動くかどうかを読める。

  (10) 持ち主の問いには第 2 の選択肢（リンクと節点の対応を作り込む方向で設計を根本から考え直す）があった。
  第 1 版は (5) の数えを根拠に「この選択肢は要らない」と書いたが、その数えが落ちたので **第 2 版はこれを取り下げる。
  第 2 の選択肢はまだ退けられていない。**

options:
  - id: a
    name: 節点と辺の索引を導出物として持ち、天井の読む範囲を影響集合に絞る（整合だけ近くを 2 つ分・持ち越しなし）
    text: |
      設計文書の id を持つ行と、指摘の置き場になる節を節点とし、いま欄に在る id の並びを辺とする索引を、正本から
      決定的に導出する口を folio に置く。索引は導出物で、人が書く面は作らない。天井の 1 周は、観点が宣言する読む欄まで
      材料の束を絞り、さらに「変わった節点」に絞る。文書どうしの整合の観点だけ、型付きの辺で近くを 2 つ分まで広げる。
      憲法とその付録（語彙・数値の表）と天井の観点の一覧は毎周すべて読む。3 つ分の所にある節点の id の列は、
      読ませないが隠さず出力の別の欄に添える。前の周の判定は持ち越さない。
      節点の要約値を印に持ち、周の引き金（節点・生成区間と欄の決まり・面の生成器と部品目録・実態の実装の証拠）が
      1 つも変わらない変更では周を要らないと出す。門は「印が古い」の側だけを便の file の単位にし、
      「不合格」は repo 全体で止めるを残す。散文の中の id の言及は辺にせず、参考の列として別に並べ、
      3 段以上に落ちる依存は型付きの欄へ書き写す便を先に置く。
    verdict: adopted
    reason: |
      読む量は 1 周あたり今のおよそ 4 分の 1（中央値）になり、直近 40 回の変更のうち 14 回は周そのものが要らなくなる。
      辺は既に 721 本が文書の中に在るので、新しく書かせるものが 1 つも無い。索引を導出物に限るので、
      同じ内容を人が 2 か所に書く形（条 P-6.4 が禁じる形）にならない。憲法の条文の改訂を要しない。
      近くを 2 つ分にする根拠は、第 1 版が書いた「取りこぼしが 0」ではない。2 つの数え方のどちらでも
      1 つ分より取りこぼしが少ないこと（重さが「止める」の 12 件で 1 件対 0 件・10 件対 4 件）と、
      3 つ分まで広げると増分でなくなること（読む量が 9 割近くに戻る）の 2 つである。
      残る取りこぼし（「指す先を全部そろえる」数え方で 4 件）は 3 つ分の所の id の列を添えることで隠さず、
      撤退条件の 1 つ目で数える。
      持ち越しを落とし、門の「不合格」を緩めないので、第 1 版が開こうとしていた 2 つの穴はふさがる。
  - id: b
    name: 近くの取り方を 1 つ分にする
    text: |
      案 a と同じ形で、文書どうしの整合の観点の近くだけを 1 つ分にする。読む量は 1 周あたり中央値 35%（案 a は 53%）になる。
    verdict: rejected
    reason: |
      2 つの数え方のどちらでも案 a に負ける。「最も近い 1 つ」の数え方では重さが「止める」の 12 件のうち 1 件を
      取りこぼす（案 a は 0 件）。「指す先を全部そろえる」数え方では 12 件のうち 10 件を取りこぼす（案 a は 4 件）。
      取りこぼす 1 件は 2026-09-20 の 3 周目の指摘（規則の表の行 R-8 と制約 CON5 と判断の記録の食い違い）である。
      18 ポイント（中央値 35% 対 53%）の節約では釣り合わない。
      持ち主に上げるのは「2 つ分で足りるか」であって、「1 つ分か 2 つ分か」ではない（設計ノート §10.2 の 1）。
  - id: c
    name: 4 観点とも近くを 2 つ分にする
    text: |
      忠実さ・読みやすさ・実態にも、文書どうしの整合と同じ近くを与える。床の外に相手を要する指摘
      （忠実さ 36%・読みやすさ 25%・実態 57%）を拾えるようになる。
    verdict: rejected
    reason: |
      費用が許さない。直近 40 回の変更で 1 周の読む量が中央値 88%・最大 97% になり、増分の意味がほぼ消える。
      これは正しさで退けたのではなく費用で退けたので、その対価（3 観点の床の外の指摘を取りこぼしうること）は
      撤退条件の 1 つ目が両方まとめて数える。
  - id: d
    name: 文書ごとの印にする
    text: |
      判断の記録 ADR-8 の注と、天井の門の設計ノート（docs/design/ceiling-gate.md）が素描した段階 2 の形。
      印を file ごとに持ち、変わった文書だけを古いとする。周も文書の差分で回す。
    verdict: rejected
    reason: |
      素描そのものが「文書どうしの整合の観点は差分にできないので費用は半分にしかならない」と書いていた。
      実測でもそのとおりで、整合の観点は読む欄まで絞っても 59.6% を読む。文書の単位では直近 40 回の変更で
      中央値 2 文書（9 つのうち 22%）が丸ごと読み直しになる。案 a はこの素描を退けるのではなく、同じ狙いを
      より細かい単位で果たす。
  - id: e
    name: 散文の中の id の言及も辺にする
    text: |
      型付きの欄に無い指し合いを、床の参照 id の走査（数値の表の行 R-4 と同じ式）で散文から拾い、辺として伝播に使う。
    verdict: rejected
    reason: |
      数が多すぎる（型付きの辺の 1.6 倍から 2.5 倍）。承認の来歴と決定の本文に集中しており、その大半は過去の改訂の
      履歴であって今の依存ではない。履歴を辺にすると古い判断の記録 1 本を直しただけで影響集合が全体へ広がる。向きも無い。
      条 N-2 の向きにも反する（散文にしか無い関係を機械の判定の根拠に昇格させる）。
      第 1 版はこれに「そもそも要らない」を 4 つ目の理由として足していたが、その根拠の数えが落ちたので取り下げる。
      捨てることの損は 0 ではない（本文で指して辺が無い依存が 300 件から 420 件・うち 50 件から 57 件は 3 段以上）。
      そこで、辺にする代わりに **型付きの欄へ書き写す便** を便の列の先頭に置く。

