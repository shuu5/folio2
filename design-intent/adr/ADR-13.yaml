decision: |
  (1) 節点と辺を型で定める。節点 = 設計文書の中で id を持つ行と、指摘の置き場になる節。欄は 5 つ（id・種類・所属 file・
  欄の要約値・1 行の題）。種類は閉じた一覧とし、その正本は実装の型付きの定数に置き、生成区間へ決定的に導出する
  （要件書 FR19 の対象に足す・条 P-5.1 と P-5.6）。節点にしないもの = 生成区間・承認と版の来歴の節・凍結 anchor・生成物。

  (2) 辺の型を閉じた一覧にする。根拠（basis）・確かめる先（verifies）・参照・改訂の範囲（amends）・関係（relations）・
  目的（goals）・行が属する条（article）・観点の読む欄・図の参照の 9 つ。
  出所はいま文書が持っている欄だけで、新しく書かせる欄を 1 つも足さない。図の参照は伝播に使わない。
  散文の中の id の言及は辺にしない（案 d を退けた）。参考の列として別に並べ、床はそれを影響集合に数えない。

  (3) グラフの正本は設計文書そのものであり、索引は導出物である（条 P-6.3）。索引の file を人が書く面は作らない（条 P-6.4）。
  索引が組めない状態で影響集合を問われたら「まだ分からない」を返す（条 P-4.2）。

  (4) 影響集合を定める。入力は「変わった節点の集合」（2 つの版の欄の要約値の差）。
  床 = 憲法とその付録（語彙・数値の表）と天井の観点の一覧を 4 観点とも毎周すべて読む。
  忠実さと読みやすさ = 床と変わった節点。
  文書どうしの整合 = 床と変わった節点と、そこから型付きの辺で 2 段の近傍。
  実態との整合 = 床と変わった節点と、その節点に結び付く実装の証拠（契約表の行の要件の列・着地の印の要件 id・歯の名）。
  3 段目の節点の id の列は、読ませないが隠さず、出力の別の欄に添える。

  (5) 天井の印に節点ごとの要約値の表を足す。節点が 1 つも変わっていない変更では、周を要らないと出す。
  前の周で「その節点についての指摘が 0 だった観点」は判定を持ち越す。持ち越しの条件は 3 つ（印が節点ごとの要約値を持つ・
  今の要約値が印と同じ・その観点の影響集合に要約値の変わった節点が 1 つも無い）で、1 つでも欠ければ「まだ分からない」に
  落として回し直す（条 P-4.1・P-10.3）。持ち越すのは合格だけで、不合格は持ち越さない。無効化の旗も「今回だけ」の口も
  持たない（条 N-3.1）。

  (6) 門（要件書 FR20）の判定の対象を、repo 全体からその便が書き換える file の節点へ狭める。3 値の意味と、
  「まだ分からない」が「不合格」より先に立つ順序は変えない。通したときも、印の古い節点の数を必ず 1 行で添える。
  この改訂は門を緩める向きなので、発効の前に反対側からの確認（条 A-2.3）を経て承認要求に載せる。

  (7) 材料の束を、観点が宣言する読む欄まで絞る（要件書 FR17 の改訂）。これはグラフを 1 本も使わずに実行でき、
  正本の写しの合計を 1,818,116 byte から 886,260 byte（48.7%）へ半減させる。影響集合の絞りより先に入れる。

  (8) 全体像を安く出す口を置く。節点の索引と辺の索引を 2 つの表で出し、合計 32,351 byte（設計文書の正本の 5.9%）。
  CLAUDE.md には載せない（数値の表の行 R-2 の上限 8,000 byte を超えるため・条 P-14.3）。
  代わりに、席が始まるときの 1 行の口（folio hello）に、設計文書が在るときの 1 行（節点の数・辺の数・全体像を出す口の名）を足す。
  非機能要件 NFR1 の母集団（数値の表の行 R-1）に収まる大きさに留める。

  (9) 台帳とは読み取り専用でつなぐ。台帳へは 1 行も書かない（条 P-5.4）。読むのは台帳の行（bead）の受入の欄が持つ
  設計への案内（pointer）1 種類だけで、要件と契約表の行と着地の commit を 1 つの表にする。
  台帳が読めない環境では台帳に由来する欄を「まだ分からない」にし、残りを出す。
  契約が受け付けられた後にその要件の節点が変わったら「要再読」を席と器へ知らせる。これは便を止める仕掛けではない
  （止める判断は門が持つ・新しい仕掛けを増設しない）。

  (10) 実装の状態を要件書の注から導出物へ移す。要件ごとの状態を 3 値（着地・便は在るが印が無い＝まだ分からない・便が無い）
  で導出し、要件書の注からは実装の状態を述べる文だけを落とす。実態との整合の観点が読む相手を注から導出物へ替える
  （天井の正本の版上げを要する）。落とす文は便の契約表の行に 1 本ずつ字で書く。

  (11) 本判断は憲法の条文を 1 字も改訂しない。運ぶのは要件書の版上げ（新しい要件 2 本と FR17・FR20 の改訂と
  FR11・FR13 の注の改訂）と天井の正本の版上げと語彙の追加（節点・辺・影響集合・持ち越しの 4 語）である。
  条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

  (12) 順序は「効きが大きく危険が小さい順」とする。索引の口 → 読む欄までの絞り → 節点ごとの要約値の印と周の省略 →
  影響集合の導出 → 束の絞りと門の単位の変更 → 実装の状態の導出。最初の 4 つは設計文書の正本を 1 file も書き換えないので、
  門は「通す」を返す。要件書の版上げは 5 つ目の前に 1 回でまとめる。

consequences:
  - 天井の 1 周が読む量は、正本の写しの合計で 1,818,116 byte から中央値 469,718 byte（今のおよそ 4 分の 1）になる。直近 40 回の変更のうち 13 回（33%）は周そのものが要らなくなる。周の所要（今は 15〜20 分）と費用は台帳へ記帳して数え続ける。
  - 要件書は新しい要件 2 本（機械が読む id の索引と全体像の出力・影響集合の導出）を持ち、FR17（材料の束）と FR20（門）の規範文が改訂され、FR11 と FR13 の注が実装の状態の導出へ置き換わる。既存の要件の番号は 1 つも動かない（条 P-7.1）。
  - 天井の正本は、実態との整合の観点が読む相手を注の散文から導出物へ替える版になる。観点の数（4 つ）と問いの文と重さの値域は変わらない（条 N-5）。
  - 語彙に 4 語（節点・辺・影響集合・持ち越し）が増える。数値の表の行は 1 行も足さない（閾値を足す必要が出たら条 P-17 の手順で別に問う）。
  - 節点ごとの要約値の表を持つ印は約 16 キロバイトになる（今は 976 byte）。生成物 1 file の上書きなので、版管理の履歴は行単位の差分として読める（条 P-6.2）。
  - 要件書 FR11・FR13・FR14 の未実装の 3 つが、本判断の便の列の中で実装される（台帳の起票を閉じる）。床の穴（要件と判断の記録と受入基準の id の消失と改番を数える口が無い）も、節点の索引が在れば数えられるようになる。
  - 門が緩む向きの変更を含む。通す判定の範囲が repo 全体からその便の file へ狭まるので、不合格の節点が別の file に残ったまま便が通り続ける経路が開く。撤退条件の 5 つ目がこれを数える。
  - 持ち越しは天井（AI の判定）の持ち越しであり、床の判定の持ち越しではない。反対側からの確認で危ういと出たら、持ち越しだけを落として影響集合の絞りを残す（撤退条件の 2 つ目）。
  - 本判断は判断の記録 ADR-8 の決定を 1 つも捨てない。ADR-8 の注が門に付けた撤退条件（文書ごとの印の設計ノートを起こす）に応えたもので、その素描（設計ノート docs/design/ceiling-gate.md の 4 節の案 b）を、より細かい単位で置き換える。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 へ記帳する。
    (1) 影響集合が取りこぼす: 増分で回した周の後に、影響集合の外に在った節点についての「止める」の指摘が、次の全部読みの
    周で出たら数える。2 件で本判断を捨て、全部読みへ戻す。数えるために、増分の周を 5 周ごとに 1 回は全部読みの周で挟む。
    (2) 持ち越しが誤る: 持ち越した観点の判定が、後の全部読みの周で覆ったら数える。1 件で持ち越しだけを捨てる
    （影響集合の絞りは残す）。
    (3) 索引が費用を取り戻さない: 索引を組む口の所要が 1 周の節約分を超えたら数える。実測 3 回で束の絞りを止める
    （索引と全体像の出力は残す）。
    (4) 2 段でも足りない: 型付きの辺で 3 段以上離れた節点を結び付ける「止める」の指摘が 2 件出たら、半径を 3 へ上げずに
    設計を根本から見直す設計ノートを起こす。3 段まで広げると増分でなくなるので、その 2 件は辺の型が足りていないという
    意味になる。
    (5) 門を緩めた対価: 節点の単位の門が「通す」を返した便の後に、その便が触らなかった file の不合格の節点が
    2 周以上そのまま残ったら数える。2 回で門の単位の変更を捨て、判定を repo 全体へ戻す。
    (6) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として
    持ち主へ渡す（条 P-4.2・P-11.1）。

