decision: |
  (1) 節点と辺を型で定める。節点 = 設計文書の中で id を持つ行と、指摘の置き場になる節。欄は 5 つ（id・種類・所属 file・
  欄の要約値・1 行の題）。種類は閉じた一覧とし、その正本は実装の型付きの定数に置く。
  **その写しを受ける file は、便が新しく起こす索引の欄の決まりの正本（design-intent/graph.yaml）の生成区間とする**
  （要件書 FR19 の対象に足す・条 P-5.1 と P-5.6）。索引の中身そのものは版管理に置かない（毎回組み直す導出物）。
  この正本は入口の棚と天井の正本の文書の一覧に載るので、その 2 file の版上げを伴う。

  (2) 辺の型を閉じた一覧にする。**規範文と条をつなぐ構造の辺（in-article）を足して 10 型**とする＝
  根拠（basis）・構造（in-article）・確かめる先（verifies）・参照・改訂の範囲（amends）・関係（relations）・
  目的（goals）・行が属する条（article）・観点の読む欄（reads）・図の参照。
  出所はいま文書が持っている欄と構造だけで、新しく書かせる欄を 1 つも足さない。図の参照は伝播に使わない。
  伝播は両向きに行う。散文の中の id の言及は辺にしない（案 e を退けた）。参考の列として別に並べ、床はそれを
  影響集合に数えない。**参考の列を AI が読んだ結果が指摘になったら、その対を型付きの欄へ書き写す。**
  今の辺で 3 段以上に落ちる依存（50 件から 57 件）は、索引を作る前に型付きの欄へ書き写す便で先に移す。

  (3) グラフの正本は設計文書そのものであり、索引は導出物である（条 P-6.3）。索引の file を人が書く面は作らない（条 P-6.4）。
  索引が組めない状態で影響集合を問われたら「まだ分からない」を返す（条 P-4.2）。

  (4) 影響集合を定める。入力は「変わった節点の集合」（2 つの版の欄の要約値の差）。
  床 = 憲法とその付録（語彙・数値の表）と天井の観点の一覧を 4 観点とも毎周すべて読む。
  忠実さと読みやすさと実態 = 床と変わった節点（実態はこれに、その節点に結び付く実装の証拠を足す）。
  文書どうしの整合 = 床と変わった節点と、そこから型付きの辺で 2 つ分の近く。
  3 つ分の所にある節点の id の列は、読ませないが隠さず、出力の別の欄に添える。
  **3 観点に近くを与えないのは費用が選ばせた妥協であり、正しさで選んだのではない**（案 c の理由）。
  その対価は撤退条件の 1 つ目が数える。

  (5) 天井の印に節点ごとの要約値の表を足す。**周の引き金**（① 節点の本文の要約値 ② 生成区間と欄の決まりの file の中身
  ③ 面の生成器と部品目録と様式 ④ 実態の観点についてのみ実装の証拠）が 1 つも変わらない変更では、周を要らないと出す。
  ① だけを引き金にすると、過去に「止める」を 4 件生んだ場所（生成区間・欄の決まりの注）の変更が天井に 1 度も掛からなくなる
  ＝第 1 版の「節点が変わらなければ周は要らない」は狭すぎた。
  **前の周の判定は持ち越さない。毎周、影響集合を観点に読ませる。**（第 1 版の決定はここで持ち越しを認めていたが、
  材料の束が同じ 2 周で指摘の重なりが 7 分の 1 だった実測により取り下げる。）

  (6) 門（要件書 FR20）は、**「まだ分からない（印が古い）」の側だけ**を便の file の単位にする。
  印に無い節点が在るか要約値が違う節点が在り、かつその節点がこの便の書き換える file に在るときだけ 2 を返す。
  ほかの file だけを触る便は通す。**「不合格」の側は今のまま repo 全体で止める。**
  指摘の直す先は置き場と別の file にあることが多く（過去の「止める」13 件のうち 6 件）、
  置き場だけを鍵にすると直すべき file の便が素通りするためである。
  3 値の意味と、「まだ分からない」が「不合格」より先に立つ順序は変えない。
  通したときも、印の古い節点の数と不合格の節点の数を 1 行で出し、台帳へ記帳する口を持つ。

  (7) 材料の束を、観点が宣言する読む欄まで絞る（要件書 FR17 の改訂）。これはグラフを 1 本も使わずに実行でき、
  4 観点ぶんの正本の写しを 2,177,001 byte から 862,970 byte（39.6%）へ絞る。影響集合の絞りより先に入れる。
  **そのとき、材料の束の凍結 anchor を folio の実装に依らずに作り直す。** 今の独立性は「正本を byte のまま写す」
  ことから来ており、欄を切り出すと写しが folio の産物になる（条 P-10.2 が禁じる形に近づく）。
  欄を切り出す独立の script を anchor と一緒に凍結し、維持できなくなったらその検査の結果を「まだ分からない」に落とす
  （条 P-10.3）。

  (8) 全体像を安く出す口を置く。節点の索引と辺の索引を 2 つの表で出し、合計およそ 33,000 byte（設計文書の正本の約 6%）。
  CLAUDE.md には載せない（数値の表の行 R-2 の上限 8,000 byte を超えるため・条 P-14.3）。
  代わりに、席が始まるときの 1 行の口（folio hello）に、設計文書が在るときの 1 行（節点の数・辺の数・
  全体像を出す口の名）を足す。非機能要件 NFR1 の母集団（数値の表の行 R-1）に収まる大きさに留める。

  (9) 台帳とは読み取り専用でつなぐ。台帳へは 1 行も書かない（条 P-5.4）。読むのは台帳の行の受入の欄が持つ
  設計への案内（pointer）1 種類だけ。**台帳由来の欄は床の合否と門の判定に使わない。面と知らせにだけ使う。**
  台帳は版管理の外にあり、端末と同期の時点で値が変わるので、条 P-3.1 の「決定的」と条 P-10.1 の凍結 anchor に
  噛み合わないためである（読めないときは「まだ分からない」で足りるが、読めるが古いときは違う値を返す）。
  床と門が読むのは版管理の中にあるもの（契約表の行・着地の commit の末尾の印）だけにする。
  契約が受け付けられた後にその要件の節点が変わったら「要再読」を席と器へ知らせる。これは便を止める仕掛けではない。

  (10) 実装の状態を要件書の注から導出物へ移す。**3 値（着地・便は在るが印が無い＝まだ分からない・便が無い）は
  機能要件にだけ当てる。非機能要件は対象外とし、その注は手書きのまま残す**（非機能要件の「未達」は便の有無ではなく
  閾値に対する測定の結果であり、この 3 値では表せない）。
  **導出した状態を要件書の面へ出す便を、注から落とす便と同じ列に置く。**（第 1 版は面へ出す便を 1 本も持たず、
  落とすだけだったので、人が読む面は純粋に劣化した。）
  落とす文と残す文が同じ文に同居するので（例: 非機能要件 NFR1 の「未達である」と、それを見つけた周と指摘の出所が
  1 つの括弧に入っている）、切り分けは「状態の語を含む文は、出所の括弧を残して状態の語だけを置き換える」とし、
  8 件の注について落とす前後の字を便の契約表の行に 1 本ずつ書く。
  実態との整合の観点が読む相手を注から導出物へ替える（天井の正本の版上げを要する）。

  (11) **本判断は判断の記録 ADR-8 の決定 (4)（天井が合格でない間は設計文書の便の着地を既定で止める）を狭める。**
  狭めるのは「まだ分からない」の側だけだが、既定で止める範囲が repo 全体から便の file へ変わるので、決定の範囲の改訂である。
  判断の記録どうしの改訂を記す型付きの欄が今は無い（改訂の範囲の欄は条を指す欄で、判断の記録を指せない）ので、
  **その欄を欄の決まりへ足す便を列に入れる**（実装の型付きの定数の改訂・便 1 本）。
  その便が着地したら、本判断はその欄で ADR-8 を指す行を持つ。それまでは帰結の散文だけが記帳である。

  (12) 憲法の条文は 1 字も改訂しない。運ぶのは要件書の版上げ（新しい要件 2 本と FR17・FR20 の改訂と
  FR11・FR13 の注の改訂）と、入口の棚と天井の正本の文書の一覧の版上げと、天井の正本の版上げと、
  判断の記録の欄の決まりの版上げと、語彙の追加（節点・辺・影響集合・周の引き金の 4 語）である。
  条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

  (13) 便の列は 10 本で、順は依存の順とする。① 3 段以上に落ちる依存を型付きの欄へ書き写す ② 索引の口と
  索引の欄の決まりの正本 ③ 全体像の出力と席が始まるときの 1 行 ④ 束を読む欄まで絞る（凍結 anchor の作り直しを含む）
  ⑤ 節点ごとの要約値の印と周の引き金 ⑥ 影響集合の導出 ⑦ 束を影響集合に絞る ⑧ 判断の記録の欄の決まりに
  判断どうしの改訂の欄 ⑨ 要件書の面を組む file を割る ⑩ 実装の状態の導出と面への出力と注の直し ⑪ 門の単位の変更。
  ①〜⑥ と ⑧ ⑨ は設計文書の正本を書き換えないか持ち主の承認欄で発効するので、門の対象外である。
  要件書の版上げは ⑦ の前に 1 回でまとめる。

consequences:
  - 天井の 1 周が読む量は、今の束に対しておよそ 22%（中央値）になる。撤退条件の 1 つ目が要求する 5 周に 1 回の全部読みを含めた実効はおよそ 26% である。直近 40 回の変更のうち 14 回は周そのものが要らなくなるが、決定 (5) の周の引き金を ② ③ ④ へ広げた後に何回残るかは まだ分からない（便が着地してから実測して台帳へ記帳する）。
  - 要件書は新しい要件 2 本（機械が読む id の索引と全体像の出力・影響集合の導出）を持ち、FR17（材料の束）と FR20（門）の規範文が改訂され、FR11 と FR13 の注が実装の状態の導出へ置き換わる。既存の要件の番号は 1 つも動かない（条 P-7.1）。
  - 索引の欄の決まりの正本（design-intent/graph.yaml）が 1 本増える。入口の棚と天井の正本の文書の一覧がその版上げを伴う。天井が読む文書は 9 から 10 になる。
  - 天井の正本は、実態との整合の観点が読む相手を注の散文から導出物へ替える版になる。観点の数（4 つ）と問いの文と重さの値域は変わらない（条 N-5）。
  - 語彙に 4 語（節点・辺・影響集合・周の引き金）が増える。数値の表の行は 1 行も足さない。
  - 節点ごとの要約値の表を持つ印はおよそ 16 キロバイトになる（今は 976 byte）。生成物 1 file の上書きなので、版管理の履歴は行単位の差分として読める（条 P-6.2）。
  - 判断の記録の欄の決まりに、判断の記録どうしの改訂を記す欄が 1 つ増える（実装の型付きの定数の改訂・生成区間の導出）。型付きの辺が 1 型増える。
  - 本判断は判断の記録 ADR-8 の決定 (4) を狭める。狭めるのは「まだ分からない（印が古い）」の側だけで、「不合格」の側は今のまま repo 全体で止める。第 1 版の帰結は「ADR-8 の決定を 1 つも捨てない」と書いていたが、それは偽だったので取り下げる。
  - 要件書 FR11・FR13・FR14 の未実装の 3 つが、本判断の便の列の中で実装される（台帳の起票を閉じる）。床の穴（要件と判断の記録と受入基準の id の消失と改番を数える口が無い）も、節点の索引が在れば数えられるようになる。
  - 整合 以外の 3 観点に近くを与えない妥協により、床の外に相手を要する指摘（忠実さ 36%・読みやすさ 25%・実態 57%）の一部を取りこぼしうる。撤退条件の 1 つ目がこれを整合の取りこぼしとまとめて数える。
  - 持ち主の第 2 の選択肢（設計を根本から作り直す）は、本判断では退けられていない。今の辺で 3 段以上に落ちる依存が残るので、撤退条件の 4 つ目が 2 件を数えたらその設計ノートを起こす。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 へ記帳する。
    (1) 影響集合が取りこぼす: 増分で回した周の後に、影響集合の外に在った節点についての「止める」の指摘が、
    次の全部読みの周で出たら数える。2 件で本判断を捨て、全部読みへ戻す。数えるために、増分の周を 5 周ごとに 1 回は
    全部読みの周で挟む。この条件は、文書どうしの整合の近く 2 つ分と、ほかの 3 観点に近くを与えないことの両方を数える。
    (2) 索引が費用を取り戻さない: 索引を組む口の所要が 1 周の節約分を超えたら数える。実測 3 回で束の絞りを止める
    （索引と全体像の出力は残す）。
    (3) 辺の型が足りない: 型付きの辺で 3 段以上離れた節点を結び付ける「止める」の指摘が 2 件出たら、近くを 3 つ分へ
    広げずに、設計を根本から見直す設計ノートを起こす。3 つ分まで広げると増分でなくなるので、その 2 件は辺の型が
    足りていないという意味になる。
    (4) 門を緩めた対価: 門が「まだ分からない」を出さずに通した便のうち、着地の時点で印に不合格の節点が残っていた
    便の本数を数える。2 本で決定 (6) の緩めを捨て、判定を repo 全体へ戻す。単位を周ではなく便の本数にしたのは、
    周が起きない失敗の形を数えるためである。
    (5) 周の引き金が漏れる: 決定 (5) の引き金で「周は要らない」と出した後に、次の周でその変更に由来する「止める」の
    指摘が出たら数える。2 件で引き金の判定をやめ、設計文書の file が 1 つでも変われば周を回す形に戻す。
    (6) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として
    持ち主へ渡す（条 P-4.2・P-11.1）。

note: |
  下調べの設計ノート = docs/design/graph-and-incremental-ceiling.md（第 2 版・実測の手順と数え直しの方法を節ごとに添えてある）。

  敵対的検証（条 A-2.3）は 2026-09-22 に実施済み。検証役 = 起草者とは別の席（読み取りのみ・repo を 1 file も編集していない）。
  報告 = ~/.local/share/folio2/handoff-2026-09-21/graph-grill.md。数えの script 7 本 =
  ~/.local/share/folio2/handoff-2026-09-21/grill/（graph.py・findings.py・distance.py・historical.py・
  mentions.py・reads_bytes.py・changes.py・すべて再実行できる）。
  検証の判定は 問 1 退ける・問 2 条件付き支持・問 3 退ける（持ち越しだけを落とす）・問 4 条件付き支持・
  問 5 条件付き支持・追加 A 退ける・追加 B 退ける・追加 C 条件付き支持。
  検証が §9 で戻した 12 点は第 2 版で全部反映した:
  ① 辺の閉じた一覧に規範文と条の構造の辺を足した（決定 (2)）
  ② 「2 段で 100%」を取り下げ、2 通りの数えを設計ノート §1.7 に並べ、旗艦の例の段を実測へ訂正した
  ③ 持ち越しを落とした（決定 (5)）
  ④ ADR-8 決定 (4) を狭める改訂だと帰結に明記し、判断の記録どうしの改訂の欄を足す便を列に入れた（決定 (11)）
  ⑤ 周の引き金を生成区間と欄の決まりへ広げた（決定 (5)）
  ⑥ 分母を実測で測り直した（context (3)・帰結の 1 つ目）
  ⑦ 整合 以外の 3 観点を同じ手順で数えた表を設計ノート §1.7 に足した
  ⑧ 要件書の面へ出す便を列に入れ、面を組む file の名指しを直し、3 値を機能要件だけに当てた（決定 (10)）
  ⑨ 散文の言及の数を走査の範囲つきの幅で言い直し、型付きの欄へ書き写す便を列の先頭に置いた（決定 (2)）
  ⑩ 材料の束の凍結 anchor を folio の code に依らず作り直す手順を決定に入れた（決定 (7)）
  ⑪ 節点の種類の一覧の写しを受ける file を名指し、台帳由来の欄を床の判定に使わないと明記した（決定 (1)(9)）
  ⑫ この注を grill 済みへ更新した。

  持ち主の判断を要する 5 点は設計ノート §10.2 に置き、本 file では検証役の推奨を既定の案として書いた（確定させていない）:
  ① 近くの取り方（推奨 = 2 つ分のまま + 3 つ分の id の列を添える + 撤退条件で数える）
  ② 持ち越し（推奨 = 入れない）
  ③ 門をどこまで緩めるか（推奨 = 「まだ分からない」の側だけ）
  ④ ADR-8 を狭める記帳（推奨 = 判断の記録どうしの改訂の欄を足す）
  ⑤ 要件書の面の「未実装」の代わり（推奨 = 面へ出す便を列に入れる）。

  第 1 版（2026-09-22・commit 3ff2097）からの主な差は設計ノート §0 の表に置いた。
  第 1 版の起草は、自分の案を実測で覆した記録（近くを 1 つ分から 2 つ分へ）を誠実さの証として残したが、
  覆した先の数えに同じ種類の甘さ（指す先を最も近い 1 つで代表させたこと）が残っていた。検証はそれを見つけた。

  実測はすべて 2026-09-22・base main 4b44b00 の時点のもので、数え直しの手順は設計ノートの各節に添えてある。
  まだ確かめていないことは設計ノート §10.3 に 4 点置いた。
