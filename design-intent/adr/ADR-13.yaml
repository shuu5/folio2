# folio2 判断の記録 ADR-13 — 設計文書をグラフとして持ち、天井を増分で回す
# 状態: proposed（未承認・拘束力なし）。下調べの設計ノート = docs/design/graph-and-incremental-ceiling.md
# 起点: 持ち主の問い 2026-09-22 01:1x（対話面 R-8）。判断の記録 ADR-8 の注が持つ門の撤退条件の発動。

id: ADR-13
title: 設計文書の id 参照を辺とするグラフを導出物として持ち、天井の 1 周が読む範囲を影響集合に絞る
status: proposed
date: 2026-09-22

plain: |
  設計文書の中の「この決まりはあの条が根拠」「この受入基準はあの要件を確かめる」といった指し合いを、
  機械が 1 枚の地図として取り出せるようにします。地図は新しく書くものではなく、いま文書が持っている欄から
  作り直せる写しです（手で書く面は作りません）。
  地図があると 2 つのことができます。1 つ目は、AI が最初に「この repo の設計文書には何があって何が何を指しているか」を
  32 キロバイトほどの表 1 枚で受け取れること。全部の文書を読むと 550 キロバイトなので、20 分の 1 で全体像が得られます。
  2 つ目は、AI による意味の検査（天井）を回すとき、変わった所とその近くだけを読ませられること。
  いまは文書が 1 文字でも変わると 4 つの読み方すべてが全部を読み直しており、3 日で 25 周まわしました。
  近くの取り方は「指し合いを 2 つ分たどった範囲」にします。1 つ分では足りないことが、過去 23 周の指摘 142 件を
  数えて分かりました（1 つ分では 16% を取りこぼし、重い指摘 12 件のうち 1 件を逃していました）。2 つ分にすると
  142 件すべてが範囲に入ります。
  憲法とその付録（語彙・数値の表）は毎回すべて読みます。小さいこと、そして指摘がよくそこに置かれることが理由です。
  読む量は今のおよそ 4 分の 1 になり、さらに「中身がまったく変わっていない変更」では周そのものが要らなくなります
  （直近 40 回の変更のうち 13 回がこれに当たります）。
  なお天井は AI の判定なので、前の回の合格を持ち越す仕掛けだけは危うさが残ります。そこは反対側からの確認（grill）で
  詰めてから決めます。

context: |
  (1) 事実。設計文書の正本は 9 つの文書（憲法・数値の表・語彙・要件書・入口・相談窓口・判断の記録・設計ノート・天井の正本）
  で、合計 550,398 byte。その中に id を持つ節点が 285、欄に id を並べた型付きの辺が 641 本ある（向きを落とすと
  対が 494・辺を持つ節点が 190・次数は中央値 3・最大 35）。辺の欄は 根拠（basis）・確かめる先（verifies）・
  関係（relations）・行が属する条（article）・目的（goals）・改訂の範囲（amends）と改訂の来歴の欄・
  要件書の数値の表の行の列と確かめ方（verify）の受入の列・設計ノートの行の参照の列・観点の読む欄である。
  一方、型付きの欄の外の散文に現れる id は 1,709 件で、型付きの辺の 2.7 倍ある。

  (2) いまの天井の費用。1 周は観点 4 つぶんの材料の束を組み、AI を 4 本と反証を回す。束は文書の単位でしか絞っておらず、
  観点が「この欄だけ読む」と宣言していても名指された file の全部を写す。正本の写しの合計は 1,818,116 byte
  （置き場の実測は生成した面の写しを含めて 1 周 7.1 メガバイト・25 周で 148 メガバイト）。
  設計文書が 1 byte でも変われば印は古くなる（判断の記録 ADR-8 の注が定める厳格な鮮度）。
  結果、2026-09-19 から 2026-09-22 までの 3 日で 25 周、うち 2026-09-21 の 1 日で 14 周を回した。
  判断の記録 ADR-8 の注が門に付けた撤退条件（設計文書を触る便が 1 週間に 5 本を超え、周の費用が便の費用の合計を
  超えたら、文書ごとの印の設計ノートを起こす）は、この実測で満たされている。

  (3) 何が変わるのか。直近 40 commit の実測で、変わった節点は中央値 2・最大 44。
  40 回のうち 13 回は節点が 1 つも変わっていない（生成物だけ 6 回・生成区間と欄の決まりの file だけ 7 回）。
  文書の単位で古さを測ると中央値 2 文書（9 つのうち 22%）が丸ごと読み直しになる。

  (4) 近くの取り方の実測。過去 23 周の文書どうしの整合の指摘 142 件を全部読み、指摘が結び付けた節点の対が
  型付きの辺で何段離れているかを数えた。id の付いた場所に置かれた指摘は 88 件（62%）で、そのうち 1 段が 65 件（74%）、
  2 段が 23 件（26%）、3 段以上と届かないものは 0 件。重さが「止める」の 12 件では 1 段が 11 件・2 段が 1 件。
  残る 54 件は id を持たない場所（語彙の語 17・観点 12・天井の文書の一覧 7・要件書の節 6・欄の決まりと承認の来歴 7・
  入口と相談窓口と設計ノートの節 4・その他 1）に置かれており、語彙の語と観点は型付きの辺を 1 本も持たないので
  伝播では永久に届かない。

  (5) 既に約束されていて未実装のもの。要件書は「機械が読む id の索引を出す」「契約表から導出物を生成して差分を数える」
  「着地は commit の末尾の印だけから読む」の 3 つを定めているが、口はいずれも無い（台帳の起票あり）。
  材料は既に在る（契約表の行 87 本と要件への参照 181 件・末尾の印を持つ commit 34 本・
  設計への案内（design pointer）を持つ台帳の行（bead）42 件）。
  要件書の注には実装の状態が日付つきの散文で手書きされており（注の合計 14,577 byte）、実態との整合の観点が毎周それを読み、
  注を手で実態へ合わせ直すためだけの版上げが繰り返されている。

  (6) 持ち主の問いには第 2 の選択肢（リンクと節点の対応を作り込む方向で設計を根本から考え直す）があった。(4) の実測は
  この選択肢が要らないことを示す。いま在る辺の型だけで、過去 23 周の整合の指摘が 2 段以内に 100% 収まっている。

options:
  - id: a
    name: 節点と辺の索引を導出物として持ち、天井の読む範囲を影響集合に絞る（半径 2）
    text: |
      設計文書の id を持つ行と、指摘の置き場になる節を節点とし、いま欄に在る id の並びを辺とする索引を、正本から
      決定的に導出する口を folio に置く。索引は導出物で、人が書く面は作らない。天井の 1 周は、観点が宣言する読む欄まで
      材料の束を絞り、さらに「変わった節点」と「そこから型付きの辺で 2 段の近傍」に絞る。憲法とその付録（語彙・数値の表）
      と天井の観点の一覧は毎周すべて読む。節点の要約値を印に持ち、節点が 1 つも変わらない変更では周を要らないと出す。
      門は、便が書き換える file に在る節点だけで 3 値を判定する。散文の中の id の言及は伝播に使わず、参考として別に並べる。
    verdict: adopted
    reason: |
      過去 23 周の指摘 142 件の実測で、2 段が必要十分であることが確かめられている（1 段では重い指摘 1 件を取りこぼし、
      3 段以上を要する指摘は 1 件も無い）。読む量は 1 周あたり今のおよそ 4 分の 1（中央値）になり、直近 40 回の変更のうち
      13 回は周そのものが要らなくなる。辺は既に 641 本が文書の中に在るので、新しく書かせるものが 1 つも無い。
      索引を導出物に限るので、同じ内容を人が 2 か所に書く形（条 P-6.4 が禁じる形）にならない。
      条文の改訂を要しない（観点は 4 つのまま・新しい段を作らない・例外の旗を持たない）。
  - id: b
    name: 近くの取り方を 1 段にする
    text: |
      案 a と同じ形で、影響集合の半径だけを 1 段にする。読む量は 1 周あたり中央値 35%（案 a は 53%）まで下がる。
    verdict: rejected
    reason: |
      実測が否定した。整合の指摘 142 件のうち 16% が 2 段の位置にあり、重さが「止める」の 12 件のうち 1 件
      （2026-09-20 の 3 周目・数値の表の行 R-8 と制約 CON5 と判断の記録 4 本の食い違い）を取りこぼす。
      18 ポイントの節約と引き換えに、止める指摘を 12 件に 1 件逃すのは割に合わない。天井は意味の検査であり、
      取りこぼしを別の層が拾ってくれる構造ではない（条 P-3.2・P-3.3）。
  - id: c
    name: 文書ごとの印にする
    text: |
      判断の記録 ADR-8 の注と、天井の門の設計ノート（docs/design/ceiling-gate.md）が素描した段階 2 の形。印を file ごとに持ち、
      変わった文書だけを古いとする。周も文書の差分で回す。
    verdict: rejected
    reason: |
      素描そのものが「文書どうしの整合の観点は差分にできないので費用は半分にしかならない」と書いていた。
      実測でもそのとおりで、整合の観点は読む欄まで絞っても 70.9% を読む。文書の単位では直近 40 回の変更で
      中央値 2 文書（9 つのうち 22%）が丸ごと読み直しになる。案 a はこの素描を退けるのではなく、同じ狙いを
      より細かい単位で果たす。
  - id: d
    name: 散文の中の id の言及も辺にする
    text: |
      型付きの欄に無い指し合いを、床の参照 id の走査（数値の表の行 R-4 と同じ式）で散文から拾い、辺として伝播に使う。
    verdict: rejected
    reason: |
      数が多すぎる（1,709 件・型付きの辺の 2.7 倍）。承認の来歴と決定の本文に集中しており、その大半は過去の改訂の履歴で
      あって今の依存ではない。履歴を辺にすると古い判断の記録 1 本を直しただけで影響集合が全体へ広がる。向きも無い。
      条 N-2 の向きにも反する（散文にしか無い関係を機械の判定の根拠に昇格させる）。そして実測上そもそも要らない
      （型付きの辺だけで整合の指摘が 2 段以内に 100% 収まる）。参考の列としてだけ出す。

