# folio2 判断の記録 ADR-15 — 実装の区切りの境界は責務で決め、器の行数の上限を境界の理由にしない
# 状態: proposed（起草 2026-09-23・反対側からの確認〔grill〕の前・orchestrator 席 fable 5.1）。
# 出所 = 総点検の設計ノート docs/design/audit-2026-09-23.md の §3-c と §3-d と §4 の 🔴 3（持ち主の承認 2026-09-23 08:13 JST・対話面 R-8・逐語「問いは全部推奨で」）。
# 区切りの図（層 × file × 責務 × 正規化行 × 余地）・依存の辺の全数・便ごとの書き込み範囲は docs/design/module-map-2026-09-23.md が持つ（本 file は判断だけを持つ）。

id: ADR-15
title: 実装の区切りの境界は責務で決め、器の行数の上限を境界の理由にしない

status: proposed
date: 2026-09-23

plain: |
  道具の中身をどう分けるか、その分け方の決まりです。
  いまの folio の中身は 44 枚のファイルに分かれていますが、その切れ目の一部は
  「1 枚のファイルに書ける行数の上限に当たったから、そこで切った」というだけの理由でできています。
  便を運ぶ道具の側が 1 枚 1,500 行という上限を持っていて、その上限に当たった便が 4 本ありました。
  中身は 1 行も変えずに、ただ半分に分けただけの便です。
  その結果いま、残り 300 行を切ったファイルが 4 枚あります。この 4 枚に少しでも大きな手を入れる便は、
  運ぶ前の受付で断られます。判断の記録・設計ノート・入口・憲法の 4 つのページに関わる場所です。
  そこで、切れ目の理由を「行数」から「仕事の役割」に変えます。
  役割は 6 つに分けます。土台（数の計算や合否の型）・読む（ファイルを型に直す）・
  検査する（決まりに合っているか数える）・導出する（正本から別の形を作る）・
  面に出す（人が読むページを書く）・配る（出来たものを置いて見せる）の 6 つです。
  そして「上の役割は下の役割を使ってよいが、下から上は使わない」という向きの決まりを 1 本だけ置きます。
  いま数えたところ、この向きに反している使い方が 20 か所ありました。
  20 か所の出どころは 5 つのファイルで、どれも「みんなが使う型や読み手」と「ひとつの命令の本体」を
  同じファイルに同居させていたことが原因です。同居しているものを下の役割へ降ろせば、20 か所は 0 になります。
  この向きが守られているかどうかは、人が気をつけるのではなく、自動の検査（歯）が毎回数えます。
  残っている 20 か所の一覧も検査が持ち、便が進むたびに減らします。増やす向きの書き換えは認めません。
  最後に、この判断をやめる条件も決めておきます。
  役割で分け直したのに受付の断りが減らなかったら、分け方が間違っていたということなので、測り直します。
  逆に、便を運ぶ道具の側が行数の上限をやめたとしても、この切れ目は元に戻しません。
  行数で決めたのではなく、役割で決めたからです。

context: |
  (1) 上限が境界を決めた跡の実測（総点検の棚卸し・基準 main aff1b32）。
  便を運ぶ器（scribe2）は 1 file あたりの行数の上限 1,500（幅 120 で正規化）を持ち、受付のときに
  書き込み範囲の各 file の余地（上限 − 正規化行数）を便の大きさの見積と比べて断る。
  この上限だけを理由に、中身を 1 行も変えずに file を割った便が 4 本ある（便 35・便 87・便 89・便 100）。
  便 76 は上限のために file を書き込み範囲から外した。境界が便の中身でなく便の形を決めた例である。

  (2) いま塞がっているところ。実装の側（src）は 44 file・正規化 26,160 行で、上限を超えるものは無いが、
  余地が 300 未満で中くらいの便が通らない file が 4 本ある。
  判断の記録の床 110・入口の面の生成器 122・設計ノートの床 138・憲法の面の生成器 206 である。
  歯の側は 2 本が既に上限を超えており（面の歯 −285・入口の面の歯 −28）、
  この 2 本を書き込み範囲に含む便は今すぐ断られる。

  (3) 依存の向きの実測。実装の側の 44 file が互いを名指す辺を、責務で割り当てた 6 つの層に照らして数えた。
  下向き 115・同じ層 72・上向き 20 である。上向きの 20 本は 5 つの file から出ている。
  床の木の型を持つ file へ 7 本・面の生成の土台へ 7 本・凍結の実行の様態の型へ 3 本・
  天井の材料の束の読み手へ 2 本・天井の判定の印の file 名へ 1 本。
  5 つとも「層をまたいで使われる型・読み手・閉じた一覧の定数」と「ひとつの命令の口の本体」を
  同じ file に同居させており、上向きの辺はすべて前者を名指している。後者を名指す辺は 1 本も無い。

  (4) 上限は誰の決まりか。行数の上限は器（scribe2）の受付の規則であって、folio2 の設計判断ではない。
  条 P-13 は folio2 の開発を拘束するのは設計文書だと定める。
  器の都合で決まった境界は、設計文書のどこにも根拠を持たない。

  (5) 層の割り当ては何の正本か。file と置き場の名は、規則の表の行 D-11 が
  「写しの導出が掛からないもの」として名指している。したがって層の割り当ての表は
  設計文書へ写しを導出する対象ではなく、実装の側の型付きデータとして置いてよい。

  (6) 置き場の選び方。層の割り当てを実装の側（src）に置いて歯がそれを読む形にすると、
  実装が自分で自分を採点することになり、生成物どうしの突き合わせだけが合格判定になる（条 P-10 の禁じる形）。
  歯の側に置けば、採点する側と採点される側が分かれる。

decision: |
  (1) **実装の区切りの境界は責務で決める。** 器の行数の上限に当たったことを、
  file を割る理由にも、書き込み範囲から file を外す理由にもしない。
  上限に当たった便は、責務の線が引ける割り方を探すか、便の大きさを改める。

  (2) **責務の層は 6 つとし、依存は下向きだけとする。**
  土台（文書を知らない共通の型と計算）・読む（正本の byte を型に直す）・
  検査する（型に直したものを決まりに照らして数える）・導出する（正本から別の型付きの出力を作る）・
  面に出す（人が読むページを書く）・配る（生成物を置き、見せ、知らせる）の 6 つである。
  file は自分より下の層だけを名指す。同じ層どうしの名指しは許す。
  総点検の設計ノートが挙げた 5 つの層に、土台を 1 つ足した。
  合否の型と要約値の計算は文書を何も知らず、読む層にも属さないからである。

  (3) **層をまたいで使われる型・読み手・閉じた一覧の定数は、使う側の一番下の層へ降ろす。**
  上向きの辺 20 本はすべてこの形で解ける。降ろす先は新しい file で、
  元の file には命令の口の本体だけを残す。この降ろしは振る舞いを変えない。

  (4) **層の割り当てと、まだ降ろしていない上向きの辺の一覧は、歯が型付きデータで持つ。**
  歯は 2 つを数える。1 つ目は、割り当ての表の file の集合が実装の入口が数える区切りの集合と一致すること
  （新しい file は必ず層を持つ）。2 つ目は、実装の側を走査して得た上向きの辺の集合が、
  凍結した一覧と 1 本も違わないこと（多くても少なくても落ちる）。
  この一覧は実測の写しであって許可ではない。行を足す書き換えは認めず、足すなら本判断を改訂する。
  層の割り当ての表は設計文書へ写しを導出しない（規則の表の行 D-11 が file と置き場の名を対象外と定める）。

  (5) **降ろす順は、塞がっている file を先に開けてから、層をまたぐ型を降ろす。**
  便は 5 本とする（総点検の設計ノートの案は 4 本だった）。
  1 本目から 4 本目で余地 300 未満の 4 file を責務で割り（判断の記録の床・設計ノートの床・
  入口の面・憲法の面）、5 本目で床の木の型を読む層へ降ろす。
  5 本目は 7 file の名指しの行を書き換えるので、先の 4 本で余地を開けておかないと受付で断られる。
  6 本目以降の 3 本で残りの上向きの辺を 0 にする。
  どの便も振る舞いを変えず、歯の本数も変えない（境界の歯 2 本だけを 1 本目で足す）。

  (6) **この判断は実装の区切りだけを縛る。** 人が読む文書の側の分け方（面の型・観点・密度）は
  閉じた一覧が別に持ち、本判断は増やしも減らしもしない。

options:
  - id: a
    name: 責務で割り直し、依存の向きを歯で数える（採る）
    text: |
      境界の理由を責務に変え、6 つの層と下向きだけの向きの決まりを置く。
      層をまたいで使われる型と読み手を下の層へ降ろし、割り当てと残りの辺の一覧を歯が持つ。
      塞がっている 4 file を先に開け、その後で層をまたぐ型を降ろす。
    verdict: adopted
    reason: |
      境界の理由が設計文書の中に来るので、器の規則が変わっても揺れない。
      上向きの辺 20 本は 5 つの同居を解けば 0 になり、解いた副産物として塞がっている 4 file も開く。
      向きが守られているかどうかを歯が毎回数えるので、決まりが文章の中だけに残らない（条 N-2）。
      歯の側に割り当てを置くので、採点する側と採点される側が分かれる（条 P-10）。
  - id: b
    name: 器の行数の上限を緩めてもらう
    text: |
      器（scribe2）の受付の規則の上限 1,500 を、folio2 の都合に合わせて引き上げてもらう。
      いまの境界はそのまま残し、塞がっている 4 file には手を入れずに次の便を運ぶ。
    verdict: rejected
    reason: |
      塞がりは消えるが、境界が器の数で決まる形は変わらない。上限が上がれば、
      次に当たる場所が先へ動くだけである。
      境界の理由が folio2 の設計文書の外に在り続けるので、条 P-13 の言う
      「folio2 の開発を拘束するのは設計文書」という形から外れる。
      器の側の規則を folio2 の都合で変える要求でもあり、器の手番と時期が読めない。
      依存の向きの 20 本も残るので、便の書き込み範囲が責務の単位で閉じない問題は何も解けない。
  - id: c
    name: 触る便が来るたびに、その場で割る
    text: |
      いままでどおり、上限に当たった便がその場で file を半分に割って進む。
      判断の記録も層の表も置かず、歯も足さない。
    verdict: rejected
    reason: |
      いままでの 4 本がこの形で、その結果が今の塞がりである。
      割る場所はそのとき運んでいた便の中身で決まるので、同じ責務が 2 つの file に散り、
      互いを名指す形が残る（要件書の面の 3 file は既にそうなっている）。
      境界の理由が便の契約の中にしか残らず、後から読む人には数の話にしか見えない。
  - id: d
    name: 層を 5 つのままにし、土台を置かない
    text: |
      総点検の設計ノートが挙げた 5 つ（読む・検査する・導出する・面に出す・配る）をそのまま層にし、
      合否の型と要約値の計算は読む層に入れる。
    verdict: rejected
    reason: |
      合否の 3 値と終了コードの型・要約値の計算は、正本を 1 字も読まないし文書の形を何も知らない。
      読む層に入れると、その層の責務が「正本を型に直す」と言えなくなり、
      層の名が何を指すか実測から決められなくなる。
      層を 1 つ足す費用は表の 1 行と歯の 1 行だけで、割り当ての曖昧さを消す利得が上回る。

basis: [P-2, P-5, P-6, P-10, P-13, P-18, A-2, N-2, N-3, N-5, R-7, R-8, D-11, ADR-11, ADR-13]

consequences:
  - 実装の側の file は 44 から 49 に増える（降ろし先の新設 5 本）。上限を超える file は 0 本のままで、
    余地が 300 未満の file は 4 本から 0 本になる。
  - 歯の file が 1 本増える（境界の歯 2 本を持つ）。歯の本数は 2 本増え、既存の歯は 1 本も動かない。
  - 上向きの辺は 20 本から始めて、5 本目の便で 13 本、その後の 3 本で 0 本になる。
    0 本に達したあとは、上向きの辺を 1 本でも足す変更が歯で落ちる。
  - 器の行数の上限が将来外れても、本判断で引いた境界は戻さない。境界は責務で決めたからである。
  - 便の書き込み範囲が責務の単位で閉じるので、並行する便どうしの重なりが減る。
    ただし重なりが実際に減るかは測っていない見積であり、撤退条件の 1 つ目で数える。
  - 人が読む文書の側の分け方（面の型・観点・密度）は本判断の外で、閉じた一覧が別に持つ（条 N-5）。
  - 歯の側に置いた層の割り当ては、持ち主の承認なしに作業の中で書き換えられる。
    歯止めは、書き換えが必ず取り込みの審査に現れることと、上向きの辺の一覧を増やす向きに
    書き換えるなら本判断の改訂が要るという本判断の決定 (4) だけである。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 へ記帳する。
    (1) 責務で割っても受付の断りが減らない: 5 本目の便が着地した後の 10 便で、
    書き込み範囲の file の余地が足りずに受付で断られた回数を数える。3 回に達したら、
    決定 (2) の層の数と決定 (3) の降ろし方を捨てて測り直す判断の記録を起こす。
    (2) 上向きの辺が減らない: 上向きの辺の一覧が 2 便続けて 1 本も減らなかったら、
    決定 (4) の一覧の形を捨てて持ち主へ渡す。
    (3) 境界が責務で引けない場所が出る: 1 つの file を責務で割ろうとして、
    どちらの層にも属する部分が残り、割り方を決められない便が 2 本に達したら、
    決定 (2) の層の定義を捨てて測り直す。
    (4) 数えられない回が規則の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を
    「まだ分からない」に落として持ち主へ渡す。

note: |
  【出所】総点検の設計ノート docs/design/audit-2026-09-23.md の §3-c（便の列）・§3-d（本判断の案）・
  §4 の 🔴 3（module の境界を責務で割り直す）。持ち主の承認は 2026-09-23 08:13 JST、対話面 R-8、
  逐語「問いは全部推奨で」（台帳 f2-648 notes）。この承認は総点検の 6 つの問いへの回答で、
  本判断の起草はその 🔴 3 の推奨（ADR-15 を発効して運ぶ）に当たる。本判断そのものの発効の承認はまだ無い。

  【実測の出所】区切りの図・正規化行数・余地・依存の辺の全数は
  docs/design/module-map-2026-09-23.md が持つ。棚卸しの表は
  ~/.local/share/folio2/handoff-2026-09-23/audit-inventory.md の §3 と §4。
  正規化の式は器（scribe2）の規則と同じ（全行 + 1 行の字数が 120 を超える行は ceil(字数 ÷ 120) − 1 を足す）。
  基準点は origin/main の aff1b32。

  【総点検の設計ノートとの違い】§3-c は src の割り直しを便 4 本（106〜109）と見積もった。
  本判断は 5 本にする。床の木の型（schema.rs の Floor）を降ろす便が、その型を名指す 7 file の
  名指しの行を書き換えるので、先に 4 file の余地を開けておかないと受付で断られるためである。
  4 file を先に割ると、割った先の新しい file がその型を名指すので、先に型を降ろす順にすると
  上向きの辺が 1 本増える。順は「塞がりを開ける 4 本 → 型を降ろす 1 本」で確定した。
  §3-c の便 110 以降（歯の pin を性質へ）の番号はこの 1 本ぶん後ろへ動く。

  【起草時の自己点検】起草役が自分で当てた反対の問いと答えを 3 つ残す（独立の審査役による
  反対側からの確認〔grill〕はまだ行っていない。A-2.3 は条文を改訂する判断に掛かるので本判断には
  掛からないが、総点検の設計ノートの §3-d が先に行うと書いている）。
  問 1 = まだ降ろしていない上向きの辺の一覧は、規則の例外機構（条 N-3 が拒むもの）ではないか。
  答 = 一覧は「許可」ではなく凍結した実測である。歯は集合の一致を見るので、辺を 1 本足しても
  1 本減らしても落ちる。無効化の旗も「今回だけ」の口も持たない。ただし、一覧を人が書き換えれば
  辺は足せる。その歯止めは決定 (4) の「足すなら本判断を改訂する」という文と取り込みの審査だけで、
  機械の側の歯止めは無い。これは弱点として consequences に書いた。
  問 2 = 検査する層が導出する層を名指す辺（天井の材料の束の組み直し）は、
  層の順を決めても消えないのではないか。
  答 = 束を組む関数は byte を返すだけで何も書かない。書く関数は別に在る。
  読み手と組み手を読む層へ、書き手を導出する層へ分ければ、辺は下向きになる。実測で確かめた。
  問 3 = 層を 6 つに増やすと、割り当ての判断が増えて境界の理由がまた曖昧にならないか。
  答 = 44 file を 6 つへ割り当てた実測では、どの層とも決められない file は 0 本だった。
  決められない file が出た場合は撤退条件の 3 つ目で数える。

  【本判断が置かない規則】実装の区切りの境界の原則は設計文書（本判断）が正本で、
  それを機械が執行する形は歯（型付きデータ）が正本である（条 P-5 の 2 面）。
  規則の表に行は足さない。行を足すと、同じことを設計文書と規則の表の 2 か所が持つことになる。
