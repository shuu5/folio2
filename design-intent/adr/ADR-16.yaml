# folio2 判断の記録 ADR-16 — M3 = 契約表を持つ設計ノートを、外部の利用者 1 つ（scribe2）が自分の repo で folio2 の床に掛けられる形
# 状態: proposed（起草 2026-09-23・起草役 = orchestrator 席の係・承認欄なし・反対側からの確認〔grill〕は未実施）。
# 出所 = scribe2 からの移行の依頼への folio2 席の回答 ~/.local/share/folio2/handoff-2026-09-23/scribe2-migration-reply.md の §1「M3 の最小の口」と、
# 事実の一覧 同 dir の migration-facts.md（出所付き・実測込み）。本判断はその §1 のうち folio2 側の判断が要る部分だけを持つ。
# 起草の記録（読んだ材料・実測の手順・迷った点・grill に問うてほしい点）= 同 dir の adr16-draft.md。
# 実測は scratchpad の写しの repo（folio2 の design-intent を削って作った「利用者の最小の design-intent」）に main 0f00d59 の folio を撃った。

id: ADR-16
title: M3 は「契約表を持つ設計ノートを外部の利用者 1 つが自分の repo で床に掛けられる」に限り、1 つの組み立てのまま、列の根を憲法の名ごとの表に広げ、値域と部品目録は道具の側に残す

status: proposed
date: 2026-09-23

plain: |
  folio2 の道具を、はじめて folio2 以外の場所（scribe2 の repo）で使えるようにするための判断です。
  いまの道具は、folio2 のためだけに作られた箇所がいくつかあって、ほかの repo の文書を検査すると、
  どう直しても「合格」まで届きません。写しの repo で実際に試して確かめました。

  まず、次の段（M3）でやることを小さく決めます。
  scribe2 の設計文書のうち「便 1 本で何を作るか」の表（契約表）を持つものだけを、
  folio2 の形（YAML）で scribe2 の repo に置き、道具の検査に掛けられるようにする。これだけです。
  scribe2 の憲法・判断の記録・調べものの文書を移すこと、人が読むページを作ること、
  AI による読みやすさの検査は、この段に入れません。

  次に、folio2 専用になっている箇所を 1 つずつ扱います。
  道具を scribe2 用に別に作り分けることはしません。道具は 1 つのままにします。
  (1) 憲法の写しの列の「いちばん最初の 1 枚」の番号は、いま道具の中に folio2 の分が 1 つだけ入っています。
  これを「憲法の名前ごとの表」に広げ、scribe2 の分を 1 行足せるようにします。
  足すには folio2 の側の便と、scribe2 の持ち主の OK が要ります。scribe2 の側の文書を書き換えても、この表は動きません。
  (2) 憲法の値の選び方の一覧（段・強さなど）と、ページの部品の一覧は、道具の側に残します。
  これはページの作り方や検査のしかたと一体なので、repo ごとに変えると、道具が知らない値が来たときに
  ページの名札を出せなくなるからです。そのかわり、repo の側の一覧が道具の一覧と違ったら、
  検査は「まだ分からない」と正直に言うようにします。
  (3) 新しい repo では、写しの列と番号の一覧の 2 つの基準が、互いに「相手が無いから作れない」と断り合って、
  どちらも作れません。これも試して確かめました。2 つが両方とも無いときだけ受ける 1 回の口で、同時に作れるようにします。
  (4) 新しい repo で最初の文書一式を書く命令（folio init）を足します。いまは、案内の 1 行が
  「相談窓口の命令を撃て」と言うのに、その命令は新しい repo では動かず、行き止まりになっています。

  scribe2 の側の「決まりの文には番号を添え、数と単位を書かない」という仮の検査は、
  scribe2 の文書が道具の検査に通るようになった時点で、道具の側へ引き取ります。
  2 つの検査は、決まりの言葉と単位の一覧は同じですが、「番号」として数える形が違います
  （folio2 は条・規則・要件・契約の番号、scribe2 は節の記号・判断の記録・規則・台帳の番号）。
  そこで、番号として数える形の一覧を道具の中から規則の表の行へ移し、両方を合わせた一覧にします。
  形を認めるだけで、その番号が実在するかまでは調べません。
  契約表から scribe2 が読む形の写しを作る口（FR11）は、scribe2 の側の読む口が 2026-09-22 に出来たので、
  保留を解く条件は満たされました。要件書の版を上げて保留を解き、便を起こします。
  ページの見た目の直し（設計ノートのページの章の上限 12 を緩めることを含む）は、この段に入れません。

  最後に、やめる条件を決めておきます。scribe2 の文書を検査して、道具の中の folio2 専用の値が原因で
  「まだ分からない」になる種類が新しく 3 つ出たら、今回の洗い出しは足りなかったということなので、測り直します。
  folio2 自身の検査の結果が、この判断の便のせいで 1 度でも変わったら止めます。
  道具を作り分けないと進めない場面が 2 回来たら、この判断を捨てて考え直します。

context: |
  (1) 依頼と前提。scribe2 は folio2 の最初の外部の利用者になる。scribe2 の依頼（台帳 s2-07l.214 を畳むため・持ち主の指示）に
  folio2 席が回答し、その §1 が M3 の最小の口を 5 つ挙げた。判断の記録 ADR-3 決定 (8) と要件書 CON8 が
  「YAML へ移す最初の範囲は契約表を持つ設計文書だけ」と裁定済みである。条 P-13.4 は、自分の便で自分を運ぶ運用（self-host）を
  外部の利用者で受入が通った後に始めると定めている。M3 はその「外部の利用者の受入」に当たる最初の段である。
  いまの要件書（第 1.30 版）には M3 の範囲の節が無く、M3 の語は保留の 3 本（FR11・FR13・NFR1）の「M3 の入口で再判定」の句にしか出ない。
  要件書の最上位の節は床の閉じた一覧（17 節）なので、M3 の範囲の節（scope_m3）を足すには床の定数の改訂が要る。

  (2) 実測: 今の道具は外部の repo を合格させられない。folio2 の design-intent を削って「利用者の最小の design-intent」を
  写しの repo に作り（条 3 本・規則の表の行 2 本・要件 1 本・受入基準 1 本・判断の記録 1 本・契約表を持つ設計ノート 1 本）、
  統合先の先頭（main 0f00d59）の道具を撃った。違反 0 まで削った時点で「まだ分からない」が 2 件残り、どの順に凍結の旗を撃っても消えなかった。
  (ア) 列の根。凍結 anchor の列の最初の 1 枚の要約値は床の定数で、folio2 の憲法 第 1.0 版の値 1 つだけを持つ（判断の記録 ADR-2 決定 (3)）。
  別の中身の憲法で列を始めると「列の根の要約値が床の定数と違う」の違反で凍結できない（実測）。
  (イ) 始まりの凍結の輪。憲法の列（anchors の憲法の写し）も番号の一覧（anchors の id の一覧）も 0 本の repo では、
  憲法の列を凍結する旗は「id の一覧が無いので測れない」を理由に断り、id の一覧を凍結する旗は「凍結 anchor が 0 本」を理由に断る（実測）。
  各旗は自分の基準の不在だけを数えから外し、相手の不在は外さない。folio2 は憲法の列が先に在り、id の一覧を後の便で足したので、この輪に当たらなかった。
  以上 2 つは列の根が一致していても残る順序の問題と、列の根そのものの問題で、互いに独立である。

  (3) 他に folio2 専用に焼かれている箇所。回答が挙げた 3 つ（列の根・憲法の値域・部品目録）を 実装の側（src）で確かめ、実測で 3 つ足した。
  (ウ) 憲法の値域（段・縛る相手・型・強度など 10 鍵）は、組み立て時に組み立ての script（build.rs）が folio2 の憲法の正本の値域の節（schema.enums）から型へ導出する。
  床（folio check）は条の値をこの型で引くので、利用者の憲法が別の値を宣言して使うと「憲法の値域に無い」の違反になる。
  文言は「憲法の値域」だが、照合先は利用者の憲法ではなく道具を組み立てた folio2 の憲法である。
  面の生成器は同じずれを「組み立て時の値域と違う」として数えるが、床は数えない。
  面の名札の表（段・強度・型などの名札と色）は型の値の全部を並べた場合分けで持ち、その他の値を受ける枝を持たない（判断の記録 ADR-11 決定 (4)②）。
  このうち 2 鍵（根拠の種別・機構がいつ実在するか）の値は folio2 の出自と段の名そのものである（前の版の事故・scribe2 の条・folio2 の裁定／M0・便 0・M1 など）。
  (エ) 部品目録（parts.json）は組み立て時に導出して焼き込む。床は部品目録を読まず、写しの repo に部品目録が無くても床の合否は変わらない（実測）。
  置き場の部品目録を読むのは部品の検査の命令だけで、組み立て時と違えば「組み立て直す」と断る。面の生成器は組み立て時に焼いた一覧を使い、様式の 2 file（folio.css・folio-ui.js）は検査される置き場の下から写す。
  (オ) 床が id で名指す条と行。承認の対話面は規則の表の行 R-8 に固定され（判断の記録と設計ノートの欄の決まりの値域）、
  散文の門は行 R-16 の値を読み（無ければ「まだ分からない」）、要件書と語彙の生成区間の説明の注は条 N-3 を名指す。
  規則の表の行は必ず縛る条を持ち、どの条からも参照されない行は数えられる（R-4）。
  実測で、利用者の最小の design-intent が違反 0 に届くには、行 R-8 と R-16 と、それを縛る条と、条 N-3 が要った。
  (カ) 判断の記録の欄の決まりの出所。判断の記録の欄の決まりの file の先頭の欄（meta.decided_by）は、同じ design-intent の判断の記録の実在を求める。
  folio2 の写しでは folio2 の ADR-1 と ADR-2 を名指しており、利用者の repo では解決しない（実測）。

  (4) 値を repo の側から読む前例。散文の門の印と単位の一覧（行 R-16）、注入の上限（行 R-2）などは、既に検査される repo の規則の表から実行時に読んでいる。
  規則の表の行は裁定 id と時刻を持ち（条 P-17.1）、値を緩めるときは検証を前置する（条 P-17.4）。
  判断の記録 ADR-11 決定 (3)(ア) は、部品目録と憲法の値域を「持ち主か設計文書が決める中身で、型付きの file が正本」と分類し、
  実装はそれを「実行時に読むか組み立て時に導出する」とした。同 (4)② は、憲法の値域を組み立て時の導出に替え、実行時に読む形は採れないとした
  （欄の決まりの木が組み立て時に決まる定数だからである）。一方、判断の記録の欄の決まりの file の先頭の注は、
  列の根を「data 側で動かすことはできない」値の 1 つに挙げている（条 N-3.1）。

  (5) 読まれない .md。器 scribe2 の設計文書（docs/design の Markdown）は folio のどの口も読まない。
  folio2 の設計ノートの正本は design-intent の設計ノートの置き場の YAML 1 file である（条 P-6.1）。
  契約表の欄の決まりは器が導出した型付き file（contracts/schema.toml）から読み、この口（FR10）は実装済みで、契約表を持つ設計ノートは既に床で検査できる。
  導出物（FR11）の口は未実装で保留である。その前提の器の口 s2-07l.473 は 2026-09-22 に着地済みで、
  器は契約表の指し先（pointer）が導出 toml を指すとき、その行の節の逐語（goal）を受ける（scribe2 の返事・2026-09-23）。

  (6) 散文の門の突き合わせ（scribe2 の返事・2026-09-23）。器の暫定の門（器の検査の命令の定数）と folio2 の行 R-16 は、
  規範の印 5 種・「禁止」の直後の 5 文字・単位 13 語（宣言の順まで）・母集団から外すもの・文の区切りが同じである。
  違うのは「参照 id」として数える形だけである。folio2 は実装の定数（prose.rs の条・規則・要件の接頭辞の 3 表と、契約 id の形）で
  条（P-・A-・N-）・規則（R-・D-）・要件（GOAL・NFR・FR・AC・CON）・契約（<文書 id>#<行 id>）を数え、
  器は節の記号（§）・判断の記録（ADR-）・規則（R-）・台帳 id（s2-）を数える。共通は規則の R- だけである。
  参照 id の形の一覧を実装の中に持つことは、判断の記録 ADR-11 決定 (4)⑧（台帳 f2-648.76）が生成区間へ出すと決めた論点と同じである。

  (7) 面の側の制約。設計ノートの面は章の上限 12（節の数 + 図が在れば 1）を持ち、超えると面を導出せず、配信の組み立ては全部か無しかである。
  散文の本文は書式付きの文章（Markdown）として描かれない。章の上限は実装にだけ在る閾値で、規則の表の行へ移すことは
  判断の記録 ADR-11 決定 (4)⑦ で決まっている（台帳 f2-648.75・未着地）。

decision: |
  (1) M3 の範囲。M3 は「契約表を持つ設計ノートを、外部の利用者 1 つ（scribe2）が自分の repo の design-intent に置き、
  同じ 1 つの folio の床に掛けて合格まで届き、器が読む導出物をそこから作れる」に限る。
  入口は本判断の発効と、要件書に M3 の範囲の節（scope_m3）を足す版の発効である。
  出口は、利用者の 1 本目の設計ノートが次の 3 つの判定点を通ったときである:
  ① 利用者の repo で床が合格する、② 導出物が利用者の repo に着地して差分 0 を数えられる、③ 器の受付がその導出物を読んで通す。
  M3 に入れないもの = 利用者の憲法・判断の記録・調べものの文書の移行、面の生成と配信（build の面・serve・face・figure）、
  天井（ceiling）、注入（inject）、着地の印（FR13）、常時注入の量（NFR1）、面の見た目の直し（設計ノートの面の章の上限を緩めることを含む）。
  契約表を持たない設計文書の移行は、要件書 CON8 のとおり M3 の後に改めて問う。
  M3 の範囲の節を足すには、要件書の最上位の節の閉じた一覧（床の定数）を改訂する便が、要件書の版上げより先に要る。

  (2) 道具は 1 つの組み立てのままにする。利用者ごとに定数を替えた別の組み立てを持たない。
  folio2 専用に焼かれている箇所は、次の (ア)〜(カ) のとおり扱う。
  判定の式は 1 つで、利用者ごとに違ってよいのは「検査される design-intent の型付きデータ」か「道具の側の閉じた表の行」だけである。

  (ア) 列の根は、床の定数を「憲法の名（憲法の正本の meta.id）ごとの、最初の版と根の要約値の表」に広げる。
  folio2 の行（folio2 の憲法の名・第 1.0 版・今の要約値）は 1 字も変えない。表に無い名の憲法の列の根は、
  凍結の旗が要約値の全桁を出して断り（表に行を足すための値を出す）、既に在る列なら床が違反として落とす。どちらも合格にはならない。
  表に行を足すのは folio2 の便で、契約表の行か設計ノートが利用者の持ち主の承認の裁定 id を名指す（規則の表の行 D-11 の手順）。
  表は判断の記録の欄の決まりの file の生成区間に写しを導出する（条 P-5.6）。
  検査される repo の側の data（憲法の名を書き換える・根の file を書き換える）で表の行を選び直しても、
  別の行の要約値との不一致か、表に無い名の断りにしかならない。

  (イ) 始まりの凍結は、憲法の列と id の一覧が両方とも 0 本のときにだけ受ける 1 回の口で、2 つを同時に書く（旗の名は便で決める）。
  この口の前提は、その 2 つの不在以外の検査が全部 0 違反で「まだ分からない」も無いことである。
  どちらか 1 本でも在れば断る。書いた後は、ふだんの床が全部の検査を回す。今ある 2 つの旗の前提は変えない。

  (ウ) 憲法の値域は、組み立て時の導出のまま道具の側に残す（判断の記録 ADR-11 決定 (4)② を変えない）。
  値域を利用者ごとの data にすると失うものは、面の名札の表の網羅（値が足されたら組み立てが通らないこと）と、
  強度の値に掛かる文末の極性の検査のように値の意味を式が持つ箇所の確かさである。
  代わりに、床に「置き場の憲法の値域の節が、組み立てた版の値域と集合で一致するか」を数える口を足し、
  違えば「組み立て時の値域と違う」の「まだ分からない」にする（面の生成器が既に持つ比べ方と同じ・条 P-4.2）。
  利用者の憲法は M3 では移さないので、骨格の命令が書く値域は組み立てた版の値域そのものである。
  利用者の憲法が道具の値域の外の値を要るようになったら、それは利用者の憲法を移す別の判断の記録で扱い、
  そのとき 10 鍵を「道具の意味を持つ鍵」と「repo の出自を持つ鍵（根拠の種別・機構がいつ実在するか）」に分けるかを問う。

  (エ) 部品目録は repo ごとに持たない。部品目録は 1 つの生成器（条 P-2.1）の閉じた一覧（条 P-2.4）で、
  部品を足すには生成器の実装が要るので、利用者の data で広げられる値ではない。床は部品目録を読まないので M3 の床には効かない。
  面の生成（様式の file を置き場の下から写す形を含む）を利用者に広げるときに、別の判断の記録で扱う。

  (オ) 床が id で名指す条と行（今の実測で 条 N-3・規則の表の行 R-8 と R-16、および 2 行が縛る条）は、
  床の定数に閉じた一覧として置き、骨格の命令が利用者の repo にその id を持つ最小の条と行を書く。
  条の本文と行の値は雛形であり、利用者の持ち主が憲法の発効の承認で決める（行の初版の裁定は条 P-17.3 の形）。
  行 R-16 の値の雛形は folio2 の今の値である。雛形は 1 度だけ書く種であって、以後 folio2 の値と一致させる写しではない（条 P-6.4）。

  (カ) 判断の記録の欄の決まりの出所は、骨格の命令が利用者の repo に最初の判断の記録（folio の欄の決まりを採る・提案中）を書き、
  欄の決まりの file の先頭の欄がそれを名指す形にする。発効は利用者の持ち主の承認で行う。

  (3) 骨格の命令（folio init --dir）を足す。正本 7 file・判断の記録の置き場と欄の決まり・設計ノートの置き場と欄の決まりを書く。
  生成区間は床の定数から書き（folio schema --write と同じ導出）、(2)(オ)(カ) の最小の条・行・判断の記録を足す。
  相談窓口の質問は、骨格の命令の雛形として道具に持つ（組み立て時に folio2 の相談窓口の正本から導出する）。
  書いた後は利用者の repo に書かれた相談窓口の file（intake.yaml）が正本であり、folio intake は今のまま置き場から読む（判断の記録 ADR-6 決定 (1) を変えない）。
  置き場に正本が 1 本でも在れば何も書かずに断る（上書きしない・条 N-1.1）。
  案内の 1 行（FR3）は、憲法の正本が無い置き場では骨格の命令を案内する（今の「相談窓口の命令を撃て」は新しい repo で行き止まりになる）。

  (4) 条 N-3.1 との整合。N-3.1 が拒むのは規則の例外機構（無効化の旗・「今回だけ」の口）である。
  本判断が置く物差しは「検査される repo の側の data を書き換えて、落ちるはずの検査を通せるか」で、(2) の 6 つはどれも通せない。
  (ア) の表は道具の側に在り、検査される側は行を選べるだけで、選び直しは断りにしかならない。
  (イ) の口は自分が書く 2 つの基準の不在しか数えから外さず、書いた後はふだんの床が全部を数える。
  (ウ) は値域のずれを「まだ分からない」に上げる向きで、緩める向きの口を持たない。
  (エ) は床の外。(オ)(カ) は雛形を書くだけで、書いた後の値は利用者の型付きデータ（裁定 id を持つ規則の表の行・承認欄を持つ判断の記録）である。
  利用者の規則の表の値（散文の門の印と単位など）を実行時に読むのは今もそうで、それは利用者の持ち主が裁定する repo ごとの正本であり、例外の口ではない。
  決定 (6) の参照 id の形の一覧も同じく行 R-16 の値で、改訂は裁定 id を持ち、変更の範囲は本判断の承認で読まれる。
  folio2 の参照 id の床の母集団は、検査される design-intent の正本の中に閉じたまま広げない（判断の記録 ADR-3 決定 (6)）。
  利用者の要件 id は利用者の design-intent の中では内部の id であり、folio2 の design-intent からは解決しない。

  (5) M3 の入口の再判定（保留の 3 本）。
  FR11（導出物と差分 0）の保留を解く条件は、器の口 s2-07l.473 の着地であり、この条件は満たされた（2026-09-22 着地・文脈 (5)）。
  保留の解除は要件書の版上げ（持ち主の承認・決定 (7) の版と同じ版）で運び、便はその後に起こす。
  導出物の形は判断の記録 ADR-3 決定 (4) のまま（先頭の版の宣言・契約の配列・各行の節の逐語・空の一覧は欄名を省く）で、
  器の読み手が受ける形との一致は、導出物の便の受入で器の受付に実物を読ませて確かめる（判定点 ③）。
  導出物の口は面の組み立て（様式の写し・図の道具）に依らずに撃てる形にする（利用者の repo は様式の file も図の道具も持たない）。
  FR13（着地の印）と NFR1（常時注入の量）は M3 に入れず、保留のまま残す。

  (6) 散文の門の引き取り（判断の記録 ADR-3 決定 (7)）。式は道具の 1 つで、一覧は検査される design-intent の行 R-16 の値である。
  印・「禁止」の直後の文字・単位・母集団・文の区切りは器の暫定の門と同じなので（文脈 (6)）、そのまま引き取る。
  参照 id の形の一覧は、実装の定数（prose.rs の条・規則・要件の接頭辞と契約 id の形）から行 R-16 の値の型付きの欄へ移す
  （条 P-5.1・P-5.6・判断の記録 ADR-11 決定 (4)⑧ と同じ論点）。値は folio2 と器の形の和集合 =
  条（P-・A-・N-・枝番を取れる）・規則（R-・D-）・要件（GOAL・NFR・FR・AC・CON）・契約（<文書 id>#<行 id>）・
  判断の記録（ADR-）・節（§ と数）・台帳 id（s2- と f2- の形）とする。
  散文の門はこの形を「参照 id が在る」と認めるだけで、行き先を解決しない（判断の記録 ADR-3 決定 (6)・行 R-4 の母集団は広げない）。
  行 R-16 の値の改訂は裁定 id と時刻を行に付け（条 P-17.1）、本判断の発効の承認と同じ承認で束ねる。
  この改訂は folio2 の門にとって、参照 id と認める形が増える向き（通る文が増える向き）である。
  利用者の行 R-16 の雛形は改訂後の folio2 の値で、利用者の 1 本目の設計ノートが判定点 ① を通った時点で、
  器の側の暫定の門を撤去するよう器へ求める。雛形を書いた後の利用者の行 R-16 は利用者の持ち主が裁定する値である。

  (7) 便の列と順序。判断の記録 ADR-15 の列（便 106〜116）と一括 14 の後に運ぶ（判断の記録の床の file の余地が ADR-15 の列で開くため）。
  ① 要件書の最上位の節の閉じた一覧に M3 の範囲の節を足す（小・1 便）→ 要件書の版上げ（M3 の範囲・骨格の命令と列の根の表と始まりの凍結の要件と受入基準・持ち主の承認）
  → ② 列の根の表と始まりの凍結の口（中・1〜2 便）→ ③ 値域のずれを床で数える（小・1 便）
  → ④ 骨格の命令と案内の 1 行（中・1〜2 便）→ ⑤ 導出物の口（中・1〜2 便）
  → ⑥ 参照 id の形の一覧を行 R-16 の値から読む（小・1 便・行 R-16 の値の改訂と同じ便か、その直後）。
  ⑥ は ② 〜 ⑤ と書き換える file が重ならないので、並べて運んでよい。
  合計 7〜9 便。利用者の側の便（読む file の述語・drift の歯・要件書の最小の写しの導出・暫定の門の撤去）と、
  列の根の表に利用者の行を足す便は、利用者が骨格を書き、持ち主が憲法を承認した後に起こす。

options:
  - id: a
    name: 1 つの組み立てのまま、列の根を憲法の名ごとの表に広げ、値域と部品目録は道具の側に残す（採る）
    text: |
      M3 を契約表を持つ設計ノートだけに限る。列の根は道具の側の表に利用者の行を足し、始まりの凍結の輪は両方 0 本のときだけの口で解く。
      憲法の値域と部品目録は道具の閉じた一覧のまま残し、値域のずれは「まだ分からない」にする。骨格の命令で最小の design-intent を書く。
    verdict: adopted
    reason: |
      実測で見つかった 6 つの束縛のうち、利用者の合格を塞いでいるのは列の根と始まりの凍結の輪の 2 つで、残りは雛形で足りる。
      列の根を道具の側に置いたままなので、検査される側の data で根を選び直せない（条 N-3.1 の物差しを満たす）。
      利用者の repo は folio2 と別の版管理なので、道具の側の表は利用者から見て外側の証人になり、今の folio2 自身より強い守りになる。
      値域を道具に残すので、面の名札の網羅と値の意味を持つ式を失わない。folio2 自身の値は 1 つも変わらない。
  - id: b
    name: 利用者ごとに定数を替えた別の組み立てを持つ
    text: |
      scribe2 用に、列の根・値域・部品目録を scribe2 の値にした別の組み立てを作り、scribe2 はそれを使う。
    verdict: rejected
    reason: |
      判定の式は同じでも、道具が 2 つになり、どちらの組み立てで検査したかが合否の一部になる。
      folio2 の変更のたびに 2 つを組み立てて配る費用が続き、片方だけ古い組み立てが残る。
      人が読むページを 1 つの生成器から出す条 P-2.1 とも、同じ内容を 2 面に人が持たない条 P-6.4 とも逆向きである。
  - id: c
    name: scribe2 の設計文書を folio2 の design-intent の中に置く
    text: |
      folio2 の repo の design-intent に scribe2 の設計ノートを置き、folio2 の床と列の根のまま検査する。
    verdict: rejected
    reason: |
      folio2 の開発を拘束するのは folio2 の設計文書であり（条 P-13.1）、他の repo の文書を足すと拘束の範囲が混ざる。
      契約表の要件の欄が scribe2 の要件を指すので、folio2 の参照 id の床の母集団を他の repo へ広げることになる（判断の記録 ADR-3 決定 (6) の反転）。
      器は導出物を消費側の repo の版管理から読むので（同 決定 (4)）、置き場とも合わない。
  - id: d
    name: 道具が器の設計文書の Markdown を直接読む
    text: |
      scribe2 の設計文書（docs/design の Markdown）をそのまま道具が読み、契約表の区間と散文を検査する。
    verdict: rejected
    reason: |
      文書の正本は YAML 1 file で、人が読むページはそこから生成する（条 P-6.1）。
      その書式の文章を読む口を足すと、同じ設計ノートの正本の形が 2 つになり、床の欄の決まりが Markdown の書き方に開く。
      判断の記録 ADR-3 決定 (8) が「M1 で設計ノートの YAML 正本へ移す」と決めた向きの逆でもある。
  - id: e
    name: M3 を「scribe2 の設計文書を全部移す」にする
    text: |
      憲法・判断の記録・調べものの文書・語彙まで含めて、scribe2 の設計文書を全部 folio2 の形へ移す段を M3 とする。
    verdict: rejected
    reason: |
      判断の記録の欄の決まりは id の形と必須の欄（案・撤退条件・平易文・根拠）を持ち、凍結済みの判断を 1 字も変えずに写す欄が無い。
      憲法の条 id の形も違い、移すなら改番の論点（条 P-7.1）が出る。調べものの文書に当たる型は無い。
      どれも持ち主の裁定を要する別の論点で、要件書 CON8 が「最初は契約表を持つ設計文書だけ」と裁定済みである。
  - id: f
    name: 列の根を利用者の repo の data に置き、最初の凍結で自分で決める
    text: |
      列の根の要約値を床の定数から外し、利用者の repo の凍結 anchor の置き場の file に最初の凍結が書く。
      以後はその file を版管理の履歴の照合で守る。folio2 の値は歯の凍結の針に移す。
    verdict: rejected
    reason: |
      利用者ごとに folio2 の便が要らない利点はある。しかし根を決めるのが検査される側の data になり、
      欄の決まりの file の先頭の注が挙げる「data 側で動かせない値」から列の根が外れる（条 N-3.1 の読み方の改訂が要る）。
      守りは履歴の照合だけになり、履歴ごと作り直した写しを持ち帰る細工には外側の証人が無い。
      M3 の利用者は 1 つなので、表に 1 行足す費用の方が小さい。利用者が増えたときの撤退条件で見直す。
  - id: g
    name: 憲法の値域を実行時に利用者の憲法から読む
    text: |
      値域を組み立て時の型から外し、検査される repo の憲法の値域の節を実行時に読む。名札の表は既定の枝で受ける。
    verdict: rejected
    reason: |
      面の名札の表の網羅（値が変わったら組み立てが通らない）を失い、名札の無い値が既定の枝で黙って描かれる。
      強度の値に文末の極性の式が掛かるように、値の意味を式が持つ鍵があり、data で値を足しても式は意味を知らない。
      判断の記録 ADR-11 決定 (4)② が組み立て時の導出を選んだ理由（欄の決まりの木は組み立て時に決まる定数）とも衝突する。
      M3 は利用者の憲法を移さないので、今この費用を払う理由が無い。
  - id: h
    name: 支度表が「持たない」とした文書の検査を床が飛ばす
    text: |
      利用者の支度表で憲法や判断の記録を持たないと答えた repo では、正本 7 file のうち無い file と、それに掛かる検査を床が数えない。
    verdict: rejected
    reason: |
      検査される側の data で検査を外す口であり、条 N-3.1 の言う無効化の旗そのものになる。
      実行しなかった検査を「異常なし」と扱わない条 P-4.1 とも衝突する。最小の条と行を雛形で持てば同じ目的に届く。
  - id: i
    name: M3 で設計ノートの面の章の上限を緩める
    text: |
      利用者の設計文書は節が多いので、設計ノートの面の章の上限 12 を M3 の中で引き上げ、節をまとめずに移せるようにする。
    verdict: rejected
    reason: |
      上限に当たるから境界を動かす形は、器の行数の上限を境界の理由にしないと決めた判断の記録 ADR-15 の向きと逆である。
      面の見た目は M3 の範囲の外で、面の側の上限を変えるかは面の生成器の撤退条件（判断の記録 ADR-5）の側で問う論点である。
      上限はまず規則の表の行へ移す（判断の記録 ADR-11 決定 (4)⑦）。値を変えるのは、その行の裁定として別に扱う。
      M3 の床と導出物は面を通らないので、上限は M3 の出口の判定点 3 つのどれにも効かない。

basis: [P-2, P-4, P-5, P-6, P-7, P-8, P-10, P-11, P-13, P-17, A-2, N-1, N-3, R-2, R-4, R-7, R-8, R-16, D-11, FR3, FR10, FR11, FR12, FR13, NFR1, CON8, ADR-1, ADR-2, ADR-3, ADR-5, ADR-6, ADR-9, ADR-11, ADR-15]

revises:
  - {target: ADR-2, decision: (3), kind: widen, summary: 列の根の anchor の要約値と一致させる床の定数を、folio2 の憲法の値 1 つから、憲法の名ごとの最初の版と要約値の表へ広げる（folio2 の行は変えない）}

consequences:
  - 判断の記録の欄の決まりの file の生成区間のうち、列の根の欄の形が「値 1 つ」から「表」に変わる。folio2 の行の値は変わらない。
    利用者の repo の同じ生成区間も同じ表の写しになるので、表に行を足す便のたびに、全ての利用者が生成区間を書き直す（folio schema --write）。
  - 列の根の表に利用者の憲法の要約値が載るので、利用者の憲法の第 1.0 版の中身は、表に行を足した後は変えられない。
    利用者の持ち主が憲法を承認する前に、骨格の条と行の本文を決めきる必要がある。
  - 利用者の repo には、利用者の本来の憲法（前の版の文書）とは別に、床が名指す最小の条と行だけを持つ骨格の憲法が並ぶ。
    骨格の憲法が縛るのは folio の design-intent の運用だけである。利用者の本来の憲法を移すときは、骨格の条の番号との衝突を含めて別の判断の記録で扱う。
  - 床が名指す条と行の閉じた一覧が床の定数として明示される。生成区間の説明の注が別の条 id を名指すように変わると、その一覧も同じ便で変わる。
  - 値域のずれを数える口が床に入ると、folio2 自身の置き場では差は 0 で、合否は変わらない。
  - 利用者の repo は、要件書として利用者の要件の最小の写し（前の版の要件書からの導出物）を持つ。契約表の要件の欄がそれに解決される。
    写しの導出は利用者の側の便である。
  - 利用者の repo は図の道具も様式の file も持たない。設計ノートに図を置くと床は型だけを見るが、面の生成は M3 の外なので描かれない。
  - 行 R-16 の値に参照 id の形の一覧が加わり、その一覧が folio2 と器の形の和集合になる。folio2 自身の設計ノートの散文でも、
    節の記号・判断の記録・台帳 id だけを添えた規範の文が門を通るようになる（門が緩む向き）。
    これを folio2 の門で認めるかは反対側からの確認で問う（和集合をやめて、repo ごとに一覧を持つ案もある）。
  - 本判断は条文を改訂しない。規則の表の行は足さず、行 R-16 の値を改訂する（列の根の表は実装の型付きの定数で、写しは生成区間に置く）。

retreat:
  kind: measure
  condition: |
    (1) 洗い出しの漏れ。数えるのは利用者の 1 本目の設計ノートを運ぶ席で、台帳 f2-648 へ記帳する。
    本判断の便が揃った後、利用者の repo で床が「まだ分からない」か違反を出したうち、原因が利用者の中身でなく
    道具に焼かれた folio2 専用の値であるものを、原因の種類ごとに数える。本判断の文脈 (2)(3) の (ア)〜(カ) の 6 つに無い種類が 3 つに達したら、
    決定 (2) の扱いを捨てて洗い出しからやり直す判断の記録を起こす。

    (2) folio2 自身の値の変化。本判断の便のどれかの着地の後に、folio2 自身の置き場の床の結果（合否・違反と「まだ分からない」の件数）か、
    列の根の表の folio2 の行か、組み立てた憲法の値域が、着地の前と違っていたら、その便を戻して決定 (2) の該当する項を捨てる。
    数えるのは取り込みの審査で、1 回で発動する。

    (3) 別の組み立てが要る場面。利用者が道具の値域の外の値か、部品目録の外の部品を要り、別の判断の記録を起こすまで待てないと
    持ち主が判じた場面が 2 回に達したら、決定 (2)(ウ)(エ) を捨てて、repo ごとの値域と部品の形を比べる判断の記録を起こす。
    利用者が増えて列の根の表に folio2 以外の行が 3 行に達したときも、案 f と比べ直す判断の記録を起こす。

    (4) 数えられない回が 2 回を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す。
    「同じ」とみなすのは（撤退条件の番号・数えられなかった理由・対象の便）の 3 つ組が一致する回である。
    この 2 回は本判断が自分で置く数で、規則の表の行 R-7 の繰り返し上限とは母集団が違う。

note: |
