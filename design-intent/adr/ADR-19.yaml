id: ADR-19
title: 不合格の後の往復は、直しの一括の枝の上で周を回し直して閉じ、4 観点とも合格した枝だけを 1 回の承認で持ち主へ出す — 周の中身と読む字は変えず、往復ごとの承認待ちだけを減らす

status: proposed
date: 2026-09-24

plain: |
  AI が意味を読む検査（天井）の 1 周が不合格になったあとの、直して回し直す往復の運び方を変えます。
  いまは、不合格の周ごとに、席が直しをまとめ（一括）、あなたの承認を待ち、本流に入れてから次の周を回します。
  次の周がまた不合格なら、もう一度直して、もう一度あなたの承認を待ちます。
  この判断では、直しの一括を作ったら、あなたに出す前に、その一括の作業の枝の上で次の周を回します。
  不合格なら同じ枝に直しを足して、また回します（直さずに回し直して偶然の合格を待つことはしません）。4 観点とも合格したら、その枝をまとめて 1 回だけあなたに出します。
  周が読む字は今と同じで全部です。合格した観点の判定を次の周へ持ち越すこともしません。
  変わるのは、往復のたびにあなたの承認を待たなくなることと、あなたが承認する字が、すでに天井に合格した字になることです。
  過去 28 周に当てると、不合格の後の直しの取り込み 18 回が、7 回の承認にまとまります。
  各連鎖の最後の 1 回を除く承認待ちは合計でおよそ 9 時間でした（大半は夜の間の 1 回）。周の回数そのものは減りません。
  同じ種類の失敗が規則の表の行 R-7 の回数を超えたとき、条文の改訂や判断の発効のようにあなたの選択が要るとき、消す操作が要るときは、
  枝の上の往復を止めて、今までどおりその場であなたに問います。
  この形は、承認の記帳（承認欄・版の来歴・規則の表の裁定の欄）だけの変更で天井の印が古くならないこと（判断の記録 ADR-18 の案 a）に依ります。
  ADR-18 を今のまま（1 字でも変われば印が古い）にするなら、承認を記帳した時点で枝の上の合格が古くなり、本流で回す周がまた要るので、本判断は取り下げます。
  ほかに考えた形（合格した観点を持ち越す・周の前に総点検を置く・反証で退けられた「止める」を軽くする・観点ごとに審査役を増やす）は、
  見逃しが増えるか、周が減らないか、往復がかえって増えるので採りません。

context: |
  (1) 起点。判断の記録 ADR-18（天井の周の引き金を規範の欄の変更に絞る・proposed）は、その敵対的検証で、
  周の回数を押し上げている本当の駆動は引き金ではなく「不合格の後の往復」だと実測し、注の「別に問う候補」の ① に
  「不合格の後の往復を短くする形」、② に「読みやすさの重さの基準」を置いた。本判断は ① を扱い、② を案の 1 つ（案 c）として検討する。
  目的関数は判断の記録 ADR-13 の決定 (0) のまま（① 設計文書が道標として正しいか ② 見落としてあとから直す回数 ③ 実時間の順）で、
  持ち主の方針は「精度が先・実時間を無為に使わない・字数の節約は二次」である。

  (2) 周と往復の実測（周の置き場 ~/.local/share/folio2/ceiling/<日付>-round<N>/ の 1〜28 周・数えの手順は注の【実測の出所】）。
  4 観点とも合格した周は 28 周のうち 8 周（6・14・15・18・21・23・26・28）。所見は 704 件（止める 40・直す 565・参考 99）、
  止める の反証は支持 32・退けた 8。観点ごとの合格は、忠実さ 22・読みやすさ 27・文書どうしの整合 18・実態との整合 16（28 周のうち）。
  前の周が不合格だったので回した周は 27 周のうち 20 周で、不合格の周から次の合格の周までの連鎖は 7 本である。
  不合格の周 20 本のうち 13 本は不合格の観点が 1 つだけだった（2 つが 5 本・3 つが 2 本）。
  1 周の所要（束を組んでから最後の反証が終わるまで）は中央値でおよそ 18 分（11〜36 分）。
  不合格の周の終わりから次の周の始まりまでの間隔は、20 本の合計でおよそ 59 時間、中央値でおよそ 1.3 時間で、周そのものの所要の合計（およそ 8.5 時間）の 7 倍ある。
  **往復の時間の大半は周の中ではなく、周と周の間（仕分けと起草と検証、持ち主の承認待ち、本流への取り込み）にある。**

  (3) 往復 1 本の中身。不合格の後の往復 20 本のうち 18 本は、直しの一括を本流へ取り込んでから次の周を回していた。
  2026-09-21 以降の一括は、起草が終わった時点で取り込みの依頼を開き、持ち主の承認の後に取り込んだので、その間が承認待ちの長さになる。
  その長さは 0.02〜5.75 時間（夜の間をまたいだ 10 周目の後が最長）。各連鎖の最後の往復を除く承認待ちの和はおよそ 9.2 時間である
  （2026-09-20 までの一括は承認の後に取り込みの依頼を開いたので、承認待ちが起草の時間と分けられず、この和に入っていない＝下限）。
  持ち主の回答の逐語は、どの一括でも推奨どおりだった（「承認する」「全部承認する」「全部推奨で良い」「問いは全部推奨で」ほか）。

  (4) 支持された 止める 32 件の字の生まれ（根拠の字が途切れずに在った最初の周の正本）。
  20 件は前の周の正本に既に在った字で、そのうち 15 件は 4 観点とも合格した周を 1 つ以上またいで残っていた。
  **4 観点の合格は「その時点で 止める 級の欠陥が無い」ことを保証しない。** 1 本の審査役が 1 周で 1 件を拾う割合の推定は
  およそ 0.17（忠実さ 0.19・整合 0.19・実態 0.14）で、審査役は前から在る字を周ごとに違う所から拾っている。
  残る 12 件は新しい字で、出所をたどれた 11 件のうち 4 件は、前の周の所見を直した一括そのものが持ち込んだ字だった
  （9 周目 忠実さ F-1・13 周目 忠実さ F-4 と実態 F-1・16 周目 実態 F-1）。持ち主はこの 4 件の字を、天井に掛かる前に承認していた。
  ほかは判断の記録の発効 5 件・辺の後付けの一括 1 件・便 1 件である。

  (5) 案ごとの過去への当てはめ（周の中身〔審査役の判定〕は実際の記録のまま使う粗い再生）。
  〔甲〕合格した観点を連鎖の終わりまで持ち越し、不合格の観点だけを回し直すと、不合格の後の周は 20 から 18 に減るが、
  持ち越した観点が実際に出していた支持の 止める 8 件（うち 6 件は連鎖の始まりより前から在った字）を見逃す。
  観点の束の写しが前の周と同じときだけ持ち越す形にすると、持ち越せた回は 51 回のうち 0 回だった（直しの一括はどの観点も読む要件書を必ず動かす）。
  〔乙〕反証で全部退けられた 止める だけを持つ観点を合格に読み替えると、4 観点とも合格に変わる周は 0 周である
  （該当は 10 周目の読みやすさ 1 回だけで、その周は整合と実態も不合格）。読みやすさの 止める 5 件はすべて退けられたが、
  そのうち 4 件は 1 周目の記録で観点の判定は合格のままだった。
  〔丙〕2026-09-20 に周の外で 2 回の総点検（全数の分担読み）を回した。平易文の総点検（main 07d4640・止める 3）の後、
  前から在った字への忠実さの支持の 止める は、8 周目までの 2 件に対し、9〜28 周で 1 件（総点検の範囲の外の図の副題）だった。
  約束と実態の総点検（main 92adc46・止める 9）の後も、前から在った字への実態の支持の 止める は、9 周目までの 5 件に対し、10〜28 周で 5 件残った。
  総点検の直しの一括そのものが、次の周の支持の 止める を 1 件持ち込んだ（9 周目 忠実さ F-1）。
  〔丁〕一括の枝に残る承認の記帳の取り込み 4 本（一括 10〜13）が変えた欄を、ADR-18 の規範の欄に照らすと、
  一括 10 と 11 は全部が規範の欄の外（承認欄・規則の表の裁定の欄）だった。一括 12 は判断の記録 ADR-14 の発効（状態の欄）を含み、
  一括 13 は本流の取り込みが天井の正本の文書の一覧を動かしていた。

decision: |
  (0) 本判断の目的関数は判断の記録 ADR-13 の決定 (0) のまま（精度・手戻り・実時間の順）とする。
  本判断は周の中身を変えない＝周が読む字（材料の束）・観点・重さ・3 値・反証・門の式は、判断の記録 ADR-8・ADR-13 と要件 FR17・FR18・FR20 のままとし、
  前の周の判定を持ち越さないこと（判断の記録 ADR-13 の決定 (7)）も変えない。見つける数を減らさず、周と周の間の待ちだけを減らす。

  (1) **直しの一括は、持ち主の承認を求める前に、その一括の作業の枝の上で天井の周を回す。**
  一括とは、天井の所見の直しを 1 つの承認でまとめて設計文書の正本へ入れるものをいう。周が不合格か「まだ分からない」だったとき、
  または一括が周の引き金の欄を変えるとき、席は次の順で運ぶ。
  ① 席は直しを枝に書く。持ち主に問う項は、席の推奨の案で書く。
  ② 周の前ごとに、本流（origin/main）をその枝へ取り込み、枝の設計文書の置き場から材料の束を組む（天井の口 --write・--check・--refute は今のまま）。
  ③ 周が不合格か「まだ分からない」なら、その所見の直しを同じ枝に足し（同じ一括のまま）、② に戻る。
  不合格の周を、直しを足さずに回し直すことはしない（合格が出るまで引き直す形にしない）。直さずに回し直してよいのは、
  「まだ分からない」のうち実行できなかった回（起動の記録が無い・束が古い・反証が未・止める が全部退けられた再判定待ち）だけである。
  ④ 4 観点とも合格したら、枝の上で天井の判定の印を導出し（--stamp）、印を枝に置く。
  ⑤ 枝の上で回したすべての周の所見と直しと結果を 1 つの承認要求にまとめ、持ち主へ 1 回だけ出す（対話面 R-8）。
  ⑥ 承認の後に、席は承認の記帳（承認欄・版の来歴・規則の表の裁定の欄と裁定の時刻・台帳の notes）を同じ枝に書いて本流へ取り込む。

  (2) **承認で字が変わったときは、本流で周を回す。** 持ち主が推奨と違う案を選んで周の引き金の欄が変わったとき、
  または ④ の印の後に本流の引き金の欄が動いたときは、門（要件 FR20 の --gate）が「まだ分からない」を返すので、
  取り込みの後に本流で周を回す（今と同じ）。承認の記帳だけで引き金の欄が動かないなら、④ の印がそのまま本流の印になる。

  (3) **枝の上の往復を止めて、その場で持ち主に問う場合。** 次のどれかに当たったら、① 〜 ④ を続けず、そのときの枝と所見を持ち主へ出す（今の往復ごとの承認と同じ）。
  (ア) 同じ種類の失敗（観点・判定・所見の置き場の file の 3 つ組が同じ）が、規則の表の行 R-7 の回数を超えた（条 P-11.1）。
  (イ) 直しに、条文の改訂（条 A-2）・判断の記録の発効か廃止・持ち主の選択が要るのに席が推奨を 1 つに決められない問いが要る。
  (ウ) 直しに、消す・外へ出す・外の道具や鍵を使う操作が要る（条 A-1）。
  判断の記録の発効（状態を提案中から発効へ）を含む承認は、それ自体が周の引き金の欄を変えるので、(1) の形でも承認の後の周は残る。

  (4) **本流の側は今のまま止める。** 枝の上の往復のあいだ、本流の印は前の周のもの（不合格か古い）のままで、
  設計文書を書き換える便は門で止まる（判断の記録 ADR-8 の決定 (4)・規則の表の行 D-12）。枝の上の合格は、本流の完成の判定にも門の判定にも数えない
  （本流へ取り込むまでは本流の正本ではない・条 P-3.3）。

  (5) **型付きの行に置く。** (1)〜(3) の手順は、規則の表に開発規律の新しい行（以下「一括の行」・番号は承認の後に席が振る・種別 human-review・条 P-11・段 post）として置く
  （条 N-2.1＝散文と記憶にしか無い規則を規則として扱わない）。行 D-12 の注の「一括の運用はこの行の何を数えるかの欄が定めていない」は、その在り処を一括の行と書き直す。
  語彙に「一括」の項を足す。要件書は、要件 FR20 の注に「印は一括の枝の上で導出して、一括と一緒に本流へ取り込むことがある」の 1 文を足すだけで、規範文は変えない。
  天井の正本は変えない。実装の便は要らない（天井の口はどれも --dir で枝の置き場を読める。門が承認の記帳を引き金の外に数える口は ADR-18 の便アが入れる）。

  (6) **判断の記録 ADR-18 の案 a に依る。** 本判断は、承認の記帳の欄が周の引き金の外に在ること（ADR-18 の決定 (1)(2)）を前提にする。
  ADR-18 を案 a で発効しないなら、承認を記帳した時点で枝の上の印が古くなり (1) ⑥ の後に必ず本流の周が要るので、本判断は発効させず取り下げる。
  ADR-18 の便ア（引き金の要約値を印と門に入れる便）が着地するまでは、一括の行の手順は (1) ⑤ までを運び、承認の後に本流で周を回す（今と同じ）。

  (7) 憲法の条文は 1 字も改訂しない。条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

options:
  - id: a
    name: 不合格の観点だけを回し直し、合格した観点の判定は持ち越す（観点ごとの印）
    text: |
      不合格の周の後は、止める を出した観点だけを次の周で回す。合格した観点は、その観点の読む字が同じなら（または連鎖が終わるまで）判定を持ち越す。
      印を観点ごとに持つ。
    verdict: rejected
    reason: |
      精度を落とすうえに、周がほとんど減らない。過去の記録に当てると、連鎖の終わりまで持ち越す形では不合格の後の周が 20 から 18 に減るだけで、
      持ち越した観点が実際に出していた支持の 止める 8 件（うち 6 件は前から在った字）を見逃す。
      観点の読む字が同じときだけ持ち越す形では、持ち越せる回が 51 回のうち 0 回で、節約が無い（直しの一括は、どの観点も読む要件書を必ず動かす）。
      4 観点の合格は欠陥の無いことを保証しない（支持の 止める 32 件のうち 15 件は合格の周をまたいで残っていた）ので、合格を持ち越すと偶然の合格が固まる。
      判断の記録 ADR-13 の決定 (7)（前の周の判定は持ち越さない）の改訂にもなる。観点を絞れば 1 周の AI の起動は減るが、観点は並べて回すので実時間は減らない。
  - id: b
    name: 周の前に総点検（全数の分担読み・周とは別の束）を置き、周は総点検の後だけ回す
    text: |
      前から在った字の 止める を、周の外の総点検で一度に洗う。総点検は担当の範囲を 1 件も飛ばさず全部読む点検役を並べて回し、
      その直しの一括の後に周を回す。
    verdict: rejected
    reason: |
      過去の 2 回の総点検の効きは範囲によって割れ、往復の構造は変わらない。平易文の総点検の後は、前から在った字への忠実さの支持の 止める が
      ほぼ出なくなった（9〜28 周で範囲の外の 1 件）が、約束と実態の総点検の後も実態の支持の 止める は前から在った字に 5 件残った。
      2 回の総点検の後も連鎖（7〜14 周）は 5 周続いた。総点検の直しの一括そのものが次の周の 止める を 1 件持ち込んでおり、
      その型（直しが持ち込む欠陥）は総点検では減らない。周のたびに総点検を前置すると、周ごとの手間と承認の数が増える。
      範囲を決めて 1 回だけ回す総点検（例えば一度も総点検していない文書どうしの整合）は有効でありうるので、本判断の外の候補として残す（注）。
  - id: c
    name: 反証で退けられた 止める だけの観点を合格に読み替え、読みやすさの 止める の重さの基準を絞る
    text: |
      反証で全部退けられた 止める しか持たない観点を「まだ分からない（再判定待ち）」でなく合格と読む。
      読みやすさの問いの文の 止める の基準を狭める（反証で 5 件とも退けられたため）。
    verdict: rejected
    reason: |
      周が 1 周も減らない。過去 28 周で、この読み替えで 4 観点とも合格に変わる周は 0 周である
      （該当は 10 周目の読みやすさだけで、その周は整合と実態も不合格だった）。読みやすさの 止める 5 件のうち 4 件は 1 周目で、観点の判定は合格のままだった。
      節約は反証の起動の数だけで、実時間にも精度にも効かない。読み替えは、反証の前の判断を反証の後の結論に読み替えない今の実装の形（便 41）を崩す。
      読みやすさの重さの基準は、本判断に混ぜず、天井の正本の問いの文の改訂の候補として残す（注）。
  - id: d
    name: 今のまま（不合格のたびに一括を承認してから本流で次の周を回す）
    text: |
      往復の運び方を変えない。一括の手順は型付きの行に置かず、席の作法のまま運ぶ。
    verdict: rejected
    reason: |
      持ち主の承認待ちが、連鎖の中の往復ごとに周の前に挟まる形が残る（過去には最後の往復を除いて少なくとも 9.2 時間）。
      一括が持ち込んだ字を、持ち主が天井に掛かる前に承認する形も残る（支持の 止める 4 件）。一括の手順が型付きの行に無い状態（判断の記録 ADR-13 の注 (f)）も残る。
      周の回数は変わらないので、節約が小さいと見て今のままを選ぶのも筋は通る。
  - id: e
    name: 直しの一括の枝の上で周を回し直して往復を閉じ、4 観点とも合格した枝だけを 1 回の承認で出す
    text: |
      決定 (1)〜(6) の形。周の中身は変えず、不合格の後の往復を承認の前の枝の上で回す。持ち主への承認要求は連鎖ごとに 1 回になり、
      持ち主が承認する字は天井に合格した字になる。同じ失敗の繰り返し・条文や判断の発効・消す操作が要るときは、その場で持ち主に問う。
    verdict: adopted
    reason: |
      精度を 1 つも落とさずに往復の待ちを減らせる形はこれだけである。周が読む字も観点も判定も今のままで、見つける数は減らない。
      過去の 7 連鎖に当てると、不合格の後の直しの取り込み 18 回が 7 回の承認にまとまり、各連鎖の最後の往復を除く承認待ち（少なくとも 9.2 時間）が消える。
      一括そのものが持ち込んだ欠陥（支持の 止める 4 件）は、持ち主の承認の前に枝の上の周で見つかる＝承認の精度が上がる。
      実装の便は要らず、手順を型付きの行に置くので、今は作法と記憶にしか無い一括の運び方が規則になる（条 N-2）。
      節約は周の回数ではなく待ちの時間と承認の回数で、連鎖が短いとき（往復 1 本）はほとんど節約が無い。
  - id: f
    name: 観点ごとに独立の審査役を複数並べ、所見の和を取る（多重読み）
    text: |
      1 周の中で、観点ごとに同じ束を独立の審査役 k 本が読み、所見の和で観点の判定を出す。1 周の見つける割合を上げ、連鎖を早く尽きさせる。
    verdict: rejected
    reason: |
      往復がかえって増える。1 本の審査役が 1 件を拾う割合を 0.17 として模型で見積ると（独立を仮定した上限側の見込み）、
      前から在る欠陥が 4 件のとき、不合格の後の周は k = 1 で平均 0.8 周、k = 3 で 1.8 周に増える（合格の周に残る欠陥は 3.2 件から 1.4 件に減る）。
      合格の意味は強くなるが、本判断の問い（往復を短くする）とは逆向きで、同じ問いの文と同じ種類の審査役の読みは独立でないので見込みは上振れしている。
      精度の側の手として、本判断の外で、今の周に影として 2 本目の審査役を並べて実測する候補に残す（注）。

basis: [P-1, P-3, P-4, P-7, P-11, P-12, P-13, P-17, A-1, A-2, N-2, N-3, R-7, R-8, D-12, FR17, FR18, FR20, AC18, ADR-8, ADR-13, ADR-14, ADR-18]

consequences:
  - 周の回数と 1 周の所要は変わらない。変わるのは、不合格の後の往復ごとの持ち主の承認待ちで、承認は連鎖ごとに 1 回になる。過去の 7 連鎖では、不合格の後の直しの取り込み 18 回が 7 回の承認にまとまり、各連鎖の最後の往復を除く承認待ち（少なくとも 9.2 時間・大半は夜の間の 1 回）が消える。往復が 1 本で閉じる連鎖では節約はほとんど無い。
  - 持ち主が承認する字は、枝の上で 4 観点とも合格した字になる。過去には、一括が持ち込んだ字に立った支持の 止める が 4 件あり、持ち主はそれらを天井に掛かる前に承認していた。その型は承認の前に枝の上で見つかる。
  - 持ち主が往復の途中の所見と直しを見るのは、連鎖の終わりの 1 回の承認要求の中になる。承認要求には枝の上で回したすべての周の所見と直しと結果を載せる。途中で方向を変えたいときに間に合わない形になるので、決定 (3) の止める場合と撤退条件 (1) で数える。
  - 1 回の承認要求に入る直しの数は、往復が長い連鎖ほど多くなる。
  - 枝の上の往復のあいだ、本流の印は前の周のもの（不合格か古い）のままで、設計文書を書き換える便は今と同じく門で止まる。実装だけの便は止まらない。実態との整合の観点が実装を読むので、周の前ごとに本流を枝へ取り込む。
  - 印を付け直すためだけの取り込み（天井の印の付け直しの依頼）は、印を一括と一緒に取り込むので要らなくなる。
  - 規則の表に開発規律の行（一括の行）が 1 行増える（裁定 id と時刻を付ける・条 P-17.1）。行 D-12 の注の 1 文が変わる。語彙に「一括」の項が 1 つ増える。要件 FR20 の注に 1 文が増える（要件書の版上げ・規範文と番号は不変・条 P-7）。天井の正本と憲法は変わらない。
  - 判断の記録 ADR-18 の案 a が発効しないなら、本判断は発効しない（決定 (6)）。ADR-18 の便アが着地するまでは、承認の後の本流の周が残る。
  - 判断の記録の発効を含む承認では、承認の後の周が残る（状態の欄が周の引き金に入るため）。過去の支持の 止める のうち 5 件は判断の記録の発効が持ち込んだ字だった。そこへの手は本判断の外である（注）。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に連鎖ごとに記帳する（枝の上で回した周の数・止めた場合と理由・承認要求を出した時刻と承認の時刻・承認の後に本流の周が要ったか）。
    窓は、一括の行の裁定の時刻から 7 日か、一括の行の手順で閉じた連鎖が 3 本になるまでの、遅い方とする。
    (1) 持ち主の判断を先回りしている: 1 回の承認要求で、持ち主が席の推奨と違う案を選び、周の引き金の欄が変わった一括を数える。
    窓の中で 2 本になったら、本判断を捨て、一括の行を廃止して往復ごとの承認（今の形）へ戻す判断の記録を起こす。
    (2) 枝の上の往復が閉じない: 決定 (3) の (ア)（同じ種類の失敗が行 R-7 の回数を超えた）で往復を止めた連鎖を数える。窓の中で 2 本になったら (1) と同じく捨てる。
    (3) 承認の後に古くなる: 承認の記帳だけの変更で門が「まだ分からない」を返した回（判断の記録 ADR-18 の便アの着地の後に限る・判断の記録の発効を含む承認は数えない）を数える。
    1 回で、承認の記帳の欄と周の引き金の欄の食い違いとして、ADR-18 の規範の欄の一覧の見直しを持ち主に問う。
    (4) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2・P-11.1）。
    節約が小さいこと（往復が 1 本で閉じる連鎖ばかりであること）は撤退の理由にしない。一括の行は実装の仕掛けを持たず、残して害が無いためである。

grill: {when: 2026-09-24, who: 起草役の自己反証（起草役と同じ文脈・独立の検証役ではない・席の指示で別の文脈の AI を起こさず論点ごとに反証の試みを書いた）, where: docs/design/adr-19-grill.md（数えの script ~/.local/share/folio2/handoff-2026-09-24/adr19-scripts/ と数え直しの突き合わせ）, summary: 反証の試み 8 点。利益の主張は条件付きで支持（節約は周の回数でなく承認待ちで、連鎖が短いと小さい）・精度の損は無いとの主張は条件付きで支持（周の中身は不変・承認の前に一括の持ち込んだ欠陥が見つかる・ただし直さずに回し直して偶然の合格を引く形を塞ぐ 1 文を決定 (1) ③ に足した）・ADR-18 への依存は崩せない前提として決定 (6) に書いた・持ち主の判断の先回りは撤退条件 (1) と決定 (3) で数える・案 a と c は実測で退けた・案 f は模型で往復が増えるので退けた・独立の検証役による検証は承認の前に席が起こすことを勧めた}

note: |
  【出所】判断の記録 ADR-18（枝 docs/adr18・proposed・2026-09-24 起草）の注の【別に問う候補】①（不合格の後の往復を短くする形）と ②（読みやすさの重さの基準）。
  席の起草の指示（2026-09-24 10:3x JST）が ① を本判断で扱い、② を案の 1 つとして検討するよう求めた。② は案 c で扱い、採らない。
  【ADR-18 との関係】ADR-18 は周を回す時（引き金）を決め、本判断は不合格の後に周を回し直す場所（承認の前の枝の上）を決める。
  ADR-18 の決定 (3) ①（周が不合格か まだ分からない なら、直しの一括が引き金の外でも合格するまで回し直す）は変えず、その回し直しを枝の上で行う。
  両者は同じ承認で出せる。依存は片向きで、本判断は ADR-18 の案 a に依り、ADR-18 は本判断に依らない。
  【実測の出所】周の所見 = ~/.local/share/folio2/ceiling/<日付>-round<N>/ の観点ごとの所見 file（凍結 anchor の置き場を除く）・反証の結果 file・起動の記録の時刻・束の要約値の file の時刻。
  周の base = 各周の依頼文の「main <7 桁>」（束の写しと版管理の file が byte で一致することで確かめた）。取り込みの依頼の時刻 = GitHub の記録（gh で読む）。
  数えの script = ~/.local/share/folio2/handoff-2026-09-24/adr19-scripts/（load.py が周の記録を rounds19.json に落とし、rounds.py・gaps.py・wait.py・age.py・origin.py・replay.py・approval_diff.py・model_f.py が数える）。
  数は 2026-09-24・周 1〜28・main 8066e4c の時点で、再実行できる。所見の総数 704 と止める 40（支持 32・退けた 8）と 1〜27 周の合格 7 周は、ADR-18 の起草役と検証役の数え（674 件・1〜27 周）に 28 周目の 30 件を足した値と一致する。
  1 周の所要は、ADR-18 は審査の開始から反証の終わりで中央値およそ 8 分、本判断は束を組んでから反証の終わりで中央値およそ 18 分と測った（始点の違い）。
  【字の生まれの限界】根拠の字が前の周に在ったことは、欠陥が前から在ったことの上限の目安である。実態との整合の所見は実装が後から変わって生まれるものがあり、
  整合の所見は別の文書の字が変わって生まれるもの（22 周目 忠実さ F-1〔手順図の副題〕・25 周目 整合 F-1〔索引の注〕）がある。検出の割合の推定 0.17 は、この限界のぶん低めに出ている。
  【別に問う候補（本判断に混ぜない）】③ 精度の側の手＝今の周に影として 2 本目の審査役を並べ、判定には使わずに見つける割合の上がり方を実測する（案 f の見込みは独立を仮定した上限なので、実測が要る）。
  ④ 範囲を決めた 1 回の総点検＝一度も総点検していない文書どうしの整合の観点の範囲（2026-09-20 の 2 回は平易文と約束と実態）。
  ⑤ 判断の記録の発効の前に、その枝で周を回す形＝過去の支持の 止める のうち 5 件は判断の記録の発効が持ち込んだ字だったが、
  状態の欄が周の引き金に入る（ADR-18 の決定 (1) ②）ので、発効の後の周は本判断の形でも残る。
  ② 読みやすさの重さの基準は、案 c の実測（周が減らない）を添えて候補のまま残す。
  【発効のときに置くもの】承認欄（approval）と状態（accepted）は、持ち主の承認の後に席が置く（起草の時点では欄ごと持たない）。
  一括の行と語彙の項と要件 FR20 の注の文案は、承認要求 docs/design/adr-19.md の §3・§4 が持つ。
