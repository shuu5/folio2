# folio2 判断の記録 ADR-2 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。読み物は preview/readable.html（生成物・手で直さない）。
id: ADR-2
title: 条文改訂の差分検査（A-2 / N-4）の比較元は、発効版の条文の写しを凍結した anchor file の鎖（design-intent/anchors/）とし、版管理の履歴には依らない
status: proposed
date: 2026-09-12
context: A-2 の機構は「正本の比較元（baseline）との差分（diff）」だが、比較元をどこから取るかが決まっていない。憲法の比較元の欄（meta.baseline）は「初回発効の commit（hash は台帳 f2-648.1 notes に記帳。file は自分の commit hash を持てない）」と書く＝台帳には記帳されているが、file だけを読む床からは解決できない。P-10.2 は生成物どうしの突き合わせだけを合格判定にすることを禁じ、P-10.3 は anchor が維持できない検査を「まだ分からない」に落とす。敵対レビュー 2 周（2026-09-12・台帳 f2-648.2 notes）は、対が 1 組あれば同じ条の他の変更が通ること・写しの置き場を消して同じ版で凍結し直せること・写しの承認欄や欄集合が保護の外にあることを実測で示した。
decision: 発効した版ごとに、条文の写し（憲法 schema.amendment_scope の節＝schema 節・前文・各条の id・見出し・段・縛る相手・規範文の id・本文・型・強度）を凍結 anchor の置き場（design-intent/anchors/）の版ごとの file（constitution-<版>.yaml）に凍結し、索引（index.yaml・追記のみ）で鎖にする。anchor は自分の中に「直前の版」「欄集合」「発効の承認の写し（憲法 meta.approval）」「その版を改訂した判断の承認一覧」を持ち、digest 以外の全欄を機械が計算する番号（digest・sha256）が覆う。鎖の根は最初の版（v1.0）に固定する。床は (1) 現行の写しが最新 anchor と一致すること（不一致なら N-4）、(2) 最新 anchor の版が憲法の版と同じこと、(3) 索引と file と digest と直前の版が一致し鎖が切れていないこと＝切れていれば「まだ分からない」、(4) 直前の anchor との差分を欄単位で全件並べ、その版を名指す発効した判断の記録の改訂欄（amends・field・previous_text・new_text）と 1 対 1 に消し込めること（余りも不足も落とす）、変わった条には改訂来歴（amended_by）があること、(5) 欄集合が anchor 側と一致し、A-2.2 が名指す 5 欄（床の定数）を下回らないこと、(6) 発効の承認の写しが憲法 meta.approval と一致すること、を検査する。anchor は床の script（check_draft.py --freeze-anchor）が検査と同じ射影関数で作り、全検査が 0 違反かつ「まだ分からない」が無く、差分とその版の発効した判断があるときだけ書く。同じ版は上書きせず、anchor と索引は消さない。anchor が 0 本で記録も無ければ「まだ分からない」（P-10.3）。
options:
  - {id: a, name: 条文の写しを凍結した anchor file の鎖, text: 発効版ごとに条文の写しを凍結 anchor の置き場（anchors/）に 1 file 凍結し、索引で鎖にし、床が現行と欄単位で突き合わせる。, verdict: adopted, reason: 版管理の履歴に依らず、写し（clone）の直後でも検査できる。前の文（previous_text）を anchor の欄の値と完全一致で照合できる。改竄への耐性は全欄の番号（digest）と索引の鎖で「うっかり・手抜き」を止め、揃えて書き換える改竄は版管理の履歴と取り込みの審査が受け持つ（他の案でも同じ）。ただし凍結と検査が同じ関数を通るので P-10.1 の「検査側からの独立」は満たさない（P-10.2 の限界）＝独立した凍結 fixture（tests/floor_cases.yaml）が担い、anchor は差分検査の比較元に留まる。}
  - {id: b, name: 発効 commit の履歴番号（commit hash）を型付きデータに書く, text: 欄の決まり（adr/schema.yaml）か憲法の先頭の欄（meta）に履歴番号を置き、版管理の命令（git show）で比較元を取り出す。, verdict: rejected, reason: 取り込み（squash merge）で履歴番号が確定するのは取り込み後＝毎回 2 度の commit が要る。履歴の無い写し（shallow clone）では検査が「読めない」になる。改竄への耐性は同じ作業ツリーの file に書く点で案 a と同等で、優位は無い。}
  - {id: c, name: 版の印（git tag）を比較元にする, text: 発効 commit に印を付け、床は印の指す憲法と比べる。, verdict: rejected, reason: 印は push が別で写し（clone）の間でずれる。印が無い環境で検査が黙るか落ちるかを機械で弁別しにくい。印は動かせるので改竄への耐性も案 a を上回らない。}
  - {id: d, name: 統合先（origin/main）との差分, text: 床は統合先の憲法と現行を比べる。, verdict: rejected, reason: 比較対象が動く（取り込みの要求（PR）の外で統合先が進む）。生成物どうしの突き合わせに当たる（P-10.2）。}
basis: [A-2, N-4, P-4, P-6, P-7, P-10, P-12]
retreat: {kind: measure, condition: 数えるのは planner 席（床の script を回す席）で、台帳に記帳する。凍結忘れ（版を上げたのに凍結の命令（--freeze-anchor）を回さず床が落ちる）か鎖切れ（anchor か索引を消して「まだ分からない」に落ちる）が、同じ種類の失敗として rules 行 R-7 の上限を超えて繰り返されたら、本判断を捨て、比較元を anchor の鎖から、便 0 の検査（CI）が版管理の履歴から作る比較元へ替える。}
amends: []
approval: null
plain: 憲法の「いま有効な文」の写しを、版ごとに 1 枚ずつ凍結して、前の版とつないだ列にして置いておきます。機械は「いまの憲法がいちばん新しい写しと同じか」「列がつながっているか」「前の写しから変わった欄の 1 つ 1 つに、理由の記録・どの文からどの文へ・あなたの OK が付いているか（書き漏らしも書き過ぎも無いか）」を数えます。写しが 1 枚も無いか列が切れているときは「まだ分からない」と言い、合格にはしません。写しをどこか 1 字でも手で直すと、写しから計算した番号が合わなくなって止まります。
consequences:
  - 憲法の版を上げる取り込みの要求（PR）は、判断の記録（その版の欄単位の改訂欄つき）・各条の改訂来歴（amended_by）・新しい anchor と索引の追記の 4 点を同時に含む。改訂欄は床の script（check_draft.py --emit-amends）が差分から印字できる。
  - 凍結 anchor の置き場（anchors/）の file と索引は生成物（手で直さない・P-6.2）で、凍結後は正本の変更に追随させず、消さない（消すと差分検査が「まだ分からない」に落ちる）。
  - 床が守るのは「記録の無い改訂が黙って通らない」ことまで。anchor と索引と憲法を揃えて書き換え番号を計算し直す改竄・床の script の射影の定義を書き換える細工は、版管理の履歴と取り込みの審査で読む（欄の決まりの limits に明記）。
  - rules 行（rules.yaml）は本 anchor の外。P-17.2 の機構は憲法のとおり便 0 の検査で置く。
  - M0 で folio が同じ検査を持てば anchor の生成と検査を folio へ移し、床の script の側を削除する（判断は変えない・道具の移管）。
