# folio2 判断の記録 ADR-2 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。読み物は preview/readable.html（生成物・手で直さない）。
id: ADR-2
title: 条文改訂の差分検査（A-2 / N-4）の比較元は、発効版の条文の写しを凍結した anchor file の列（design-intent/anchors/）とし、版管理の履歴には依らない
status: proposed
date: 2026-09-12
context: A-2 の機構は「正本の比較元（baseline）との差分（diff）」だが、比較元をどこから取るかが決まっていない。憲法の比較元の欄（meta.baseline）は「初回発効の commit（hash は台帳 f2-648.1 notes に記帳。file は自分の commit hash を持てない）」と書く＝台帳には記帳されているが、file だけを読む床からは解決できない。P-10.2 は生成物どうしの突き合わせだけを合格判定にすることを禁じ、P-10.3 は anchor が維持できない検査を「まだ分からない」に落とす。敵対レビュー 3 周（2026-09-12・台帳 f2-648.2 notes）は、対が 1 組あれば同じ条の他の変更が通ること・写しの置き場を消して同じ版で凍結し直せること・写しの承認欄や欄集合や承認者の定義が保護の外にあること・索引を空にすると検査が黙ること・値の型の変更が無記録で通ること・凍結後に承認の逐語を書き換えても落ちないことを実測で示した。
decision: 発効した版ごとに、条文の写し（憲法 schema.amendment_scope の各節＝schema 節・前文・各条の id・見出し・段・縛る相手・規範文の id・本文・型・強度）を凍結 anchor の置き場（design-intent/anchors/）の版ごとの file（constitution-<版>.yaml）に凍結し、索引（index.yaml・追記のみ）で列にする。anchor は自分の中に「直前の版」「写しの範囲と取り方（節の一覧・条の 5 欄・規範文の 4 欄）」「発効の承認の写し（憲法 meta.approval）」「その版を改訂した判断の承認一覧（判断の id・承認者・日付・裁定 id・逐語・対話面）」「写しの本体」を固定の欄で持ち、digest 以外の全欄を機械が計算する番号（digest・sha256）が覆う。列の根は最初の版（v1.0）に固定する。床は (1) 現行の写しが最新 anchor と一致すること（不一致なら N-4）、(2) 最新 anchor の版が憲法の版と同じこと（版を上げて凍結するまでの間は「版が違う」だけを出し、直前の版の改訂を告発しない）、(3) 索引と file と digest と直前の版が一致し列が切れていないこと＝切れていれば「まだ分からない」（索引が在って中身が空のときも同じ。索引だけが消えたときは不合格）、(4) 直前の anchor との差分を欄単位で全件並べ（値は型付き・一覧は 1 値・空文字は印）、その版を名指す発効した判断の記録の改訂欄（amends・field・previous_text・new_text）と 1 対 1 に消し込めること（余りも不足も落とす）、変わった条には改訂来歴（amended_by）があること、写しの範囲の増減も欄単位の（新設）（削除）で記録されること、(5) 写しの取り方と範囲の下限・列の根・置き場・印が床の定数と一致すること（欄の決まりの file はその写し＝data 側で動かせない）、(6) 発効の承認の写しが憲法 meta.approval と一致し、承認一覧の各項が指す判断の記録が実在してその承認欄と 1 字も違わないこと、(7) 規範文 id の重複・改番・廃止した番号の再利用・印を値に持つ欄が無いこと（P-7.1）、(8) anchors/・adr/・design-intent 自体が参照だけの置き換え（symlink）でないこと、を検査する。anchor は床の script（check_draft.py --freeze-anchor）が検査と同じ写しの関数で作り、全検査が 0 違反かつ「まだ分からない」が無く、差分とその版の発効した判断があるときだけ書く。同じ版は上書きせず、anchor と索引は消さない・空にしない。anchor が 0 本で記録も無ければ「まだ分からない」（P-10.3）。
options:
  - {id: a, name: 条文の写しを凍結した anchor file の列, text: 発効版ごとに条文の写しを凍結 anchor の置き場（anchors/）に 1 file 凍結し、索引で列にし、床が現行と欄単位で突き合わせる。, verdict: adopted, reason: 版管理の履歴に依らず、写し（clone）の直後でも検査できる。前の文（previous_text）を anchor の欄の値と完全一致で照合できる。改竄への耐性は全欄の番号（digest）と索引の列で「うっかり・手抜き」を止め、揃えて書き換える改竄は版管理の履歴と取り込みの審査が受け持つ（他の案でも同じ）。ただし凍結と検査が同じ関数を通るので P-10.1 の「検査側からの独立」は満たさない（P-10.2 の限界）。P-10.1（機構の欄（live）が M0・未発効）は本判断の射程外で、発効日（day-1）の代替として床の fixture（tests/floor_cases.yaml）を置くが、それは床の入力ではない（fixture の不在は検出されない）＝M0 で床の入力に取り込む。anchor は差分検査の比較元に留まる。}
  - {id: b, name: 発効 commit の履歴番号（commit hash）を型付きデータに書く, text: 欄の決まり（adr/schema.yaml）か憲法の先頭の欄（meta）に履歴番号を置き、版管理の命令（git show）で比較元を取り出す。, verdict: rejected, reason: 取り込み（squash merge）で履歴番号が確定するのは取り込み後＝毎回 2 度の commit が要る。履歴の無い写し（shallow clone）では検査が「読めない」になる。改竄への耐性は同じ作業ツリーの file に書く点で案 a と同等で、優位は無い。}
  - {id: c, name: 版の印（git tag）を比較元にする, text: 発効 commit に印を付け、床は印の指す憲法と比べる。, verdict: rejected, reason: 印は push が別で写し（clone）の間でずれる。印が無い環境で検査が黙るか落ちるかを機械で弁別しにくい。印は動かせるので改竄への耐性も案 a を上回らない。}
  - {id: d, name: 統合先（origin/main）との差分, text: 床は統合先の憲法と現行を比べる。, verdict: rejected, reason: 比較対象が動く（取り込みの要求（PR）の外で統合先が進む）。生成物どうしの突き合わせに当たる（P-10.2）。}
basis: [A-2, N-4, P-4, P-6, P-7, P-10, P-12, R-7]
retreat: {kind: measure, condition: 数えるのは planner 席（床の script を回す席）で、台帳に記帳する。凍結忘れ（版を上げたのに凍結の命令（--freeze-anchor）を回さず床が「版が違う」で落ちる）が rules 行 R-7 の上限を超えて繰り返されたとき、または列切れ（anchor か索引を消して「まだ分からない」に落ちる）が R-7 の上限を超えて繰り返されたとき（2 つは R-7 の same_failure では別種なので、別々に数える）、本判断を捨て、比較元を anchor の列から、便 0 の検査（CI）が版管理の履歴から作る比較元へ替える。}
amends: []
approval: null
plain: 憲法の「いま有効な文」の写しを、版ごとに 1 枚ずつ凍結して、前の版とつないだ列にして置いておきます。機械は「いまの憲法がいちばん新しい写しと同じか」「列がつながっているか」「前の写しから変わった欄の 1 つ 1 つに、理由の記録・どの文からどの文へ・あなたの OK が付いているか（書き漏らしも書き過ぎも無いか）」「写しに書かれた OK の言葉が、理由の記録の OK の言葉と今も同じか」を数えます。写しが 1 枚も無いか、列が切れているか、列の目次が空のときは「まだ分からない」と言い、合格にはしません（目次だけが消えたときは不合格にします）。写しをどこか 1 字でも手で直すと、写しから計算した番号が合わなくなって止まります。番号の付け替えや、消した番号の使い回しも止まります。
consequences:
  - 憲法の版を上げる取り込みの要求（PR）は、判断の記録（その版の欄単位の改訂欄つき）・各条の改訂来歴（amended_by）・新しい anchor と索引の追記の 4 点を同時に含む。改訂欄は床の script（check_draft.py --emit-amends）が最新 anchor との差分から、そのまま貼れる形で印字できる。
  - 凍結 anchor の置き場（anchors/）の file と索引は生成物（手で直さない・P-6.2）で、凍結後は正本の変更に追随させず、消さない・空にしない（消すと差分検査が「まだ分からない」に落ちる）。
  - 憲法の発効の承認欄（meta.approval）は初回発効の承認で、以後の版では書き換えない（各版の承認は判断の記録の承認欄と anchor の承認一覧が持つ）。書き換えると全 anchor の写しと食い違って落ちる。
  - 床が守るのは「記録の無い改訂が黙って通らない」ことまで。anchor と索引と憲法を揃えて書き換え番号を計算し直す改竄（承認の逐語を含む）・床の script の定数（写しの取り方・承認者・対話面・裁定 id の形）を書き換える細工は、版管理の履歴と取り込みの審査で読む（欄の決まりの limits_note に明記）。
  - rules 行（rules.yaml）と憲法の改訂章（amendment）・各条の機構（mechanism）/ 平易文（plain）/ 出所（rationale）は本 anchor の外。P-17.2 と P-17.4 の機構は憲法のとおり便 0 の検査で置く。
  - 写しの取り方（条の 5 欄・規範文の 4 欄）を変えるのは床の script の改訂で、既存 anchor の取り方と食い違うので「まだ分からない」に落ちる。その時は列を新しい取り方で凍結し直す手順を判断の記録に書いてから行う（day-1 では想定しない）。
  - M0 で folio が同じ検査を持てば anchor の生成と検査を folio へ移し、床の script の側を削除する（判断は変えない・道具の移管）。M0 では床の fixture（tests/floor_cases.yaml）を床の入力にする（P-10.1）。
