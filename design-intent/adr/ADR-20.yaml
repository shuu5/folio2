id: ADR-20
title: 周の引き金から外す辺の欄を、規範の欄に入らない辺に限り、憲法の前文と schema 節は判断の記録の改訂の欄を通して引き金に数える — 判断の記録 ADR-18 の決定 (1) と (2) の食い違いを解く

status: proposed
date: 2026-09-24

plain: |
  AI が意味を読む検査（天井）の 1 周をいつ回すかの決まり（判断の記録 ADR-18）の中に、互いに食い違う 2 つの文がありました。
  1 つ目の文は、受入基準が「どの要件を確かめるか」、要件が「どの受入基準で確かめるか」、規則の表の行が「どの条を縛るか」を、周を回すきっかけになる大事な欄（規範の欄）に数えます。
  2 つ目の文は、「文書どうしのつながり（辺）を足すだけの変更では周を回さない」と言います。
  ところが、この 3 つの欄は、設計文書の索引ではつながりの欄として扱われています。だから同じ変更が、1 つ目の文では周を回し、2 つ目の文では回さないことになっていました。
  機械（天井の門）は、すでに 1 つ目の文のとおりに動いています。
  この判断では、1 つ目の文を正しい側とし、2 つ目の文の断りを狭めます。
  この 3 つの欄を書き換えたら周を回します。ほかのつながりの欄（根拠・参照・条どうしの関係など）に番号を足すだけなら、今までどおり周を回しません。
  どの受入基準がどの要件を確かめるかは、「何ができたら完成か」の中身そのものなので、読まずに通すと正しさが落ちるからです。
  あわせて、憲法の前文（条どうしが衝突したときの順位）と憲法の決まりの節の扱いを書き足します。
  この 2 つは憲法の条文と同じく、書き換えると憲法の改訂になり、判断の記録の発効が必ず伴います。その発効が周のきっかけになるので、この 2 つの変更でも必ず周が回ります。
  機械の数え方（周のきっかけの一覧）は変えません。変えるのは文書の字だけで、機械を直す仕事は、生成される注の字を直す小さな便が 1 本だけです。
  正直に言うと、過去 29 回の周と周の間に当てると、この判断で回す周の数は 1 つも変わりません。
  この 3 つの欄だけが変わった間は一度も無く、前文が変わった 2 回はどちらも判断の記録の発効と一緒でした。
  この判断は周を減らしも増やしもせず、文書の中の食い違いを消して、次の周が同じ所で止まらないようにするものです。
  また、周のきっかけが漏れたときの数え方が 3 つの撤退条件にまたがっていたので、ADR-18 の撤退条件で 1 度だけ数えると決めます。

context: |
  (1) 起点。天井の 30 周目（一括 17 の枝の上・周の置き場 ~/.local/share/folio2/ceiling/2026-09-24-round30/）の文書どうしの整合の所見 3 件（F-1・F-4・F-7）。
  1 件目（F-1・止める・反証で支持）の根拠の逐語は「辺を足すだけの変更を引き金に数えないこと（同 決定 (8)）は変えない。」（判断の記録 ADR-18 の決定 (2)）で、
  所見の注の要旨は次のとおり。決定 (1) ③ は受入基準の「確かめる要件」と要件の「確かめ方」を規範の欄に入れ、天井の正本の生成区間の引き金の一覧もそれを写す。
  一方、索引の欄の決まり（design-intent/graph.yaml）の辺の欄は要件書について確かめる要件（verifies）と確かめ方の中の受入基準（verify.ac）を辺に数える。
  だから受入基準の確かめる要件に要件 id を 1 つ足す変更は、決定 (1) の引き金の要約値を動かして周を起こし、決定 (2) と両立しない。
  語彙の「周の引き金」の末尾の文も同じ食い違いを持つ。実装（crates/folio/src/ceiling.rs の受入基準の引き金の定数と gate.rs の引き金の要約値の関数）は決定 (1) の側に従う。
  反証の結論（~/.local/share/folio2/ceiling/2026-09-24-round30/refute-notes/coherence-F-1.md）は 支持 で、「同じ差分に対して「引き金にならない」（graph.yaml の注・語彙・ADR-18 (2)）と
  「引き金の要約値が動く」（ADR-18 (1)・ceiling.yaml）が同時に立つ」「食い違いの範囲は要件書の 2 欄（と規則の表の article）に限られ」「退ける根拠は正本に見当たらない」と書いた。
  2 件目（F-4・直す）の根拠の逐語は決定 (1) ① の「憲法の条文（条 A-2.2 が名指す 5 欄 = id・見出し・段・縛る相手・規範文。凍結 anchor の写しの取り方と同じ）」で、
  注の要旨は、条 A-2.2 と憲法の schema 節の改訂の範囲（schema・precedence・articles）は前文と schema 節も改訂の母集団に入れるのに、決定 (1) ① は条文の 5 欄だけを数え、
  決定 (2) の引き金の外の列にもこの 2 つが無いので、前文だけ・schema 節だけを変えた変更が周を起こすのかどちらの文でも定まらない、というもの。
  3 件目（F-7・直す）は、判断の記録 ADR-13 の撤退条件 (6) と ADR-18 の撤退条件 (1)・(3) が同じ「引き金の漏れ」を別の閾値と別の戻し先で数えて読める、というもの。

  (2) 持ち主の向き。一括 17（docs/design/batch17-triage.md）の問 8 は、F-1 と F-4 を解く向きだけを問うた。推奨の向きは
  「決定 (2) の断りを狭める（受入基準の確かめる要件・要件と非機能要件の確かめ方の中の受入基準・規則の表の行の条は規範の欄に入るので、そこへ id を足すだけの変更も周を回す）」と
  「決定 (1) ① に前文と憲法の schema 節を足す」の 2 つで（F-1 と F-4 に当たる）、代替の向き（辺の欄を決定 (1) から外す）と、退けた向き 2 つ（辺の例外を全部外す・注で (1) が (2) に優先すると断る）を並べた。
  持ち主は一括 17 の問 1〜8 を推奨どおりに承認した（2026-09-24 15:31 JST・台帳 f2-648 notes・対話面 R-8）。問 8 の答えは向きであって、正本の字は動かさず、ADR-20 の起草と別の承認要求を求めた。
  3 件目（F-7）の数え方も同じ起草で決めることになっていた（一括 17 の承認の後に席が書く欄の 18）。

  (3) 食い違いの範囲の実測（枝 docs/adr20・script ~/.local/share/folio2/handoff-2026-09-24/adr20-scripts/trigger_probe.sh）。
  写しの設計文書に 1 つずつ変更を当て、周の結果から印を導出し直して引き金の要約値を比べた。
  受入基準 AC18 の確かめる要件に id を足す・要件 FR20 の確かめ方の中の受入基準に id を足す・規則の表の行 D-12 の条を替える、の 3 つは引き金の要約値を動かした。
  規則の表の行の参照の欄・判断の記録の根拠の欄・要件の根拠の欄に id を足す変更は動かさなかった。
  索引の辺の欄（実装 crates/folio/src/graph.rs の EDGE_FIELDS）と引き金の一覧（ceiling.rs の定数）が重なるのは、確かめる要件（verifies）・確かめ方の中の受入基準（verify.ac）・
  規則の表の行の条（article）の 3 つだけである（要件書の目的と範囲の節は丸ごと引き金に入るが、中に辺の欄を持たない）。

  (4) 周への影響の実測（script 同じ置き場の intervals.py・周 2〜31 の base の版管理・30 周目は枝 b0be15b）。周と周の間の 29 区間のうち、
  引き金の要約値が動いた区間は 23、動かなかった区間は 6。上の 3 つの辺の欄が動いた区間は 11 あったが、11 区間とも同じ区間でほかの規範の欄も動いていた＝3 つの辺の欄だけが動いた区間は 0。
  引き金の要約値が動かなかった 6 区間では、ほかの辺の欄（参照・根拠・目的・規則・判断の記録・帰結・関係）も 1 つも動いていなかった。
  1〜31 周の所見のうち、場所がこの 3 つの欄に置かれたものは 1 件（直す）で、止める は 0 件。
  だから過去の周に当てる限り、辺をどちらへ数えても、辺の例外を全部外しても、回す周の数は変わらない。この判断の違いは周の数ではなく、字の食い違いと、今後の変更の扱いに在る。

  (5) 前文と schema 節の扱いの実測。憲法の schema 節の改訂の範囲（amendment_scope）は schema・precedence・articles で、凍結 anchor は前文と schema 節を丸ごと写す（条文は 5 欄）。
  床は、現行の写しが最新の凍結 anchor と 1 字でも違えば、その版を名指す発効した判断の記録の改訂の欄（amends）と 1 対 1 に消し込めない限り落とす（判断の記録 ADR-2・条 N-4）。
  実測（trigger_probe.sh）では、前文の本文の 1 字・前文の平易文の 1 字・schema 節の値の 1 つを変えた写しは、どれも引き金の要約値を動かさず（引き金の一覧は条文の 5 欄だけを写す）、
  どれも床が 条 N-4 で落とした。発効した判断の記録 ADR-17 の改訂の欄に 1 件を足した写しは、引き金の要約値を動かした（判断の記録の改訂の欄は決定 (1) ② の欄）。
  凍結 anchor の列（v1.0〜v1.3）では、前文は 2 度変わり（v1.2 の平易文 = 判断の記録 ADR-12・v1.3 の根拠の行 = ADR-17）、schema 節は 1 度も変わっていない。
  intervals.py で見ると、前文が変わった 2 区間（17→18 周・28→29 周）はどちらも同じ区間で発効した判断の記録の欄（決定 (1) ②）が動いていた（2 区間のうち 2）。
  つまり、床が合格する本流の上では、前文と schema 節を変えるには発効した判断の記録の改訂の欄が要り、その欄が引き金の要約値を動かす。2 件目（F-4）の注の「実害は間接に塞がれている」はこの結び付きのことである。

  (6) 実装の今の式（枝 docs/adr20 の crates/ を読んで確かめた・読むだけ）。引き金の要約値の関数（gate.rs の trigger_digest）は、憲法を凍結 anchor の写しの関数に範囲 articles だけで通し、
  判断の記録は発効したものごとに 8 欄（id・状態・決定・撤退条件・amends・revises・supersedes・superseded_by）を、要件書は ceiling.rs の行の一覧の定数と丸ごとの節を、
  規則の表は 10 欄（条を含む）を、天井の正本は重さと文書の行と観点の行を写す。受入基準の欄の定数は id・題・確かめる要件・判定の文、要件の欄の定数は確かめ方を丸ごと持つ。
  辺の欄を引き金から落とす処理はどこにも無い。索引の欄の決まりの注（graph.yaml の edge_fields_note）は生成区間で、その字の正本は graph.rs の定数の文字列（凍結の写し tests/fixtures/schema/graph-region.txt）である。
  天井の正本の引き金の注（ceiling.yaml の trigger_note）も生成区間で、字の正本は ceiling.rs の床の木の文字列（凍結の写し tests/fixtures/schema/ceiling-region.txt）である。

decision: |
  (0) 本判断の目的関数は判断の記録 ADR-13 の決定 (0) のまま（精度・手戻り・実時間の順）とする。本判断は周の数を減らしも増やしもしない（文脈 (4)）。
  決めるのは、判断の記録 ADR-18 の決定 (1) と (2) の食い違いの解き方と、それに揃える字である。

  (1) **判断の記録 ADR-18 の決定 (2) の辺の断りを狭める。** 決定 (2) の末尾の文を次のとおり改める。
  改める前: 「辺を足すだけの変更を引き金に数えないこと（同 決定 (8)）は変えない。」
  改めた後: 「辺を足すだけの変更を引き金に数えないこと（同 決定 (8)）は、規範の欄に入らない辺の欄（憲法の条の関係の欄・規則の表の行の参照の欄・
  要件書の根拠と目的と規則と判断の記録の欄・判断の記録の根拠と帰結の欄）に限って残す。受入基準の確かめる要件（verifies）・要件と非機能要件の確かめ方の中の受入基準（verify.ac）・
  規則の表の行の条（article）は、索引では辺の欄だが、(1) ③ ④ の規範の欄に入るので、そこへ id を足すだけの変更も引き金に数える。」
  決定 (1) ③ ④ と実装の引き金の一覧は変えない（今の実装はこの字のとおりに動いている・文脈 (3) (6)）。

  (2) **判断の記録 ADR-18 の決定 (1) ① に、憲法の前文と schema 節の扱いを足す。** 決定 (1) ① を次のとおり改める。
  改める前: 「① 憲法の条文（条 A-2.2 が名指す 5 欄 = id・見出し・段・縛る相手・規範文。凍結 anchor の写しの取り方と同じ）」
  改めた後: 「① 憲法の条文（条 A-2.2 が名指す 5 欄 = id・見出し・段・縛る相手・規範文。凍結 anchor の写しの取り方と同じ）と、条 A-2 の改訂の範囲に在る前文と憲法の schema 節。
  前文と schema 節は一覧の型付きの定数に入れず、② の改訂の欄（amends）で数える＝その字を変えるには、その版を名指す改訂の欄を持つ発効した判断の記録が要り
  （床が凍結 anchor との差分と 1 対 1 に消し込む）、その記録の欄が引き金の要約値を必ず動かす」
  前文と schema 節は、平易文や注の字を含めて丸ごと改訂の範囲に在るので、その字の変更はどれも条 A-2 の改訂になり、引き金の側に入る（決定 (2) の引き金の外には入らない）。
  型付きの定数に足さないのは、床の上ではこの結び付きで漏れが起きず（文脈 (5)・過去 2 区間のうち 2）、定数を足す便と印の付け直しを要しないためである。
  結び付きが破れたら撤退条件 (1) で定数に足す形（案 d）へ移る。

  (3) **実装の式は変えない。** 引き金の一覧の型付きの定数（crates/folio/src/ceiling.rs）と引き金の要約値の関数（crates/folio/src/gate.rs の trigger_digest）と、
  印と門の判定は 1 字も変えない。決定 (1) ③ ④ も変えない。

  (4) **引き金の漏れは判断の記録 ADR-18 の撤退条件 (1)・(3) で数える（天井の 30 周目 整合 F-7）。** 判断の記録 ADR-13 の撤退条件 (6) は、
  ADR-13 の決定 (8) の引き金で「周は要らない」と出した後の漏れを数えるが、その引き金は ADR-18 が規範の欄の要約値へ狭めて置き換えた。
  (6) と ADR-18 の撤退条件 (1) は、同じ漏れを同じ閾値（2 件）で数え、戻し先も同じ（設計文書が 1 字でも変われば周を回す形＝正本の要約値で古さを測る形）である。
  だから (6) は ADR-18 の (1) と同じ数を読み、別に数えない（二重に数えて別の閾値を立てることはしない）。ADR-18 の (3)（1 件で規範の欄の一覧に足す改訂を問う）はそのまま残す。
  ADR-13 の撤退条件 (3)（辺だけの変更に由来する 止める を数える）は、決定 (1) の後は規範の欄に入らない辺の欄の変更だけに掛かる。撤退条件の字は変えず、ADR-13 の注で断る。

  (5) **字を揃える（発効の後に席が書く・便 1 本）。** 次の字を、決定 (1) (2) と同じ向きに揃える。
  ① 判断の記録 ADR-18 の決定 (2) の末尾の文と決定 (1) ① を、(1) (2) の「改めた後」の字へ書き換え、ADR-18 の注に改訂の記録（ADR-20・裁定 id）を足す。
  ADR-18 の改訂の欄の ADR-13 決定 (8) の要約の括弧「（辺を足すだけの変更を数えないことは変えない）」も「（辺を足すだけの変更を数えないことは、規範の欄に入らない辺の欄に限って残す・判断の記録 ADR-20）」へ改める。
  発効した決定の字を注で断らずに書き換えるのは、両立しない 2 文が決定の本文に残る限り次の周の整合が同じ所を拾うためである（一括 17 の問 8 が退けた向き「注で (1) が (2) に優先すると断る」と同じ理由）。
  改める前の字は本判断の (1) (2) と版管理の履歴に逐語で残る。
  ② 語彙の「周の引き金」の末尾の文。
  ③ 要件 FR20 の注に 1 文（要件書の版上げ・規範文と番号は不変・条 P-7）。
  ④ 判断の記録 ADR-13 の注（決定 (8) の辺の断りが本判断で狭まったことと、決定 (4) の数え方）。
  ⑤ 索引の欄の決まりの注（graph.yaml の edge_fields_note）と天井の正本の引き金の注（ceiling.yaml の trigger_note）。どちらも生成区間なので、字の正本（graph.rs と ceiling.rs の文字列）と
  凍結の写しを直す便 1 本で運ぶ（引き金の式と定数の配列は変えない）。便の着地までは、この 2 つの注が古い字のまま残る。

  (6) 憲法の条文は 1 字も改訂しない。条文の改訂が要ると分かったら、その時点で本判断を止めて条 A-2 の手順へ移す。

options:
  - id: a
    name: 決定 (2) の辺の断りを規範の欄に入らない辺に狭め、決定 (1) ① の前文と schema 節は判断の記録の改訂の欄を通して数える（実装の式は変えない）
    text: |
      決定 (1)〜(5) の形。実装がすでに従っている決定 (1) の側を正とし、決定 (2) と語彙と索引の注の断りを狭める。
      前文と schema 節は型付きの定数に足さず、条 A-2 の改訂が必ず伴う発効した判断の記録の改訂の欄で数える。
    verdict: adopted
    reason: |
      持ち主が一括 17 の問 8 で承認した向きそのものである。どの受入基準がどの要件を確かめるか・規則の行がどの条を縛るかは完成の物差しと規則の縛る先そのもので、
      読まずに通すと精度が落ちる（ADR-18 決定 (0)）。実装はもうこの側で動いているので、式を変える便が要らず、印も付け直さない。
      過去 29 区間に当てると周の数は変わらない（3 つの辺の欄だけが動いた区間は 0）ので、実時間の損も無い。
      前文と schema 節は、床の上では判断の記録の改訂の欄と必ず一緒に動く（過去 2 区間のうち 2・実測で床が N-4 で落とす）ので、定数に足さなくても漏れない。
      残る危うさ（床が合格しない状態を経た変更で結び付きが破れる）は撤退条件 (1) が決定的に数える。
  - id: b
    name: 辺の欄を決定 (1) から外す（確かめる要件・確かめ方の中の受入基準・規則の表の行の条を引き金に数えない）
    text: |
      一括 17 の問 8 の代替の向き。決定 (2) と語彙と索引の注はそのまま残し、決定 (1) ③ ④ と引き金の一覧の定数から 3 つの欄を外す。
    verdict: rejected
    reason: |
      どの受入基準がどの要件を確かめるかと、規則の行がどの条を縛るかの変更を、周で読まずに通すことになり、精度を最優先にする方針（ADR-18 決定 (0)）に反する。
      引き金の一覧の定数・天井の正本の生成区間・凍結の写し・歯を直す実装の便が 1 本要り、定数が変わると引き金の要約値の値も変わるので印を付け直す周が要る。
      過去 29 区間では 3 つの辺の欄だけが動いた区間が 0 なので、この案で減る周も 0 である。費用だけがあって利益が無い。
  - id: c
    name: 辺の例外を全部外す（どの辺の欄に id を足しても周を回す）
    text: |
      決定 (2) の辺の断りを消し、根拠・参照・関係・目的・規則・判断の記録・帰結の辺の欄も引き金の一覧に足す。
    verdict: rejected
    reason: |
      判断の記録 ADR-13 の決定 (8) は、持ち主の目的関数の裁定の ④（辺を完全にする作業が天井を高い頻度で走らせる種になるなら微妙・2026-09-22）への答えとして辺の例外を置いた。
      辺の後付け（書き写し）の便は根拠や参照の欄に id を足すだけの便で、この案ではその便のたびに周が要る。過去 29 区間では追加の周は 0 だったが、それは辺の後付けが
      ほかの規範の欄の変更と同じ区間に入っていたからで、今後もそうなる保証は無い。引き金の一覧の定数を足す実装の便も要る。
      根拠や参照の欄は規範の欄の結び付きを説明する線で、規範そのものではないので、次の引き金の周が読めば足りる（ADR-18 決定 (2) の考え方）。
  - id: d
    name: 前文と schema 節を引き金の一覧の型付きの定数に足す（決定 (1) ① の字どおりに要約値へ入れる）
    text: |
      引き金の要約値の関数が憲法を写す範囲を条文だけから改訂の範囲（schema・precedence・articles）へ広げ、天井の正本の生成区間の写しと凍結の写しと歯を直す。
      辺の欄の扱いは案 a と同じ。
    verdict: rejected
    reason: |
      今は採らず、撤退条件 (1) の戻し先として残す。床が合格する本流の上では前文と schema 節の変更は必ず判断の記録の改訂の欄と一緒に動くので、この案で拾える変更は増えない（過去 2 区間のうち 2 は案 a でも引き金になった）。
      その一方で、実装の便が 1 本要り、定数が変わると引き金の要約値の値が変わって印を付け直す周が要る。
      この案の利点は、型付きの一覧と決定の字が 1 対 1 になることと、床が合格しない状態を経た変更でも漏れないことで、それは撤退条件 (1) の 1 件で取りに行く。
  - id: e
    name: 決定の字を変えず、注で「(1) が (2) に優先する」と断る
    text: |
      判断の記録 ADR-18 の決定 (1) と (2) の本文は変えず、注に優先の順を書く。改訂の欄も語彙も索引の注も変えない。
    verdict: rejected
    reason: |
      決定の本文に両立しない 2 文が残り、次の周の整合が同じ所を拾う（一括 17 の問 8 が退けた向き）。語彙と索引の注の「辺を足すだけの変更は引き金にならない」も残るので、
      読み手は 3 か所で逆の答えを読む。決定の範囲を変える判断を注で済ませるのは、判断の記録の欄の決まり（改訂の欄で変える形）にも合わない。

basis: [P-3, P-4, P-5, P-6, P-7, P-8, P-11, P-13, P-15, A-2, N-2, N-4, R-7, R-8, D-12, D-14, FR14, FR19, FR20, AC18, ADR-2, ADR-12, ADR-13, ADR-17, ADR-18, ADR-19]

revises:
  - {target: ADR-18, decision: (1), kind: widen, summary: 規範の欄の ① に、条 A-2 の改訂の範囲に在る憲法の前文と schema 節を足す（型付きの一覧の定数は条文の 5 欄のままとし、前文と schema 節は ② の改訂の欄で数える＝引き金の要約値の値と実装の式は変わらない）}
  - {target: ADR-18, decision: (2), kind: narrow, summary: 引き金の外に置く辺の断りを、規範の欄に入らない辺の欄（関係・参照・根拠・目的・規則・判断の記録・帰結）に限る（受入基準の確かめる要件・要件の確かめ方の中の受入基準・規則の表の行の条は引き金に数える）}
  - {target: ADR-13, decision: (8), kind: widen, summary: 辺を足すだけの変更を周の引き金に数えない断りを規範の欄に入らない辺の欄に限り、確かめる要件・確かめ方の中の受入基準・規則の表の行の条へ id を足す変更を引き金に入れる（引き金そのものは ADR-18 が規範の欄の要約値に狭めたまま）}

consequences:
  - 周の回数は変わらない。過去 29 区間に当てると、確かめる要件・確かめ方の中の受入基準・規則の表の行の条だけが動いた区間は 0 で、前文が動いた 2 区間は 2 つとも判断の記録の発効と同じ区間だった。本判断は周を減らす判断でも増やす判断でもない。
  - 実装の式と引き金の一覧の定数は変わらないので、引き金の要約値の値も変わらない。ただし本判断の発効そのもの（判断の記録の状態の欄）と、ADR-18 の決定の字の書き換えは引き金の欄の変更なので、発効の後に本流で周が要る（どの判断の記録の発効も同じ）。
  - 今後、受入基準の確かめる要件や要件の確かめ方の中の受入基準や規則の表の行の条だけを直す便・一括は、ほかの規範の欄を動かさなくても周を呼ぶ。字の上でもこれが正になる（今までも実装はそう動いていた）。
  - 判断の記録 ADR-18 の決定 (1) ① と (2) の字が発効の後に書き換わる。発効した決定の本文を注で断らずに書き換える初めての例になる（今までは注で断り、決定の字は変えなかった）。改める前の字は本判断の決定 (1) (2) と版管理の履歴に残る。
  - 索引の欄の決まりの注と天井の正本の引き金の注を直す便が 1 本要る（生成区間の字の正本の文字列と凍結の写し 2 本・引き金の式は変えない）。便の着地までは、索引の注に「この欄に id を足すだけの変更は周の引き金にならない」の古い字が残る。次の周の前に着地させる（規則の表の開発規律行 D-14 の、枝に書けない所見の運び方と同じ）。
  - 要件書の版が 1 つ上がる（要件 FR20 の注に 1 文と、判断の記録の欄に ADR-20）。規範文と番号は変わらない（条 P-7）。
  - 判断の記録 ADR-13 の撤退条件 (6) は、ADR-18 の撤退条件 (1) と同じ数を読み、別には数えない。撤退条件の字は変わらず、ADR-13 の注が断る。
  - 前文と schema 節の漏れを塞ぐのは床の差分検査（条 N-4）と判断の記録の改訂の欄の結び付きで、型付きの定数ではない。床が合格しない状態を経て前文か schema 節だけが本流に入ると、その変更は引き金を動かさない。撤退条件 (1) がこれを決定的に数える。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。数える期間は、本判断の発効の時刻から 14 日とする。
    数えの道具（~/.local/share/folio2/handoff-2026-09-24/adr20-scripts/ の intervals.py と trigger_probe.sh・intervals.py は区間の base を足して撃つ）は、どちらも決定的に再実行できる。
    (1) 前文と schema 節の結び付きが破れる: 印を付けた周の base と、門を撃ったときの本流の組のうち、憲法の前文か schema 節（凍結 anchor の写しの範囲）が違うのに
    引き金の要約値が同じ組を数える。1 件で決定 (2) の「② の改訂の欄で数える」形を捨て、前文と schema 節を引き金の一覧の型付きの定数に足す便（案 d）を起こす。この撤退条件だけは期間を切らずに数え続ける。
    (2) 辺の欄の引き金が周を呼ぶだけ: 引き金の要約値の違いが、確かめる要件・確かめ方の中の受入基準・規則の表の行の条の 3 つの欄だけに由来した周（intervals.py の「辺だけ」の区間の後の周）を数える。
    期間の中で 2 周になり、そのどちらの周でも 3 つの欄の変更に根拠の字を持つ 止める が反証で支持されなかったら、3 つの欄を引き金から外す形（案 b）を持ち主に問う。
    (3) 食い違いが残る: 決定 (5) の字の揃え（便の着地を含む）が終わった後の周で、辺の欄と引き金の扱い、または前文と schema 節の引き金の扱いについて、
    文書どうしの整合の 止める が反証で支持されたら数える。1 件で本判断の字の揃えが失敗したとみなし、その周の所見を添えて持ち主へ問う（揃え直しの字か、案 d）。
    (4) 数えられない回が数値の表の行 R-7 の回数を超えたら、本判断の撤退条件の判定を「まだ分からない」に落として持ち主へ渡す（条 P-4.2・P-11.1）。

grill: {when: 2026-09-24, who: 起草役の自己反証（起草役と同じ文脈・独立の検証役は席が別に立てる）, where: docs/design/adr-20-grill.md（数え直しの script ~/.local/share/folio2/handoff-2026-09-24/adr20-scripts/）, summary: 主張する利益は周の数ではなく字の食い違いを消すことで、過去 29 区間に当てると周の数はどの案でも変わらないことを起草役自身が数えて認めた。辺の断りを狭める向きは、実装が既にその側で動き、3 つの辺の欄だけが動いた区間が 0 なので、精度の損も実時間の損も無い。前文と schema 節を判断の記録の改訂の欄で数える形は、床が合格する本流の上でだけ成り立つ（床が合格しない状態を経た変更では破れる）ので撤退条件 (1) で決定的に数え、戻し先を案 d に置いた。発効した決定の字を書き換えることは先例（注で断る）と違うので、帰結と承認要求に明記した。独立の検証の結果は席が改訂で書き足す}

note: |
  【出所】天井の 30 周目（一括 17 の枝の上）の文書どうしの整合 F-1・F-4・F-7 と、一括 17 の問 8（docs/design/batch17-triage.md）。
  持ち主の向きの承認 = 台帳 f2-648 notes 2026-09-24 15:31 JST（一括 17 の問 1〜8 への回答・推奨どおり）。発効は本判断の承認要求（docs/design/adr-20.md）で別に問う。
  【実測の出所】引き金の要約値は、写しの設計文書に変更を当て、30 周目の置き場を材料に folio ceiling --stamp で印を導出し直して、印の trigger の行を比べた（trigger_probe.sh）。
  周の区間は各周の依頼文の「main <7 桁>」（30 周目は枝 b0be15b・依頼文の注）で、intervals.py が実装の引き金の一覧を Python で写して区間ごとに比べる。
  写しの一覧は ceiling.rs の定数と同じ欄を持つ（受入基準の判定の文は red_test の sentence・要件の確かめ方は丸ごと）。数は 2026-09-24・枝 docs/adr20 の時点で、再実行できる。
  【起草の迷い】決定 (2) で前文と schema 節を型付きの定数に足す（案 d）か、判断の記録の改訂の欄で数えるか。一括 17 の問 8 のコストの欄は「推奨の 2 を採ると引き金の定数・生成区間の写し・凍結の写し・歯の便」と見積もっていたが、
  実測で結び付き（過去 2 区間のうち 2・床が N-4 で落とす）が確かめられたので、便の要らない形を採り、定数に足す形を撤退の戻し先にした。持ち主が案 d を選ぶのも筋は通るので承認要求に並べる。
  【別に問う候補（本判断に混ぜない）】要件 FR20 の平易文の長さ（天井の 31 周目 読みやすさ F-4・規範の欄の並びを判断の記録 ADR-18 決定 (1) を指す 1 文に縮める勧め）は、本判断の決定 (5) ③ の注の 1 文とは別の直しで、31 周目の一括で扱う。
