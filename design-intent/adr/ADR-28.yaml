# folio2 判断の記録 ADR-28 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-28.html・生成物・手で直さない）。
# 状態: accepted（起草 2026-09-27・orchestrator 席の起草役〔opus 5.5〕・発効 2026-09-27 10:45 JST 席の裁定〔行 D-17・憲法を改訂しない判断の記録〕・f2-648 notes）。憲法の条文は 1 字も変えない。
# 起点: 天井の 52 周目（一括 30 の枝 dd63fbe の上）の文書どうしの整合 F-1（止める・反証 支持・~/.local/share/folio2/ceiling/2026-09-27-round52/refute-notes/coherence-F-1.md）と F-2（直す）。

id: ADR-28
title: 置き場の憲法の値域は道具の値域と同じ集合かで比べ、骨格は注入の上限の行を持ち注入の対象にもなる（判断の記録 ADR-16 の決定 (2)(ウ)(オ) と (3) の範囲を群 A の実装に揃える）

status: accepted
date: 2026-09-27

plain: |
  外の置き場（ほかのプロジェクトの設計文書）で道具を使えるようにする一連の便（群 A）で、道具の振る舞いが 3 か所、判断の記録 ADR-16 の決めた範囲から変わりました。この判断は、その変わった範囲を記録します。
  1 つ目は、憲法で使える値の一覧（段・強さなど）の比べ方です。ADR-16 は、置き場の一覧が道具の一覧の中に収まっていれば検査を続け、道具の一覧に値を足しても利用者の検査は変わらない、と決めていました。今の道具は、置き場の一覧が道具の一覧と同じときだけ「まだ分からない」を出さず、置き場の一覧が道具の一覧から値を外しているときも「まだ分からない」と言います（2026-09-26 の持ち主の裁定）。そのため道具の一覧に値を足すと、前の一覧を写した利用者の検査は「まだ分からない」に落ち、利用者が自分の憲法を直すまで戻りません。
  2 つ目は、最初の文書一式（骨格）が持つ決まりの行です。ADR-16 は承認の受け方と説明文の検査の 2 行としていましたが、今の骨格は AI の手元へ写す量の上限の行も書き、その 3 行を縛る条 1 本を持ちます。例外の口を足さないことを定める条は骨格に置かず、利用者が要れば自分で足します。
  3 つ目は、骨格の憲法の形と、AI の手元へ写すことです。ADR-16 は骨格の憲法を、本来の憲法の条を番号で指す「床の受付の宣言」とし、AI の手元へ写す対象にしないとしていました。今の骨格の憲法は、利用者が自分の憲法として書き換えるひな形で、宣言の形は書きません。AI の手元へ写す命令も、骨格の置き場で手直しなしに 1 回で回ります。
  ADR-16 の決定の文そのものは書き換えず、この判断の「改訂の欄」で範囲を変えます。道具を直す便はありません（どれも着地済みです）。

context: |
  (1) 出所。天井の 52 周目の文書どうしの整合の所見 1（F-1・止める・反証 支持）は、ADR-16 決定 (2)(ウ)（部分集合なら判定でき、値を足しても利用者の床は変わらない）・案 a・帰結と、要件 FR25 の規範文と受入基準 AC22（同じ集合かを数え、値を外した鍵も まだ分からない）が、同じ入力に逆の答えを持つと拾った。
  両者をつなぐのは ADR-16 の注の群 A の段だけで、判断の記録の欄の決まりの改訂の欄の注（design-intent/adr/schema.yaml の revises_note）と ADR-21 決定 (6) と ADR-25 の案 b の理由は、発効した判断の範囲の変更を別の判断の改訂の欄に置き、注を範囲の改訂の口にしない。同じ形は 43 周目の整合の所見 1 で拾われ、ADR-25 で解いた。
  同じ周の整合の所見 2（F-2・直す）は、ADR-16 決定 (2)(オ) と (3) の骨格と注入の字が要件 FR22 と食い違い、注の読みでしか揃っていないと拾った。
  (2) 実装。便 157（台帳 f2-648.195・2026-09-27 着地）は、置き場の値域の各鍵を組み立てた版の同じ鍵と同じ集合かで数え、値を外した鍵も まだ分からない にした（持ち主の裁定 2026-09-26 15:22 JST・棚卸しの問 2・逐語「２．推奨で」・f2-648 notes＝狭める向きも広げる向きと対称に止める）。
  便 152（台帳 f2-648.189 と .196）は骨格に行 R-2 を足し、骨格の憲法を利用者が書き換える雛形にした。便 159（台帳 f2-648.238）は注入の書き込みが生成区間の置き場を用意する形にした。便 156（台帳 f2-648.194）は行 R-17 の無い置き場で床が判定の外の 1 行を出す形にした。
  ADR-21 決定 (2) が v3 の入口の便の論点に残した「本来の憲法を持たない利用者向けの雛形」は、便 152 が雛形を 1 つの形にして答えた。

decision: |
  (0) 本判断は憲法の条文を改訂しない。規則の表の行を足さない。便を起こさない（実装と歯は便 152・156・157・159 で既に本判断の形である）。
  決めるのは、ADR-16 の決定 (2)(ウ)・(2)(オ)・(3) の範囲を改訂の欄で変えることだけである。ADR-16 の決定 (4) の物差し（(ウ) は値域のずれを まだ分からない に上げる向きで、緩める向きの口を持たない）と、注入を M3 の判定点に入れないこと（決定 (1)）は変えない。
  (1) **値域は同じ集合かで比べる（ADR-16 決定 (2)(ウ) を狭める）。** 置き場の憲法の値域の節の各鍵が、組み立てた版の同じ鍵と同じ集合かを床で数える。
  組み立てた版に無い値を持つ鍵は今までどおり まだ分からない とし、組み立てた版の値を外した鍵も、条の値は置き場の値域で引いたまま まだ分からない とする。値域を置き場ごとに広げる口も狭める口も持たない。
  (2) **骨格が持つ行と条（ADR-16 決定 (2)(オ) を広げる）。** 骨格は行 R-2・R-8・R-16 と、その 3 行を縛る条 1 本を持つ。例外の口を足さないことを定める条は骨格に置かず、利用者が要れば利用者の持ち主の裁定で足す。
  床と注入が名で引く行は R-2・R-8・R-16 である。行 R-17 の無い置き場では、床は散文の言及を数えずに判定の外の 1 行を出す。
  (3) **骨格の憲法の形と注入（ADR-16 決定 (3) を広げる）。** 骨格の憲法は、名と承認欄を「未記入」の印で書いた、利用者が自分の憲法として書き換える雛形とし、本来の憲法を持たない利用者にも当てる。本来の憲法を指す「床の受付の宣言」の形は書かない。
  骨格の置き場も注入の対象にし、注入の書き込みは生成区間の置き場が無ければ用意する。決定 (3) のほかの字（既に文書群が在る置き場に書かない・雛形に folio2 の口座名と席とモデルの名と持ち主の逐語を写さない・相談窓口の雛形・案内の 1 行）は変えない。

options:
  - id: a
    name: 改訂の欄で範囲を変える（採る）
    text: 決定 (0)〜(3) の形。ADR-16 の決定の字は変えず、本判断の改訂の欄が 3 つの範囲の変更を持ち、ADR-16 の注はその在り処を 1 文ずつ指す。
    verdict: adopted
    reason: 判断の記録の欄の決まりが範囲の変更に定める口で、ADR-25 と同じ形である。52 周目の反証が支持した読み（注では範囲を変えられない）に正面から答える。
  - id: b
    name: ADR-16 の注の読みのままにする
    text: 群 A の段の読みだけで、決定の範囲の変更を運ぶ。
    verdict: rejected
    reason: 欄の決まりと ADR-25 の案 b の理由が退けた形で、52 周目が止める として拾い、反証も支持した。次の周でも同じ所で止まる。
  - id: c
    name: 部分集合の比べ方へ戻す
    text: 便 157 を戻し、値を外した鍵は通す。
    verdict: rejected
    reason: 持ち主の裁定（2026-09-26・棚卸しの問 2＝狭める向きも止める）に反する。値を外した置き場を黙って通すと、組み立てた型と置き場の値域が食い違ったまま合格になる（条 P-4.2）。

basis: [P-4, P-6, P-8, P-12, N-3, R-2, R-8, R-16, R-17, D-17, FR22, FR25, AC19, AC22, ADR-16, ADR-21, ADR-25]

revises:
  - {target: ADR-16, decision: (2)(ウ), kind: narrow, summary: 置き場の値域の各鍵を組み立てた版の同じ鍵の部分集合かでなく同じ集合かで数え、組み立てた版の値を外した鍵も条の値は置き場の値域で引いたまま まだ分からない とし、「folio2 が値域に値を足しても利用者の床は変わらない」の範囲を外す（便 157・持ち主の裁定 2026-09-26 15:22 JST 棚卸しの問 2）}
  - {target: ADR-16, decision: (2)(オ), kind: widen, summary: 骨格が持つ行を R-8・R-16 から R-2・R-8・R-16 へ広げ、条はその 3 行を縛る 1 本とし、例外の口を足さないことを定める条は骨格に置かない（利用者の持ち主の裁定で足す）。床と注入が名で引く行も R-2・R-8・R-16 とし、行 R-17 の無い置き場では床が判定の外の 1 行を出す（便 152・156）}
  - {target: ADR-16, decision: (3), kind: widen, summary: 骨格の憲法を本来の憲法を指す「床の受付の宣言」から、名と承認欄を「未記入」の印で書いた利用者が書き換える雛形に替えて本来の憲法を持たない利用者にも当て、骨格の置き場も注入の対象にする（便 152・159・注入を M3 の判定点に入れないことは変えない）}

consequences:
  - 要件 FR22・FR25 と受入基準 AC19・AC22 と、ADR-16 の決定 (2)(ウ)(オ)(3) の読みが揃う。ADR-16 の決定・案・帰結の字は残り、今の範囲は本判断の改訂の欄が持つ。
  - ADR-16 の案 a の「値域は部分集合で比べる」と帰結の「値域の比べ方を部分集合にしたので、folio2 が値域に値を足しても利用者の床は変わらない」は、本判断の後は成り立たない。folio2 が値域に値を足しても外しても名を変えても、その前の値域を写した利用者の床は まだ分からない に落ち、戻すには利用者の憲法の改訂が要る。まだ分からない が在る間は 3 つの凍結の旗も凍結しない。
  - ADR-16 の撤退条件 (3) の 3 文目（組み立てた値域の変更だけを理由に利用者の床が落ちた回）の数えには、値の追加で落ちた回も入る。
  - ADR-16 の注の群 A の段のうち、本判断の範囲の読みは本判断の改訂の欄を指す 1 文ずつになる。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。
    (1) folio2 が値域に値を足した組み立てだけを理由に、外の置き場の床が まだ分からない に落ちた回（ADR-16 の撤退条件 (3) の 3 文目の数えと同じ回）が 1 回になったら、部分集合の比べ方へ戻す案 c を、狭める向きも止める持ち主の裁定の理由と並べて持ち主に問う。
    (2) 骨格の置き場で、注入か床が手直しを要した記帳（利用者の台帳の記録を名指して写す）が 1 件になったら、骨格の行と条の形を問い直す。

