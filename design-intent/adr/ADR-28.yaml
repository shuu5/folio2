# folio2 判断の記録 ADR-28 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-28.html・生成物・手で直さない）。
# 状態: accepted（起草 2026-09-27・orchestrator 席の起草役〔opus 5.5〕・発効 2026-09-27 10:45 JST 席の裁定・11:37 JST の席の裁定で範囲を広げた〔行 D-17・憲法を改訂しない判断の記録〕・f2-648 notes）。憲法の条文は 1 字も変えない。
# 起点: 天井の 52 周目（一括 30 の枝 dd63fbe の上）の文書どうしの整合 F-1（止める・反証 支持・~/.local/share/folio2/ceiling/2026-09-27-round52/refute-notes/coherence-F-1.md）と F-2（直す）、一括 30 の改訂 e の独立の検証（handoff-2026-09-27/batch30-verify.md）。

id: ADR-28
title: 発効した判断の記録の決定の範囲を、注でなく改訂の欄で持つ（節目の一括 30 で見つかった同じ形の穴）

status: accepted
date: 2026-09-27

plain: |
  発効した判断の記録の決めた範囲が、あとの裁定や道具の直しで変わったのに、その変わり目を記録の末尾の「注」でしか書いていない所がありました。判断の記録の決まりでは、範囲の変更は、変えた側の判断の記録の「改訂の欄」に 1 行ずつ書き、注は範囲を変える口にしません。この判断は、節目の一括 30 で見つかった同じ形の所をまとめて改訂の欄に移します。変わった中身はどれも、持ち主の裁定か着地した便で既に決まっていたもので、この判断が新しく決め直すものはありません。行ごとに、どの裁定か便で変わったかを書きます。
  1 つ目は、外の置き場（ほかのプロジェクトの設計文書）で道具を使えるようにした一連の便（群 A）で変わった、判断の記録 ADR-16 の 3 か所です。
  憲法で使える値の一覧（段・強さなど）は、置き場の一覧が道具の一覧と同じときだけ検査を続け、値を外しているときも「まだ分からない」と言います（2026-09-26 の持ち主の裁定）。そのため道具の一覧に値を足すと、前の一覧を写した利用者の検査は「まだ分からない」に落ち、利用者が自分の憲法を直すまで戻りません。
  最初の文書一式（骨格）は、承認の受け方・説明文の検査・AI の手元へ写す量の上限の 3 行と、その 3 行を縛る条 1 本を持ちます。例外の口を足さないことを定める条は骨格に置かず、要るなら利用者の持ち主の裁定で足します。文章の中の番号の指し合いを数える決まりの行が無い置き場では、検査は数えずに、数えていないことを 1 行で知らせます。
  骨格の憲法は、利用者が自分の憲法として書き換えるひな形で、本来の憲法を指す「床の受付の宣言」の形は書きません。承認の言葉を台帳を指す形で書くことを認める条も、利用者の憲法の条です。AI の手元へ写す命令も、骨格の置き場で手直しなしに 1 回で回ります。
  2 つ目は、判断の記録 ADR-21 が「本来の憲法を別に持つ利用者」に限って残した宣言の形です。骨格がその形を書かなくなったので、当たる相手がありません。次の世代の置き場（v3）が場所を自分で選ぶことは変えません。
  3 つ目は、判断の記録 ADR-13 の 2 つの単位です。検査が「まだ分からない」と言って作業の受付を止める範囲を、作業が書き換えるファイルだけへ狭める決定は、運ぶ作業を 2026-09-26 の棚卸しで要らないとして閉じた（持ち主は推奨どおりと答えました）ので、今までどおり置き場の全体で止めます。AI の検査に渡す材料は、読むと言った欄までは切らず、その欄を含む大きな節で止めます（2026-09-23 の持ち主の承認・読むと言った欄は 1 つも落としません）。
  4 つ目は、古い 2 つの字です。相談窓口の「戻せない判断を残すか」の行き先は「最初は 0 本の棚」でしたが、骨格から始めた置き場では骨格が書いた 1 本から始まります（ADR-6）。AI の検査の忠実さの問いは「4 つに閉じる」でしたが、2026-09-19 の版から、やさしい説明が引く決まりの値を確かめる 5 つ目を持ちます（ADR-8）。
  どの判断の記録も決定の文そのものは書き換えません。道具を直す便はありません（どれも着地済みです）。
  この判断を問い直す条件は 3 つです。道具の一覧に値を足しただけで外の置き場の検査が「まだ分からない」に落ちた回が 1 回になったら、比べ方を戻すかを持ち主に問います。骨格の置き場で、写す命令か検査が手直しを要した記録が 1 件になったら、骨格の行と条の形を問い直します。検査が「まだ分からない」で止めた作業のうち、書き換えるファイルだけで測れば通せたものが 1 本出たら、受付を止める範囲を問い直します。

context: |
  (1) 出所。判断の記録の欄の決まりの改訂の欄の注（design-intent/adr/schema.yaml の revises_note）と ADR-21 決定 (6) と ADR-25 の案 b の理由は、発効した判断の範囲の変更を別の判断の改訂の欄に置き、注を範囲の改訂の口にしない。
  天井の 52 周目の文書どうしの整合の所見 1（F-1・止める・反証 支持）は、ADR-16 決定 (2)(ウ)・案 a・帰結と、要件 FR25 の規範文と受入基準 AC22 が同じ入力に逆の答えを持ち、つなぐのが ADR-16 の注だけであると拾った（同じ形は 43 周目の整合の所見 1 で拾われ、ADR-25 で解いた）。同じ周の整合の所見 2（F-2・直す）は、ADR-16 決定 (2)(オ) と (3) と ADR-21 決定 (2) の骨格と注入の字が要件 FR22 と注の読みでしか揃っていないと拾った。
  一括 30 の改訂 e の独立の検証（2026-09-27）は、同じ形を ADR-13 決定 (9)（要件 FR20 と逆の答え・注が自ら改訂の欄の行は無いと書く）と ADR-6 決定 (2) ③（台帳 f2-648.198・32 周目の整合の所見 5）にも拾った。席はそれを受けて本判断より前の判断の記録 27 本の注を同じ形であたり、決定の範囲を注だけで動かしている所を ADR-13 決定 (5)(10) と ADR-8 決定 (1) ① にも見つけた（注の【同じ形の全数】）。
  (2) 範囲を変えたもの（出所）。
  ① ADR-16 の 3 か所は群 A の便で変わった。便 157（台帳 f2-648.195）は置き場の値域の各鍵を組み立てた版の同じ鍵と同じ集合かで数え、値を外した鍵も まだ分からない にした（持ち主の裁定 2026-09-26 15:22 JST・棚卸しの問 2・逐語「２．推奨で」・f2-648 notes＝狭める向きも広げる向きと対称に止める）。便 152（台帳 f2-648.189 と .196）は骨格に行 R-2 を足し、骨格の憲法を利用者が書き換える雛形にした。便 159（台帳 f2-648.238）は注入の書き込みが生成区間の置き場を用意する形にした。便 156（台帳 f2-648.194）は行 R-17 の無い置き場で床が判定の外の 1 行を出す形にした。
  ② ADR-21 決定 (2) が本来の憲法を別に持つ利用者に限った宣言の形は、便 152 の後は骨格が書かない。同じ決定が v3 の入口の便の論点に残した「本来の憲法を持たない利用者向けの雛形」は、便 152 が雛形を 1 つの形にして答えた。
  ③ ADR-13 決定 (9) を運ぶ便 ⑩（台帳 f2-648.146）は、ADR-18 決定 (7) が便アの着地の後に要否を問い直すとした。棚卸し（2026-09-26）は、便アの後に門が まだ分からない を返して止めた設計文書の便が 0 本なので要否を不要と推し、持ち主は 15:22 JST に棚卸しを推奨どおりと答え（逐語「すり合わせ：／１．推奨で／…／５．推奨で」）、台帳 f2-648.146 は同日に閉じた。
  ④ ADR-13 決定 (5)(10) の束を絞る単位は、便 98（台帳 f2-648.140）と便 97（台帳 f2-648.135）が節で入れ、一括 14 の問 5 が節で止める形を今の実装として受け入れた（持ち主 2026-09-23 23:49 JST・逐語「全部推奨で良い」）。問 5 は注で済ませる形（2-a）を採ったが、その後に ADR-25（2026-09-26 発効）が注を範囲の改訂の口にしないことを案 b の理由で定めたので、中身は問 5 のまま置き場だけを改訂の欄へ移す。
  ⑤ ADR-6 決定 (2) ③ の棚は、ADR-16 決定 (2)(カ)（持ち主 2026-09-23 17:39 JST・逐語「裁定は両方承認する」）と便 125（台帳 f2-648.173）で、骨格が最初の判断の記録を 1 本書く形になった（要件 FR22）。
  ⑥ ADR-8 決定 (1) ① の忠実さの母集団は、ADR-10 決定 (2) ② と天井の正本 第 2 版（持ち主 2026-09-19・逐語「どちらも承認する」）で 5 つ目を持った。

decision: |
  (0) 本判断は憲法の条文を改訂しない。規則の表の行を足さない。便を起こさない（どの範囲の変更も、実装と歯は着地済みの便で既に本判断の形である）。
  決めるのは、下の (1)〜(7) の決定の範囲を改訂の欄で変えることだけで、中身の出所は文脈 (2) の持ち主の裁定か着地した便である。改訂される判断の記録の決定・案・帰結・撤退条件・承認欄の字は書き換えず、その注は本判断の改訂の欄の在り処を 1 文で指す（ADR-21 決定 (6) と同じ運び方）。
  ADR-16 の決定 (4) の物差し（(ウ) は値域のずれを まだ分からない に上げる向きで、緩める向きの口を持たない）と、注入を M3 の判定点に入れないこと（決定 (1)）は変えない。
  (1) **値域は同じ集合かで比べる（ADR-16 決定 (2)(ウ) を狭める）。** 置き場の憲法の値域の節の各鍵が、組み立てた版の同じ鍵と同じ集合かを床で数える。
  組み立てた版に無い値を持つ鍵は今までどおり まだ分からない とし、組み立てた版の値を外した鍵も、条の値は置き場の値域で引いたまま まだ分からない とする。値域を置き場ごとに広げる口も狭める口も持たない。
  (2) **骨格が持つ行と条（ADR-16 決定 (2)(オ) を広げる向きと狭める向きの 2 行）。** 骨格は行 R-2・R-8・R-16 と、その 3 行を縛る条 1 本を持ち、床と注入が名で引く行は R-2・R-8・R-16 である（広げる向き）。
  例外の口を足さないことを定める条は、利用者の本来の憲法に指す先が在っても骨格に置かず、利用者が要れば利用者の持ち主の裁定で足す。行 R-17 の無い置き場では、床は黙らずに、散文の言及を数えないことを判定の外の 1 行で出す（狭める向き）。
  (3) **骨格の憲法の形と注入（ADR-16 決定 (3) を広げる）。** 骨格の憲法は、名と承認欄を「未記入」の印で書いた、利用者が自分の憲法として書き換える雛形とし、本来の憲法を持たない利用者にも当てる。本来の憲法を指す「床の受付の宣言」の形は書かない。
  骨格の置き場も注入の対象にし、注入の書き込みは生成区間の置き場が無ければ用意する。決定 (3) のほかの字（既に文書群が在る置き場に書かない・雛形に folio2 の口座名と席とモデルの名と持ち主の逐語を写さない・相談窓口の雛形・案内の 1 行）は変えない。
  承認欄の逐語を利用者の台帳の裁定 id を指す形で書くことを認める条は、決定 (3) の「利用者の宣言の条」でなく利用者の憲法の条とする（骨格の憲法が宣言の形を書かないため）。
  (4) **宣言の形を当てる相手を外す（ADR-21 決定 (2) を狭める）。** 骨格の憲法を「床の受付の宣言」と題して本来の憲法を指す形は、同じ repo に本来の憲法を別に持つ利用者にも当てない（骨格の命令がその形を書かない）。
  v3 の持ち主が書き換えてから第 1.0 版を承認し、その後に始まりの凍結を撃つ順は変えず、書き換える字は雛形の「本来の憲法を指す」字でなく雛形そのものと読む。scribe2 の置き場（design-intent/folio2）の字と、v3 の置き場の場所は v3 が選ぶことは変えない。
  (5) **門の単位の変更を外す（ADR-13 決定 (9)・(14)・(16) を狭める）。** 門は「まだ分からない」の側も「不合格」の側も設計文書の置き場の全体で測る（要件 FR20 の規範文のとおり）。
  決定 (9) の便の file の単位の判定は置かず、決定 (14) が ADR-8 決定 (4) を便の file の側へ狭めること（ADR-13 の改訂の欄の ADR-8 の行）は効かない（行は来歴として残る・ADR-8 決定 (4) の今の範囲は ADR-18 の改訂の欄が持つ）。決定 (16) の便の列から ⑩ を外す。
  (6) **束を絞る単位は節で止める（ADR-13 決定 (5)・(10) を狭める）。** 材料の束は、観点が読むと宣言した欄を含む最上位の節を丸ごと残し、宣言の無い最上位の節だけを落とす（宣言が欄まで下りていても、同じ節の中のほかの欄は落とさない）。
  凍結 anchor を組む独立の script も同じ節の単位で切る。決定 (5) の「切るのは観点が自分で「読まない」と宣言した欄だけ」が定める切る上限は変えない。
  (7) **古い 2 つの字の範囲（ADR-6 決定 (2) ③・ADR-8 決定 (1) ① を広げる）。** 相談窓口の問い ③ の はい の行き先の棚は、骨格から始めた置き場では骨格が書いた最初の判断の記録 1 本（folio の欄の決まりを採る・提案中）から始まる（要件 FR22）。
  天井の忠実さの母集団は、決定 (1) ① の 4 つに「平易文が引く規則の表の値が表の値と同じか」を足した 5 つとし、問いの文の正本は天井の正本の観点の欄である。

options:
  - id: a
    name: 改訂の欄で範囲を変える（採る）
    text: 決定 (0)〜(7) の形。改訂される判断の記録の決定の字は変えず、本判断の改訂の欄が範囲の変更を 1 行ずつ出所とともに持ち、改訂される側の注はその在り処を 1 文ずつ指す。
    verdict: adopted
    reason: 判断の記録の欄の決まりが範囲の変更に定める口で、ADR-25 と同じ形である。52 周目の反証が支持した読み（注では範囲を変えられない）に正面から答え、同じ形の所を全数で閉じる。
  - id: b
    name: 注の読みのままにする
    text: 改訂される側の注の読みだけで、決定の範囲の変更を運ぶ。
    verdict: rejected
    reason: 欄の決まりと ADR-25 の案 b の理由が退けた形で、52 周目が止める として拾い、反証も支持した。次の周でも同じ所で止まる。
  - id: c
    name: 部分集合の比べ方へ戻す
    text: 便 157 を戻し、値を外した鍵は通す。
    verdict: rejected
    reason: 持ち主の裁定（2026-09-26・棚卸しの問 2＝狭める向きも止める）に反する。値を外した置き場を黙って通すと、組み立てた型と置き場の値域が食い違ったまま合格になる（条 P-4.2）。
  - id: d
    name: 出所ごとに別の判断の記録を起こす
    text: 群 A・棚卸し・一括 14・古い字ごとに、小さい判断の記録を 1 本ずつ起こす。
    verdict: rejected
    reason: 穴の形は 1 つ（注を範囲の改訂の口にしない）で、行ごとに出所を書けば 1 本で読める。記録を割ると同じ理由と撤退条件を何度も書くことになる（行 D-18）。

basis: [P-4, P-6, P-8, P-12, N-3, R-2, R-8, R-16, R-17, D-17, D-18, FR17, FR20, FR22, FR25, AC19, AC22, ADR-10, ADR-16, ADR-18, ADR-21, ADR-25]

