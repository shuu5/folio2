# folio2 判断の記録 ADR-29 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-29.html・生成物・手で直さない）。
# 状態: proposed（起草 2026-09-27・orchestrator 席の起草役〔opus 5.5〕・一括 31 の承認要求〔要件 FR23 の規範文の意味が変わる＝行 D-17 で持ち主の承認 1 回〕）。憲法の条文は 1 字も変えない。
# 起点: 台帳 f2-648.233 の討論の論点 1〜4 への持ち主の裁定（2026-09-27 10:47 JST・逐語「論点は推奨で良い」）。材料 = ~/.local/share/folio2/handoff-2026-09-27/rootdigests-options.md。

id: ADR-29
title: 列の根を二段で照らす（表に在る名は表の行で、無い名は版管理に最初に記録した第 1.0 版の anchor で）

status: proposed
date: 2026-09-27

plain: |
  憲法の写しの列の「いちばん最初の 1 枚」（列の根）の確かめ方を 2 段に分けます。
  いまは道具の中の表に名前が載った置き場しか列を始められず、外の repo が使い始めるたびに folio2 の側の便と組み直しが要ります（次の世代の置き場〔tsuzuri〕では承認から合格まで 2 時間 42 分）。
  この判断のあと、表に名前が在る置き場は今と同じく表の値と照らします。名前が無い置き場は、版の履歴（git）に最初に記録した 1 枚を根とし、あとで差し替えると止めます。表に載った 1 枚を別の名前で持ち込むことも止め、浅い複製やまだ記録していないときは「まだ分からない」と言います。
  止められなくなるのは、版の履歴ごと作り直して別の 1 枚から始める手だけで、これはほかの履歴の書き換えと同じく取り込みの審査に任せます。表は強い守りが欲しい置き場の任意の登録口として残します。

context: |
  (1) 判断の記録 ADR-2 決定 (3)(5) は列の根の要約値を床の定数と一致させ、ADR-16 決定 (2)(ア) はその定数を憲法の名で引く表に広げて、表に無い名の列を凍結の命令が断り床が落とす形にした。行を足すのは folio2 の便である（行 D-11）。
  (2) 表が上乗せしている守りは、新しい版管理で別の中身の第 1.0 版から列を始め直す手を止めることだけである。同じ repo の中の作り直し（anchor を消して凍結し直す・根の無い枝・別の参照）は、版管理の照合と始め直しの拒否が表に依らず止める。表が外側の証人になるのは、利用者の撃つ組み立てが利用者の手の外にあるときだけである（ADR-16 案 a の理由）。
  (3) 表は許可の一覧なので利用者ごとに folio2 の便と組み直しが要り、次の世代の置き場（tsuzuri）では便 2 本と 2 時間 42 分かかった（便 133・134）。便 153 の実測では、この表が「外の repo で骨格から手直しなしに合格」の最後の壁である。
  (4) ADR-16 は案 f（根を利用者の repo の側で決める）を「利用者が 1 つなら 1 行足す方が安い」という費用で退け、撤退条件 (3) で表の行が 3 行になったら比べ直すとした。持ち主の直命（2026-09-26・道具としての完成）と (3) の実測は、その前提を変える新しい事実である。持ち主は台帳 f2-648.233 の論点 1〜4 を 2026-09-27 に推奨どおり裁定した。

decision: |
  (0) 本判断は憲法の条文を改訂しない。規則の表の行を足さない。列の根の表とその 2 行（folio2 と次の世代の置き場〔tsuzuri〕）、表に在る名の照らし、写しを置き場の名の行だけにする導出は変えない。
  (1) **列の根を二段で照らす。** 表に在る名は、今のとおり根の要約値を表のその名の行と照らす。表に無い名は版管理に最初に記録した第 1.0 版の anchor を根とし、(ア) 根の要約値が表のどの行とも違うこと（同じなら床は違反とし、凍結の命令は断る＝改名で表の照らしから逃げる道を塞ぐ）と、(イ) 根の anchor が版管理の先頭（HEAD）に記録済みで、全ての参照の履歴のどの記録とも形式を問わず同じこと（違えば違反・浅い写しと記録の前と版管理が読めないときは まだ分からない）を確かめる。
  (2) **表に無い名の凍結は断らない。** 始まりの凍結は (1)(ア) とほかの検査を通れば書き、根の要約値を告げる。根にできるのは承認欄の形を満たす第 1.0 版だけで（便 155・158）、持ち主の承認そのものは機械の外に在る（条 P-12.1・P-12.3）。
  (3) **止める役を移す。** 新しい版管理で根を作り直して持ち帰る手は、床の外（共有の版管理の保護と取り込みの審査）に移す。ADR-2 の帰結が履歴の書き換えを既に任せている先である。
  (4) **表は残す。** 表は強い証人を要る置き場が任意に名を載せる口とする（手順は行 D-11 のまま）。次の世代の置き場の行は、ADR-21 の合流でその置き場が folio の実装を自分の組み立てに持った後に外す。
  (5) **ADR-16 の案 f と撤退条件 (3)。** 案 f のうち根を版管理の履歴で守る形を採り直し、根を置き場の欄で選ぶ形は採らない。撤退条件 (3) の「表に folio2 以外の行が 3 行で案 f と比べ直す」は本判断が前倒しで果たした。
  (6) **条の読み。** 二段の根は条 N-3.1 の例外の口ではない。照合はいつも走り、失敗した列が逃げる口にならない（始め直しの拒否・版管理の照合・(1)(ア) の逆引き）。旗も置き場の欄も足さない。条 P-10.2 について、表に無い名の根の照らしは版管理の記録との突き合わせで、生成物どうしの突き合わせではない。条 P-4.2 について、照らせないときの まだ分からない が増える（表に無い名の置き場の自動の検査は全履歴を取る）。
  (7) 実装は便 164（行 fk）で運ぶ。

options:
  - id: a
    name: 二段の根（採る）
    text: 決定 (0)〜(7) の形。
    verdict: adopted
    reason: 外の repo で骨格から folio2 の便なしに合格まで届き、実行できなかった検査を合格にしない（条 P-4.1）を保つのはこの案だけである。失うのは新しい版管理での作り直しを床が止める力だけで、その受け手は ADR-2 に既に在る。表に在る名の守りは弱まらない。
  - id: b
    name: 今のままを定型化する
    text: 表に行を足す便の雛形と要約値の再現の道具を席が持ち、待ちを縮める。
    verdict: rejected
    reason: 便と組み直しは利用者ごとに残り、手直しなしの合格に届かない。本判断を捨てるときの次善とする。
  - id: c
    name: 根を端末の設定 file に持つ
    text: 列の根を版管理の外の、端末ごとの設定 file に登録する。
    verdict: rejected
    reason: 判定に使う値の置き場が 3 つ目になり条 P-5.5 に当たる読みが強く、端末ごとに合否が変わる。
  - id: d
    name: 根の表を組み立ての入力にする
    text: 列の根の表を、道具の組み立ての時に外から与える。
    verdict: rejected
    reason: 組み立てが利用者の手の内にあれば何でも通り、守りは案 a 以下で、ADR-16 決定 (2) の 1 つの組み立ても崩れる。
  - id: e
    name: 凍結の前を合格として返す
    text: 始まりの凍結の前の置き場を、まだ分からない でなく合格として返す。
    verdict: rejected
    reason: 実行できなかった検査を合格と表示しない要件 FR5 と条 P-4.1 に正面から当たる。
  - id: f
    name: 持ち主の鍵の署名で根を承認する
    text: 表を持ち主の公開鍵の一覧にし、根の anchor に持ち主が署名する。
    verdict: rejected
    reason: 最も強いが便が 2〜3 本要り、repo ごとに持ち主の手の操作が増える。持ち主が 1 人の今は上乗せが小さいので、持ち主の違う利用者が来たときに起こす（撤退条件 (2)）。
  - id: g
    name: 今のまま（利用者ごとに表の行を足す便）
    text: ADR-16 決定 (2)(ア) の形のまま、利用者が来るたびに表へ行を足す。
    verdict: rejected
    reason: 利用者の数だけ folio2 の便と組み直しと待ちが要り、道具としての完成に届かない。

basis: [P-4, P-5, P-10, P-12, N-3, D-11, D-17, FR5, FR23, FR24, AC20, ADR-2, ADR-16, ADR-21]

grill: {when: 2026-09-27, who: 持ち主と orchestrator 席（論点を 1 つずつ・席の推奨つき）, where: ~/.local/share/folio2/handoff-2026-09-27/rootdigests-options.md の §5 と台帳 f2-648.233 の notes, summary: 論点 1（作り直しを止める役を取り込みの審査へ移すか）・2（ADR-16 撤退条件 (3) を待たず比べ直すか）・3（条 N-3.1・P-10.2・P-4.2 の読みと憲法の改訂の要否）・4（表の今後と署名を起こす条件）を、持ち主が 2026-09-27 10:47 JST に「論点は推奨で良い」で推奨どおりに採った}

revises:
  - {target: ADR-2, decision: (3), kind: narrow, summary: 列の根の要約値を床の定数と一致させる照らしと「根は 1 度きり」を、列の根の表に在る名の置き場に限る（表に無い名は版管理に最初に記録した第 1.0 版の anchor を根とし、新しい版管理での作り直しは床の外へ移す）}
  - {target: ADR-2, decision: (5), kind: narrow, summary: 床の定数と一致させる列の根を、列の根の表に在る名の置き場に限る（写しの取り方と範囲の下限・置き場・印は変えない）}
  - {target: ADR-16, decision: (2)(ア), kind: narrow, summary: 表に無い名の憲法の列の根を、凍結の命令が断り床が落とす形から、根の要約値が表のどの行とも違い版管理に最初に記録した anchor と同じなら通す形に狭める（表に在る名の照らし・表の 2 行・写しの導出は変えない）}
  - {target: ADR-21, decision: (4), kind: narrow, summary: ⑦（列の根の表に利用者の行を足す便）を、置き場が表を任意の強い証人に使うときだけ起こす便に狭める}

consequences:
  - 外の置き場は、骨格 → 承認欄 → 始まりの凍結 → 記録（commit）で、folio2 の便も組み直しも無しに床の合格まで届く。
  - 失うのは、表に無い名の置き場で新しい版管理から根を作り直す手を床が止める力である。表に無い名の置き場の床は全履歴を要り、浅い写しでは根が まだ分からない になる。表に在る名の照らしと床の結果は 1 字も変わらない。
  - 表に無い名の根は記録の形式を問わず照らすので、anchor の形式を変える移行の後も差し替えられない（移行は ADR-2 の帰結どおり床の外の手順）。
  - 判断の記録の欄の決まりの生成区間の注の列の根の字は実装の定数が正本で、便が運ぶまで実装より古い字が残る（台帳 f2-648.233）。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に記帳する。
    (1) 持ち主が二段の根を条 N-3.1 の例外の口に当たると判じた記帳が 1 件になったら、本判断を捨てて案 b へ落とす判断の記録を起こす。
    (2) folio2 と持ち主の違う利用者が表に無い名で床を使い始めた記帳が 1 件になったら、案 f と比べ直す判断の記録を起こす。
    (3) 表に無い名の置き場へ新しい版管理で作り直した根の列が取り込まれたと分かった記帳が 1 件になったら、案 f か案 g と比べ直す判断の記録を起こす。
    (4) 本判断の便の着地の後に、folio2 自身の床の結果か表の 2 行か次の世代の置き場の写しの床の結果が着地の前と違っていたら、その便を戻す（数えるのは取り込みの審査・1 回で発動）。

note: |
  【実装】便 164（行 fk・docs/design/delivery-164.md）: 逆引きは crates/folio/src/adr.rs の root_owner、床の二段目は anchor.rs の check_root と gitcheck.rs、凍結の命令は freeze.rs。字の揃え（要件 FR23・FR24・受入基準 AC20・語彙・ADR-2・ADR-16・ADR-21 の注）は同じ一括 31 で行う。
