# folio2 判断の記録 ADR-31 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-31.html・生成物・手で直さない）。
# 状態: proposed（起草 2026-09-28・orchestrator 席の起草役〔opus 5.5〕・持ち主の承認待ち）。憲法の条文は 1 字も変えない。
# 起点: 台帳 f2-648.267・依頼 ~/.local/share/folio2/handoff-2026-09-28/adr31-brief.md・起草の記録 adr31-draft.md（実測の表・script は adr31-scripts/）。

id: ADR-31
title: 決定の欄に台帳の裁定 id を求め、計画の設計ノートの行の索引を契約表から導き、引かれた裁定 id を書き出す（AI の席の文書運用の強制のうち folio の持ち分）

status: proposed
date: 2026-09-28

plain: |
  外の利用者（tsuzuri）の設計の席は、約 35 行ぶんの計画と自分の判断を版管理の外のメモに置き、あなたへの問いを台帳でなく会話で出しました。行はどれも形が正しく、機械の検査を全部通りました。欠けていたのは行の上の層（計画・判断・裁定の反映）で、それを読む検査が無かったのです。この判断は、直す 5 段のうち folio が受け持つ 3 つを決めます。
  1 つ目。決定を書く欄（承認欄・規則の表の行の裁定の欄など）には、台帳の裁定の番号が要ります。番号の形が無ければ機械が止めます。番号が台帳に本当に在るかは器（scribe2）が確かめます。会話だけの決定は、台帳に記帳するまで文書に入れられません。
  2 つ目。置き場が規則の表に「計画のノートはこれ」という名札の行を置くと、その設計ノートに、全部の契約表から機械が書く行の一覧（手で直さない区間）と、まだ契約の無い計画だけの行と、判断の表を持たせ、食い違いを機械が止めます。名札の行を置かない置き場には掛けません。
  3 つ目。文書が引いている裁定の番号を 1 件 1 行で書き出します。台帳の決定と突き合わせるのは器です。

context: |
  (1) 外の利用者（tsuzuri・持ち主の裁定 2026-09-27 で folio2 の唯一の外の利用者）の持ち主は、裁定（t3-hub.57.1・逐語「どちらも推奨で進めて」・案 A）で 5 段を順に進めると決めた: ① 裁定 id の実在（床は形・器は実在）② 計画の設計ノートの必須化（置き場の欄 key の行で有効にし、行の索引は契約表から導く生成区間）③ 器は床が清浄なときだけ受け付ける ④ 反映先の型と未反映の突き合わせ ⑤ 会話の問いを断る guard。folio の持ち分は ① の形・② の全部・④ の書き出しで、③⑤ と ④ の突き合わせは器の持ち分（folio2 の答え = handoff-2026-09-28/t3-hub56-reply.md）。tsuzuri の裁定は folio2 の持ち主の承認の代わりにならない（条 P-12.1）。
  (2) 今の床が裁定 id の形（台帳の id の語を含むか）を見るのは、判断の記録と設計ノートの承認欄・憲法の改訂来歴・凍結 anchor の承認一覧だけである。規則の表の行の裁定の欄と、要件書・入口・天井の正本・相談窓口・索引の欄の決まりの承認欄の行は見ない（条 P-12 と P-17 の機構の注・台帳 f2-648.187）。設計ノートの承認欄は値が一覧の形だと素通りする（f2-648.242）。
  (3) 決定の欄を全数で数えると、本流（0fb780e）は 153 欄で形の無いものは行 R-10 と D-8 の 2 欄（初版の答えの記号だけ・G16=A と G14=A）、外の利用者の写し（b525a13）は 54 欄で 0 欄である。外の利用者の欄の裁定 id は「<台帳の id>（裁定 id = <id>・…）」の自由文で、器の問いの形（t3-hub.56:20260927T2259Z-1）は 4 欄、前の形（t3-hub.1 の notes の user <時刻>）が残りである。folio2 の形は台帳の id と notes の日時（f2-648 notes 2026-09-28 07:18 JST）である。
  (4) 外の利用者の計画のノート（surface-plan）は 7 節とも散文で、残りの行の節の 62 行のうち 11 行は既に第 5 波のノートの契約表に在り、順の節が名指す id 60 のうち 2 つはどこにも無い（字の拾いの参考値）。置き場の契約表は 9 ノート 92 行である。
  (5) folio2 自身の契約表は設計文書（docs/design の md）に在り、folio の設計ノートの母集団の外である。folio2 の計画と現在地は台帳 f2-648 の notes と版管理の外の引き継ぎ file に在る。

decision: |
  (0) 本判断は憲法の条文を改訂しない。器の持ち分（実在の確かめ・受付の床・反映先の型と突き合わせ・問いの guard）と外の利用者の側の約束は本判断の外である。
  (1) **裁定 id の形の床（便 A）。** 決定の欄を次の閉じた一覧とする（実装の定数・欄の決まりの生成区間に写す）: 憲法の発効の承認と各条の改訂来歴の ruling・規則の表の全行の ruling・判断の記録の承認欄の ruling・設計ノートの承認欄の各行の ruling・要件書・入口・天井の正本・相談窓口・索引の欄の決まりの承認欄のうち役が「承認」か「席の裁定」の行の stamp・決定 (2) の判断の表の各行の ruling（便 B が足す）。床（folio check）は各欄の値から決定 (3) の関数で裁定 id を 1 つも切り出せなければ違反とする。値が字でない（一覧・表）ときも違反、値が骨格の印（未記入）のときは まだ分からない とする（裁定の前・条 P-17.3）。全ての置き場に掛け、選ぶ行を持たない。folio2 の行 R-10 と D-8 の裁定の欄は、便 A の着地の前に、初版の行の裁定（憲法の発効の承認 f2-648.1 notes・条 P-17.3）を引く字に直す（規則の表の行の変更・行 D-17 の承認は本判断の承認に含める）。台帳に在るか・対話面 R-8 を通ったかは床で見ない（器と人が見る・条 P-12.2）。
  (2) **計画の設計ノート（便 B）。**
  (ア) 閾値の行の欄（key）の閉じた一覧に値（plan-note）を足す。この値の行を計画の名札の行と呼び、行の値は計画のノートの文書 id である。名札の行が置き場に無ければ (エ) を掛けない（計画のノートを持つかは置き場の持ち主が行で決め、行を足すのも外すのも規則の表の行の変更で裁定 id が要る・条 P-17.1）。名札の行が 2 本以上か、値が文書 id の形でなければ まだ分からない（行 R-19 の欄と同じ）。
  (イ) 計画のノートは設計ノートの 1 つで、文書の種類を増やさない（条 P-5.3・N-5.1）。節の型の閉じた一覧に 3 つ足す（条 P-2.4）: 行の索引（row-index・生成区間・行 = id と所属の文書 id）・計画だけの行（row-plan・人が書く・行 = id と what、任意の depends・ruling・note・節の中の並びが順）・判断の表（decision-table・人が書く・行 = id・text・ruling）。行の索引と計画だけの行は、名札の行が名指す計画のノートにだけ置ける。判断の表はどの設計ノートにも置ける。
  (ウ) 行の索引は、置き場の設計ノートの契約表の行（folio derive と同じ母集団と読み手）から、file 名の順・表の中の順に導く。行の欄は id と文書 id だけで、器の欄（題・大きさ・依存）は写さない（判断の記録 ADR-3 決定 (2)）。書くのは folio derive --write（契約表の導出物と同じ回・全部か無しか）で、folio check と folio derive --check が同じ関数で導き直して比べ、食い違えば違反とし、書き直す命令を理由に出す（条 P-6.3・P-15.2）。
  (エ) 名札の行が在るとき床は次を数える: 計画のノートが在って発効している（無い・下書きなら まだ分からない）・行の索引の節がちょうど 1 つで導出と一致する・計画だけの行の id が一意で、行の索引に無い（両方に在れば違反＝契約の行を書いたら人の節から外す）・depends の id が行の索引か計画だけの行に在る（宙に浮いた id は違反）・判断の表の ruling が決定 (1) の形を持つ。行の索引の全行が順に出ることは求めない。
  (オ) 現在地（どの行が着地したか）は器が導いて面に結ぶ持ち分で、本判断の外である。
  (3) **裁定 id の文法（決定 (1) と (4) が同じ関数で使う）。** 語頭（頭か、前の字が英数字・「_」・「-」・「.」でない位置）の台帳の id（英小字 1・数字 1・「-」・英数字の並びに「.数字」の段を何段でも）を 1 つの裁定 id とし、直後に器の問いの印（「:」年月日 T 時分 Z「-」連番）が続けばそれを含め、台帳の notes の日付・時刻（分の 1 桁が x の概数を含む）と日本時刻の印（JST）が続けばそれも含める。欄の決まりの ruling_pattern とその注はこの文法の写しに直す（生成区間）。本流と外の利用者の写しで今の判定と答えが割れる欄は 0 である。
  (4) **書き出し（便 C）。** folio graph --print --rulings は、決定 (1) の欄から決定 (3) の関数で切り出した裁定 id を 1 件 1 行の JSON（JSON Lines）で出す。欄は 6 つ（ruling = 切り出した字・bead = 台帳の id の部分・node = 欄を持つ節点の id・file・line・field）である。反映先の型と台帳との突き合わせは器が持つ。
  (5) **順と便。** 便は A → B → C の順（外の利用者の順と同じ）で、契約表は本判断の承認の後に書く。便 B は 3 つの節の型の面の描き方を含み、差分が審査の上限を超えるなら型・床・書く命令の便と面の便に割る。外の利用者が名札の行を置くのは便 B の全部の着地の後である。
  (6) **folio2 自身。** 便 A は folio2 にも掛かる。名札の行を folio2 に置くかは持ち主が決める（置いても索引は見本のノートの行だけ＝決定 (5) の文脈）。
  (7) **前の判断との関係。** 置き換える決定は無い。判断の記録 ADR-3 決定 (1) の節の型の一覧と、ADR-16 決定 (1) の M3 の口の要件に足すだけで、前の判断の記録の本文は変えない（判断の記録 ADR-30 決定 (1)）。便 A の着地と同じ取り込みで、条 P-12 と P-17 の機構の注（条文の外・条 A-2.2）の「数える範囲」を直す。

options:
  - id: a
    name: 決定の欄の形を全置き場に掛け、計画のノートは名札の行で選び、索引は導出の命令が書き、書き出しは索引の口に足す（採る）
    text: 決定 (1)〜(7) の形。
    verdict: adopted
    reason: 形の床は本流で 2 欄・外の利用者で 0 欄しか落とさず、選ぶ行が要らない。索引は契約表からの導出だけで手の 2 面を作らない（条 P-6.4）。書く命令は契約表を直した後に席が既に撃つ folio derive --write で、手順が増えない。書き出しは床と同じ関数を通るので、床の通した字と器の読む字が割れない。
  - id: b
    name: 便 A も名札の行で選ぶ（選択参加・opt-in）
    text: 決定の欄の形の検査を、置き場が行を置いたときだけ掛ける。
    verdict: rejected
    reason: 選ぶ理由が無い（落ちるのは folio2 の 2 欄だけ）。選ぶ行は検査を外す旗として働き、置き場ごとに床の意味が割れる（条 N-3.1）。
  - id: c
    name: 計画のノートに行の一覧を手で書き、契約表と床で突き合わせる
    text: 計画のノートの行の一覧を人が書き、各ノートの契約表との一致を床が数える。
    verdict: rejected
    reason: 同じ中身を 2 つの面で人が書き、検査で揃える形になる（条 P-6.4）。導出にすれば「計画に無い行」と「契約の無い計画の行」がそもそも起きない。
  - id: d
    name: 行の索引を folio schema --write・新しい命令・面の組み立てのどれかで作る
    text: 生成区間を schema の命令が書くか、索引の専用の命令を足すか、正本に持たずに面だけで組む。
    verdict: rejected
    reason: schema の命令は実装の定数の写しで（判断の記録 ADR-9）、契約表を直した後に撃つ習慣が無い。新しい命令は床を 5 本にし、器と利用者の撃ち方を変える。面だけで組むと、YAML を読む席と天井に索引が届かない。
  - id: e
    name: 裁定 id を器の問いの形（<台帳の id>:<時刻>-<連番>）だけに絞る
    text: 決定の欄が器の問いの形の裁定 id を持つことを床が求める。
    verdict: rejected
    reason: 外の利用者の 54 欄のうち 4 欄・本流の 153 欄のうち 0 欄しか満たさず、前の記録は書き換えられない（前の裁定に器の問いの番号は無い）。器の形に揃えるかは器と各置き場の約束である。

basis: [P-1, P-2, P-3, P-4, P-5, P-6, P-12, P-15, P-17, A-2.2, N-2, N-3, N-5, R-8, R-10, R-19, D-8, D-17, D-18, FR5, FR9, FR11, FR14, ADR-3, ADR-9, ADR-11, ADR-16, ADR-30]
produced: [FR26, FR27, AC28, AC29]

consequences:
  - 会話だけの決定は、台帳の裁定になるまで決定の欄に書けない。ただし文書のどこにも書かれない会話の決定は、どの機械の検査にも見えない（天井か持ち主だけが気づける）。
  - 床は形だけを見るので、台帳に無い番号を書いても床は通す（実在は器）。外の利用者の前の形（t3-hub.1 の notes の user <時刻>）からは覚え書きの台帳の id だけが切り出される。
  - 要件の散文の中の裁定（外の利用者の要件書は承認欄が空で、裁定は散文に在る）は決定の欄でないので数えない。
  - 骨格（folio init）の直後の置き場は決定の欄 4 つが 未記入 で、床の まだ分からない が増える（違反にはしない）。
  - 名札の行を置いた置き場では、契約表の行を足す・消すたびに、folio derive --write を撃つまで床が落ちる（導出物と同じ手順）。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に 1 件ごとに記帳する（日付・材料の在り処・当たった条件）。
    (1) 便 A の着地の後、決定の欄の違反のうち、欄の字を直さずに済んだ誤り（決定を持たない欄を数えた・正しい裁定 id を切り出せなかった）が 2 件を超えたら（3 件目で）、欄の一覧か文法を持ち主に問う。
    (2) 便 B の着地の後、名札の行を置いた置き場で、計画か判断が計画のノートの外（版管理の外の file・会話）に在ったと持ち主か器が見つけた件が 2 件を超えたら（3 件目で）、計画のノートの形（節の型と床）を持ち主に問う。外の利用者の件はその台帳を読むだけで数える。
    (3) 器が便 C の口を使わずに設計文書から裁定 id を読む実装を持ったら（読み手が 2 つ）、口の形を器の席と持ち主に問う。

note: |
  【出所】台帳 f2-648.267。外の利用者（tsuzuri）の答え（裁定の逐語・裁定 id の形・契約表の置き場・計画だけの行の二重を床が落とす求め）は handoff-2026-09-28/tsuzuri-57-answers.md の写し。
  【検証の要点】条文を改訂しないので A-2.3 の検証の記録は要らない。起草役の自己反証: (i) 名札の行は検査を外す旗か → 行は掛ける範囲そのもの（行 R-19 と同じく置き場の値）で、足すのも外すのも裁定 id が要る。(ii) 形だけの床は番号らしい字で通る → 実在は器の持ち分で、床は保証しない（帰結の 2 つ目）。(iii) 計画だけの行と索引の二重 → 床が落とす（決定 (2)(エ)）。
  【実測】script は adr31-scripts/（measure-a.py・forms.py）。骨格の直後の置き場で決定の欄 4 つ（憲法の発効の承認と規則の表の 3 行）が 未記入。
