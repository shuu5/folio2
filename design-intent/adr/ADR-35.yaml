# folio2 判断の記録 ADR-35 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-35.html・生成物・手で直さない）。
# 状態: proposed（起草 2026-09-28・orchestrator 席の起草役 rulings-draft〔opus 5.5〕・番号は席が割り当てた）。承認欄は空（持ち主の承認は席が対話面 R-8 で取る・判断の記録 ADR-33・ADR-34 と 1 回に束ねる）。憲法の条文は 1 字も変えない。
# 発効の道: 要件書 FR14 の規範文の意味が変わる（第 1.56 版・行 D-17 の「要件の追加と削除」）ので、持ち主の承認で発効する。持ち主が推奨で答えた判断の記録 ADR-32 決定 (5) を置き換える判断でもある。
# 起点: 台帳 f2-648.275.3・依頼 ~/.local/share/folio2/handoff-2026-09-28/rulings-brief.md・起草の記録 rulings-draft.md（実測の表・script は rulings-scripts/）。

id: ADR-35
title: 索引の節点ごとの 1 行（--summary）に、節点の裁定 id の一覧を足し、設計ノートの行はノートの承認欄を継ぐ（判断の記録 ADR-32 決定 (5) を置き換える）

status: proposed
date: 2026-09-28

plain: |
  設計文書の地図（索引）の「点ごとの 1 行」（folio graph --print --summary）に、その点を決めた持ち主の裁定の番号の一覧を足す判断です。
  外の利用者（tsuzuri）は、自分の地図の上で「この設計はどの裁定で決まったか」の線を引きたいと求めています（tsuzuri の行 c-g3g7）。
  いまは裁定の番号の書き出し（folio check --emit-rulings）が別の口にあり、設計ノートの番号は「どの点のものか」の欄が空です。ファイルの名で結ぶ決まり（判断の記録 ADR-32 決定 (5)）なので、結び方を tsuzuri の側が持つことになります。書き出しが全部そろうのも、検査が合格のときだけです。
  この判断の後は、点ごとの 1 行の最後に「裁定の番号の一覧」が付きます。判断の記録・規則の表の行・憲法の条の改訂は、その点の欄から取ります。設計ノートの行は、そのノートの承認欄の番号を全部受け継ぎます。
  番号の切り出しは、書き出しと同じ仕組み 1 つで行います（2 つ目の読み方を作りません）。番号が無い点は空の一覧です。
  憲法の発効の承認と、要件書などの版ごとの承認は、文書全体の承認なので点には付けません（付けると全部の条や要件が同じ番号を持ちます）。
  1 行のほかの欄と、表の形（--print）と、短い出力（--digest）は 1 字も変わりません。

context: |
  (1) 出所（台帳 f2-648.275.3）。外の利用者（tsuzuri）の席の求め（2026-09-28 20:3x JST・別の席からの知らせ）。外の利用者の導出の地図の行（c-g3g7）は、設計の節点から、それを承認した持ち主の裁定への辺（ruled_by）を張る。求めは次の 5 つである。--summary の各節点に裁定 id の欄を置く（無ければ空）。設計ノートの行（<note>#<row>）はノートの承認を継ぐ。正本の在り処は判断の記録の承認欄（approval.ruling）・規則の表の行の裁定の欄（ruling）・設計ノートの承認欄の各行（meta.approval[].ruling）である。字の切り出しを folio2 がするなら、形を知らせれば tsuzuri が合わせる。新しい欄と型を知らせの文に並べる（判断の記録 ADR-32 のとき、tsuzuri の読み手は閉じた種類の集合で落ちた）。
  (2) 判断の記録 ADR-32 決定 (5) は「裁定 id は節点の欄にしない。便 C の書き出しの行を file で結ぶ。--summary の欄は 7 つのまま」と決め、案 c（節点の欄に持つ）を退けた。退けた理由は 3 つ（切り出す関数を索引も持つと読み手が 2 つになる〔条 P-6.3〕・同じノートの全行が同じ裁定を重ねて持つ・持ち主が承認した --summary の 7 欄の形〔要件書 第 1.52 版〕が変わる）。持ち主はこの問いに推奨で答えた（f2-648.270 notes 2026-09-28 16:13 JST）。ADR-32 の撤退条件 (2)（書き出しの行と索引の行が file の字で結べない件）は当たっていない。書き出しの file と索引の file は同じ字（design-note/<file 名>）である。
  (3) 外の利用者（tsuzuri）の求めが挙げる足りなさは 2 つである。① 書き出しの行の node は、設計ノートの承認欄の行では空の値（null）である。ノートの行へ結ぶ決まり（同じ file の契約表の行の全部が継ぐ）を外の利用者の側に書くと、同じ結び方を 2 つの面が持つ（条 P-6.3 の向きが逆になる）。② 書き出しの一覧が全数なのは床の終了コードが 0 のときだけである（判断の記録 ADR-31 決定 (4)）。床は読めない file を飛ばして数え続けるが、索引は 1 本でも読めなければ組まずに まだ分からない を返す（全部か無しか）。
  (4) 実測（参考値・2026-09-28・本流 44c14ac と tsuzuri の写し 51c4045）。書き出しの行は folio2 で 204（節点を持つ行 119・設計ノートの承認欄の行 0）、tsuzuri で 192（節点を持つ行 55・設計ノートの承認欄の行 65・判断の表の行 67・憲法の発効 1）。見本（origin の枝 impl/d201）で裁定 id の付く節点は、folio2 で 243 のうち 70（判断の記録 30・規則の表の行 37・条 3）、tsuzuri で 404 のうち 206（設計ノートの行 162 のうち 162・規則の表の行 28 のうち 28・判断の記録 16 のうち 15〔残る 1 は承認欄の無い proposed〕・条 38 のうち 1）。1 つの節点の裁定 id は最大 5（tsuzuri の規則の表の 1 行）で、設計ノートの行は 1 つか 2 つである。
  (5) 裁定 id の切り出しの関数（ruling.rs の rulings・判断の記録 ADR-31 決定 (3)）と、決定の欄を拾う歩き手（sites）は 1 つずつで、床と書き出しが使う。索引（graph.rs・責務の層 3）から層 1 の ruling.rs を呼ぶのは層を下る向きで、層の歯（tests/modules.rs）が許す。
  (6) 要件書 FR14 の規範文は --summary の欄を列挙している（id・種類・所属 file・題・行の番号・平易文・技術の要約）。欄を足すのは規範文の意味の変更で、行 D-17 の「要件の追加と削除」に入る（持ち主の承認が要る）。

decision: |
  (0) 本判断は憲法の条文を改訂しない。判断の記録 ADR-32 の本文は変えない（判断の記録 ADR-30 決定 (1)）。ADR-32 決定 (5) を本判断の決定 (1)〜(5) で置き換える。決定 (5) の「裁定 id は節点の欄にしない」と「--summary の欄は 7 つのまま」は効かなくなる。書き出しの行を file で結ぶ道は残る。
  (1) **欄。** folio graph --print --summary の各行の末尾（技術の要約 eng の後）に欄 rulings を置く。値は裁定 id の組の一覧で、組は 3 つの欄 ruling（切り出した字）・形の種類（form・値は question・notes-time・bead）・bead（台帳の id の部分）をこの順に持つ。3 つの欄の字は書き出しの同じ名の欄と同じである。無ければ空の一覧とする（空の値 null にしない）。ほかの 7 欄の字と順は変えない（rulings を外した行は本判断の前と byte で同じ）。
  (2) **切り出し。** 書き出し（folio check --emit-rulings）と同じ歩き手（決定の欄を拾う ruling::sites）と同じ関数（ruling::rulings）で、索引が読んだ正本の木から切り出す（読み手を 2 つにしない・条 P-6.3）。値が字でない欄と、裁定 id を 1 つも切り出せない欄（骨格の印 未記入 を含む）は何も付けない（違反と まだ分からない は床が数える）。字の正規化（例「t3-hub.1（裁定 id = t3-hub.58:20260927T2357Z-1・board）」から 2 つの id を切り出す）は、この関数の文法（判断の記録 ADR-31 決定 (3)）のとおりで、置き場ごとの見出しの字は名指さない。
  (3) **どの節点に付けるか。** (ア) 欄が節点を持つもの（書き出しの node が null でないもの）は、その節点に付ける。条の改訂来歴（articles[].amended_by[].ruling）はその条に、規則の表の行（thresholds[].ruling・discipline[].ruling）はその行に、判断の記録の承認欄（approval.ruling）はその記録に付ける。(イ) 設計ノートの承認欄の各行（meta.approval[].ruling）は、同じ file の設計ノートの行（契約表の行の節点）の全部に付ける（継ぐ）。設計ノートの承認欄の行は役の欄を持たない（欄の決まりの approval は who・date・ruling・verbatim・surface）ので、全部の行を数える（書き出しと同じ）。(ウ) ほかの欄は節点に付けない。憲法の発効の承認・要件書と入口と天井の正本と相談窓口と索引の欄の決まりの承認欄の stamp は文書全体の承認で、判断の表の行の ruling は節点でない行の裁定である。条の改訂来歴はその条の規範文に付けない。憲法の各条の前の版との対応（supersedes_v1）は決定の欄の外のままとする（判断の記録 ADR-31 決定 (1)）。
  (4) **並び。** 歩き手の欄の順（書き出しの行の順）に並べ、1 つの欄の中は切り出した順とする。同じ字が 2 度出ても畳まない（書き出しと同じ・畳むのは読み手）。
  (5) **全数でない印は出さない。** --summary は索引が組めたとき（読む正本が全部読めたとき）だけ行を出し、そのとき決定の欄は全部歩いている＝欄に書かれた裁定 id は全部出る。欠けるのは欄に台帳の id が書かれていないときだけで、その欄は床（folio check）が違反か まだ分からない に数える。索引は床の判定を写さない（条 P-3.3・床の合否は床の口が言う）。
  (6) **変えないもの。** --print の表・--digest・挨拶の命令（folio hello）・床（folio check）・書き出し（--emit-rulings の 7 欄と行）・索引の欄の決まり（graph.yaml の生成区間は --summary の欄を持たない）・節点の種類（12）と辺の型（19）・folio build の出力。
  (7) **便。** 便 201（行 gv）1 本で、実装（graph.rs・ruling.rs の欄の名 1 つの公開・--summary の説明の字）と歯を運ぶ。本判断と要件書 第 1.56 版の発効の後に受け付ける。graph.rs を書く便 195 の着地の後を既定の順とする（見本どうしの衝突は 0）。外の利用者（tsuzuri）は、着地の後に folio schema --write を撃たなくてよい（生成区間が変わらない）。
  (8) **知らせ。** 着地の前に、席は外の利用者（tsuzuri）へ次を返す。新しい欄 rulings の形（組の 3 欄・空の一覧）。継ぐ規則（設計ノートの行はノートの承認欄の全部の行を継ぐ）。付かない欄（憲法の発効・承認欄の stamp・判断の表の行）。節点の種類と辺の型は増えない。切り出しの文法（判断の記録 ADR-31 決定 (3)。例「user 2026-09-27T03:19Z」は台帳の id の形でないので切り出さない）。

options:
  - id: a
    name: 裁定 id の一覧の欄（rulings・組は ruling・form・bead）・設計ノートの行はノートの承認欄を継ぐ・書き出しと同じ歩き手と関数（採る）
    text: 決定 (1)〜(8) の形。
    verdict: adopted
    reason: 1 つの節点に裁定 id が 2 つ以上あることがある（外の利用者 tsuzuri の写しで最大 5）ので、一覧でないと落ちる。組の 3 欄は書き出しと同じ字で、外の利用者は形の種類（form）で台帳の問いの形を選べる。切り出しの読み手は 1 つのままで、結び方を外の利用者が持たなくてよい。
  - id: b
    name: 1 つの字の欄 ruling（最初の 1 つ・無ければ null）
    text: 欄の中の最初の裁定 id か、形が question の最初の 1 つだけを出す（外の利用者 tsuzuri の求めの例の形）。
    verdict: rejected
    reason: 1 つの欄の中のほかの裁定 id を捨てる。どれを残すかの決まりを folio が持つことになり、置き場ごとの約束の形（外の利用者 tsuzuri なら question）を選ぶのは器の持ち分である（判断の記録 ADR-31 決定 (4)）。
  - id: c
    name: 書き出しの行の node を設計ノートの行で埋める
    text: 設計ノートの承認欄の行を、ノートの行の数だけ複製して node に行の id を入れる。
    verdict: rejected
    reason: 書き出しの行は欄 1 つにつき 1 行（file・line・field が欄の在り処）で、複製すると欄と行の 1 対 1 が崩れる。一覧が全数なのは終了コード 0 のときだけ、という足りなさも残る。
  - id: d
    name: 今のまま（判断の記録 ADR-32 決定 (5)・外の利用者 tsuzuri が file で結ぶ）
    text: 書き出しの行を外の利用者が file の字で索引の設計ノートの行へ結ぶ。
    verdict: rejected
    reason: 継ぐ決まりを外の利用者が持ち、同じ結び方を 2 つの面が持つ。全数の条件（終了コード 0）も残る。
  - id: e
    name: 憲法の条と要件にも文書全体の承認を継がせる
    text: 憲法の発効の承認を全部の条と規範文に、要件書の承認欄の stamp を全部の要件と受入基準に付ける。
    verdict: rejected
    reason: 全部の条（folio2 で 27・外の利用者 tsuzuri で 38）と規範文と要件が同じ裁定 id を重ねて持つ。要件書の承認欄は版ごと（folio2 で 55 行）で、どの要件をどの版が決めたかを欄が持たない。外の利用者は求めていない。要るなら書き出しの node が空の値（null）の行から引ける。

basis: [P-3, P-4, P-5, P-6, P-12, FR14, FR26, ADR-13, ADR-30, ADR-31, ADR-32, D-17]

consequences:
  - --summary の行が長くなる（参考値・folio2 の出力は 370,226 byte から 382,518 byte に、外の利用者 tsuzuri の写しは 208,409 byte から 231,152 byte に）。
  - 外の利用者（tsuzuri）の読み手が閉じた欄の集合で JSON を読んでいれば、新しい欄（rulings）で落ちうる。席は着地の前に知らせ（決定 (8)）、外の利用者が合わせてから外の利用者の側の実行 file（binary）を上げる。
  - 同じノートの全行が同じ裁定 id を重ねて持つ（外の利用者 tsuzuri の写しで 162 行に 232 個・参考値）。重なるのは導出物だけで、正本は承認欄の 1 か所のままである。
  - 設計ノートの承認欄はノートの版ごとの承認で、行ごとの承認でない。行を後から足したノートでは、足す前の版の承認もその行に付く（承認欄が行を名指さないので区別できない）。
  - 書き出しと --summary の 2 つの口が同じ裁定 id を出す。歩き手と関数が 1 つなので字は割れない（便 201 の歯が全部の節点で突き合わせる）。
  - 判断の表の行（計画の設計ノートの決定）と承認欄の stamp の裁定 id は --summary に出ない。引くのは書き出しの node が空の値（null）の行である。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席で、台帳 f2-648 の notes に 1 件ごとに記帳する（日付・材料の在り処・当たった条件）。
    (1) 便 201 の着地の後、ある置き場で --summary の裁定 id の一覧（rulings）と、同じ置き場の書き出しから決定 (3) の規則で組んだ一覧が 1 つの節点でも食い違ったら（便 201 の歯と同じ突き合わせ・数え方は起草の記録の tally.py）、実装を直す便を起こし、直るまで外の利用者（tsuzuri）に一覧を使わないよう知らせる。
    (2) 外の利用者が、節点の裁定を引くために書き出しの行を file で結ぶ実装を持ち続けたら（結び方が 2 つ）、形を外の利用者の席と持ち主に問う。
    (3) 設計ノートの行ごとに承認を分けたい求め（行を後から足したノートで前の版の承認を継がせたくない）が外の利用者か持ち主から 1 件でも出たら、継ぐ規則（決定 (3) の (イ)）を捨てるかを問う判断の記録を起こす。

note: |
  【出所】台帳 f2-648.275.3（t3 の道・親 f2-648.275）。tsuzuri の求めの要旨は依頼 rulings-brief.md。前の求め（f2-648.270）の写しは handoff-2026-09-28/tsuzuri-270-shape.md の (c)（「節点ごとの rulings の一覧か、書き出しを節点の id で引けるか、どちらでもよい」）。
  【検証の要点】条文を改訂しないので、改訂の前の敵対的な検証の記録は要らない。起草役の自己反証 3 点。(i) 読み手が 2 つにならないか → 索引は ruling::sites と ruling::rulings をそのまま呼び、渡す木は索引が読んだもの（同じ yaml.rs の読み手と note.rs の load_notes）。便 201 の歯の 1 本が、実の正本と写しで全部の節点の rulings を書き出しの行と突き合わせる。(ii) 索引が床の判定を持たないか → rulings は字を並べるだけで、違反も まだ分からない も出さない。欠けた欄は床が数える（決定 (5)）。(iii) ADR-32 が退けた理由の 3 つ目（持ち主が承認した 7 欄の形）→ 要件書 第 1.56 版の FR14 の字の変更として、持ち主の承認に出す。本判断は ADR-32 の撤退条件 (2) の発動ではない（file で結べない件は 0）。
  【実測】script は rulings-scripts/（tally.py・mut-201.py・lines.py・lines.awk）。見本は origin の枝 impl/d201。
