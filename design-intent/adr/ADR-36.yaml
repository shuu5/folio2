# folio2 判断の記録 ADR-36 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-36.html・生成物・手で直さない）。
# 状態: proposed（起草 2026-09-29・orchestrator 席の起草役 f1-draft〔opus 5.5〕・番号は席が割り当てた）。持ち主の承認の前。憲法の条文・要件書・規則の表の字は 1 字も変えない。判断の記録 ADR-34 の本文も変えない。
# 発効の道: ADR-34（持ち主の承認で発効）の数える範囲を狭めるので、持ち主の承認で発効する（席が問う・承認の記帳は席がする）。
# 起点: tsuzuri の席の求め（2026-09-29・持ち込みの予行で床が違反 9）・依頼 ~/.local/share/folio2/handoff-2026-09-28/f1-brief.md・起草の記録 f1-draft.md（実測の表・script は f1-scripts/）。

id: ADR-36
title: 床の版管理の照合は、今の列の根の anchor を足した commit と共通の祖先を持たない先頭の祖先（別の repo から取り込んだ別の根の列）の履歴を数えない

status: proposed
date: 2026-09-29

plain: |
  床（folio check）は、凍結した写し（anchor）が消されたり書き換えられたりしていないかを、版管理（git）の履歴と照らします。判断の記録 ADR-34 の後は、いま検査している枝の過去（先頭から辿れる履歴）と、過去を 1 つも共有しない枝（根の無い枝）の履歴を照らしています。
  外の利用者（tsuzuri）は、folio2 の repo を commit の番号を保ったまま folio2/ の下へ取り込みます。取り込むと folio2 の昔の commit も tsuzuri の過去になり、folio2 の写しが tsuzuri の写しと同じ場所（design-intent/anchors/）に在ったように見えます。写しで試すと、tsuzuri の床が偽の違反 9 で落ちました（folio2 の写しの 4 枚が「中身が違う」・5 枚が「履歴に在ったが無い」）。後で scribe2 を取り込むときも同じ形が起きえます。
  この判断の後は、過去のうち「今の置き場の最初の写し（constitution-v1.0.yaml）と同じ要約値の写しを足した commit と、共通の祖先を 1 つも持たない commit」、つまり別の repo から取り込んだ別の根の列を照らしません。本流自身の過去・本流へ取り込んだ作業枝・根の無い枝は今までどおり照らします。
  最初の写しの要約値は床の定数（列の根の表）が固定しています。だから、写しを書き換えた根の無い枝を本流へ取り込む細工は、どちらの親にしても、本流の元の列を別の場所へ移しても、今までどおり落ちます。
  今の置き場に最初の写しが無いときは照らす範囲を狭めません（取り込んだ列の写しを今までどおり数え、黙らない側に倒します）。folio2 自身の置き場は根が 1 つなので、床の答えは変わりません。

context: |
  (1) 出所（2026-09-29・tsuzuri の席の求め）。外の利用者（tsuzuri）の予行は、写しで外の利用者の本流（821ed79）に folio2 の本流（0c910db）を別の根として下の階層（folio2/）へ取り込んだ（commit の番号を保つ・git merge -s ours --allow-unrelated-histories と git read-tree --prefix の形）。外の利用者の置き場の床（folio check）が不合格・違反 9、下の階層（folio2/）の中の folio2 の置き場の床は合格だった。違反は版管理の照合（crates/folio/src/gitcheck.rs の履歴の一覧の命令 git log --exclude=refs/stash --all --full-history -- <anchor の置き場>）から出る。取り込みの後は folio2 の昔の commit の anchor の置き場（design-intent/anchors/）が外の利用者の同じ path に見え、「中身が違う」4 件（folio2 の e7fa42d・4929978・dcf76c7・dc16faf の constitution-v1.0〜v1.3）と「履歴に在ったが作業ツリーに無い」5 件（constitution-v1.4・ids-v1.24・v1.55・v1.56・v1.57）になる。外の利用者の席は案 (a)（先頭と同じ根を持つ commit に限る）と案 (b)（1 本目の親の列だけを読む）を挙げ、後の scribe2 の持ち込みでも同じ形が起きうるので一般の形を望んだ。
  (2) 今の字。判断の記録 ADR-34 決定 (1) は、数える commit を (a) 先頭から辿れる commit と (b) 根の無い枝とし、(c) 取り込んでいない枝を数えない。別の根から取り込みの commit（merge）で入った履歴は (a) に入る＝今の字では数える。ADR-34 は持ち主の承認で発効したので、数える範囲を変えるには新しい判断の記録と持ち主の承認が要る。ADR-34 の撤退条件 (3)（外の利用者の置き場で、ADR-34 の範囲では偽の違反が消えない枝の形〔例 別の repo の履歴を取り込んだ枝〕が出たら、形を外の利用者の席と持ち主に問う）に当たる。
  (3) 実測（参考値・2026-09-29・起草の記録 f1-draft.md）。外の利用者の写し（本物の .git を写してから clone し、hook が無いことを確かめた写し・本物では git も folio も撃たない）で取り込むと、本流（0c910db）の組み立てた道具（binary）の床は違反 9、本判断の見本の道具は 0（合格）。下の階層（folio2/）の置き場の床は両方とも 0。最小の手書きの写し（列 T = 床の歯の組 root-digest-drift・別の列 = v1.0 の題と要約値の欄を変えて v1.1 を足した列）では、下の階層への取り込み・先に下の階層へ移してから取り込む形・別の根を 2 つ取り込む形で、偽の違反 2（中身が違う 1・履歴に在った 1）が見本で 0 になる。書き換えの細工 3 形（根の無い枝で v1.0 を書き換えて最初の親にし本流を取り込んで進める・2 本目の親として同じ path のまま取り込む・本流の元の列を下の階層（junk/）へ移して書き換えを元の path に置く）は、本流の binary も見本も「中身が違う」1 で落ちる。ADR-34 の歯 14 本と床の fixture（tests/floor_cases.yaml・根の無い枝の場合 git-orphan-branch-refreeze を含む）は見本で全部緑。
  (4) 候補の穴（同じ写しで撃った）。席の案 A（最初の親の列の根を祖先に持つ commit だけを数える）は、根の無い枝で v1.0 を書き換えて最初の親にし、本流をその commit へ早送りする形で「中身が違う」が 0＝黙って通る（強制の push は要らない）。席の案 C（別の根どうしの取り込みで、片方の親の anchor の置き場の木が結果の木の別の path にそのまま在る列だけを外す）は、本流の元の列を junk/ へ移して書き換えを元の path に置く形で 0＝黙って通り、先に下の階層へ移す commit を置いてから取り込む形では偽の違反 2 が残る。どちらも木や親の順の形だけで見分けるので、正しい持ち込みと細工の形が同じ形になる。外の利用者の案 (a) は字のままだと、取り込みの後の先頭の根の組（2 つ）と取り込む前の本流の commit の根の組（1 つ）が違うので本流自身の過去が数えから落ちるか、根を 1 つでも共有すれば数える読み方では何も変わらない。外の利用者の案 (b) は ADR-34 決定 (2) の --full-history と全ての参照の読みを捨てる（ADR-34 の案 b の変異で根の無い枝の場合の床の fixture が落ちた・便 190 の実測）。
  (5) 見分けの頼り。正しい持ち込みと細工は、履歴の形（親の順・木の置き場）では見分けられない。違うのは列の中身で、列の根の anchor（最初の版の anchor）の要約値（digest の欄）は床の定数の列の根の表（ADR-16 決定 (2)・憲法の名で引く）と索引が固定する。取り込んだ別の repo の列は根の要約値が違い、細工の側は本流の元の根の anchor を持つか、違う根に差し替えて列の根の表で落ちる。
  (6) 判断の記録 ADR-30 決定 (1) により、発効した判断の記録（ADR-34・ADR-2）の本文は変えない。今の規範は判断の記録の欄の決まり（adr/schema.yaml の生成区間の注 anchor_note と limits_note・床の定数の写し）が持つ。

decision: |
  (0) 本判断は憲法の条文を改訂しない。判断の記録 ADR-34 と ADR-2 の本文は変えない（ADR-30 決定 (1)）。要件書・規則の表は変えない。
  (1) **数える範囲。** ADR-34 決定 (1) の (a)（先頭から辿れる commit）のうち、根の commit のどれとも共通の祖先を 1 つも持たない commit（別の根の列）は数えない。根の anchor = 今の作業ツリーの anchor の置き場の最初の版の anchor（床の定数 first_version と file_name の組・constitution-v1.0.yaml）。根の commit = 履歴の一覧（ADR-34 決定 (2) の命令）で根の anchor と同じ名の anchor を足すか変えた commit のうち、本文の digest の欄が今の根の anchor の digest の欄と同じもの（取り込んでいない枝の commit は除く）。(b)（根の無い枝）と (c)（取り込んでいない枝）は ADR-34 のまま。3 つの照合（履歴に在った anchor・同じ形式の anchor の中身・列の始め直しの判定）とも同じ範囲を使う。
  (2) **狭めないとき。** 今の根の anchor が無い・読めない（digest の欄が無い）とき、または根の commit が先頭の祖先に 1 つも無いときは、(1) で狭めず ADR-34 のまま数える（取り込んだ列の anchor も数える＝黙らない側に倒す）。
  (3) **読み方。** 命令を 1 本足す（先頭の祖先と親の一覧 git rev-list --parents HEAD）。根の commit の祖先（自分を含む）と、残りの先頭の祖先のうちその祖先から子へ辿れる commit を「共通の祖先を持つ」とし、どちらにも入らない commit を別の根の列とする（ADR-34 の取り込んでいない枝と同じ組み方）。命令を起動できない・待ち上限を超えたは「版管理（git）が無いか読めない」、失敗は「版管理を読めない（ls-tree / log / rev-list が失敗）」の「まだ分からない」で終える（今と同じ字）。
  (4) **見分けの頼り。** 別の根の列かどうかは根の anchor の digest の欄で見分け、根の digest は列の根の表と索引の照らし（今の床のまま）が固定する。根の anchor を別の digest のものへ差し替えると本流の元の列を数えなくなるが、列の根の表の照らしが落とす（見本で実測・列の根の表に行を持つ床の土台 tests/fixtures/floor_base）。
  (5) **変えないもの。** ADR-34 決定 (2)(3)（全ての参照を読む・--full-history・refs/stash を数えない・先頭の木との照合・除外・未追跡・版管理の根・浅い写し・環境変数の遮断・違反の字）。床の fixture の字。folio build の出力。folio2 自身の置き場の床の答え（根が 1 つ＝狭める commit が無い）。
  (6) **取り込んだ置き場（下の階層・sub-dir）の床は変えない。** 取り込む前の履歴は移す前の path に在るので数えず、取り込みの commit が足した anchor も履歴に数えない（本判断の前から同じ）。その置き場の取り込む前の履歴の照合は元の repo が受け持つ。取り込む側が履歴を下の階層へ書き換えて取り込む形（案 b）を選べば、その置き場の床も取り込む前の履歴を数える（本判断の後も選べる）。
  (7) **今の規範の置き場。** 判断の記録の欄の決まりの注 2 つに本判断の範囲を書く（anchor_note の版管理の項に 1 文・limits_note に 1 項。床の定数の置き場 crates/folio/src/floor_adr.rs を直し、folio schema --write で生成区間を書き直す）。
  (8) **便。** 便 210（行 he）1 本で、実装・注 2 つ・生成区間・凍結 anchor（tests/fixtures/schema/adr-region.txt）・歯を運ぶ。本判断の発効の後に受け付ける。持ち込む commit は便 210 の着地の後の本流の先頭（外の利用者 tsuzuri の決め）。

options:
  - id: a
    name: 今の列の根の anchor を足した commit と共通の祖先を持たない先頭の祖先を数えない（採る）
    text: 決定 (1)〜(8) の形。
    verdict: adopted
    reason: 外の利用者（tsuzuri）の写しの偽の違反 9 と最小の写しの偽の違反（下の階層への取り込み・先に移してから取り込む形・2 つの取り込み）が消え、書き換えの細工 3 形は今までどおり落ちる。親の順や木の置き場に頼らず、列の根の表が固定する根の digest で見分けるので、どの取り込みの形でも同じ式で動く。見分けられないときは狭めない。
  - id: b
    name: 床を変えず、取り込む側が履歴を下の階層へ書き換えて取り込む
    text: folio2 の履歴の写しを下の階層へ書き換えてから（git filter-repo の --to-subdirectory-filter など）取り込む。取り込まれた置き場の床も取り込む前の履歴を数える。
    verdict: rejected
    reason: 床の一般の決まりにはしない。commit の番号が変わる（外の利用者の予行の決め〔番号を保つ〕に反し、folio2 の台帳の notes と設計ノートが名指す commit を外の利用者の repo の中で引けない・凍結した folio2 の repo では引ける）。取り込むたびに持ち込む側が覚えておく要があり、忘れると偽の違反で落ちる。写しでは本流の道具のまま外の利用者の置き場も下の階層の置き場も違反 0 で、取り込み後の下の階層の anchor の削除も違反 1 で落ちた＝取り込む側の選択肢として決定 (6) に残す。
  - id: c
    name: 先頭の最初の親の列の根を祖先に持つ commit だけを数える
    text: 最初の親の列の根（git rev-list --first-parent --max-parents=0 HEAD）の子孫と根だけを数える（席の案 A）。
    verdict: rejected
    reason: 根の無い枝で anchor を書き換えて最初の親にし、本流を取り込んで本流をその commit へ早送りすると（強制の push は要らない）、本流の元の列が数えから落ちて書き換えが黙って通る（見本の歯 f210_rootless_rewrite_made_first_parent_still_fails と f210_relocated_original_line_still_fails が落ちる・変異 M9）。
  - id: d
    name: 取り込みの commit で下の階層へ移された別の根の列だけを数えない
    text: 別の根どうしの取り込みで、片方の親の anchor の置き場の木が結果の木の別の path にそのまま在るとき、その親の側の列を数えない（席の案 C）。
    verdict: rejected
    reason: 本流の元の列を下の階層へ移し、書き換えた anchor を元の path に置く形が黙って通る（歯 f210_relocated_original_line_still_fails が落ちる）。取り込む側で先に下の階層へ移す commit を置いてから取り込む形は、偽の違反が残る（歯 f210_premoved_import_is_not_counted が落ちる）。取り込みの commit ごとに木を照らす命令も要る。
  - id: e
    name: 先頭と同じ根を持つ commit だけを数える
    text: 根（git rev-list --max-parents=0）を組み、先頭と同じ根の commit だけを数える（外の利用者 tsuzuri の案 (a) の字のまま）。
    verdict: rejected
    reason: 根の組が同じ commit だけと読むと、取り込みの後の先頭（根 2 つ）と取り込む前の本流の commit（根 1 つ）が違うので、本流自身の過去が数えから落ちる。根を 1 つでも共有する commit と読むと、先頭から辿れる commit は全部が先頭と根を共有するので何も変わらない。採る案 (a) は、この案の「先頭」を「今の列の根の anchor を足した commit」に替えたもの。
  - id: f
    name: 先頭の 1 本目の親の列だけを読む
    text: 履歴の一覧を 1 本目の親の列（git log --first-parent HEAD）にする（外の利用者 tsuzuri の案 (b)）。
    verdict: rejected
    reason: ADR-34 決定 (2) の全ての参照の読みと --full-history を捨てる。根の無い枝へ切って anchor の置き場を外す手口（床の fixture の git-orphan-branch-refreeze）の防ぎが消え（ADR-34 の案 b の変異で実測）、取り込んだ作業枝の中の commit の anchor の履歴も数えなくなる。

basis: [P-3, P-4, P-8, P-10, FR5, ADR-2, ADR-16, ADR-30, ADR-34]

consequences:
  - 外の利用者（tsuzuri）が folio2 を commit の番号を保ったまま取り込んでも、外の利用者の置き場の床は folio2 の昔の anchor を数えない（写しで違反 9 → 0）。後の scribe2 の持ち込みも、scribe2 の列の根が違えば同じ。
  - 本流の上で anchor を消した・書き換えた、取り込みの後に本流の anchor を消した、根の無い枝の細工（どちらの親にしても、本流の元の列を別の path へ移しても）は、今までどおり落ちる。
  - 今の置き場に根の anchor が無い（凍結の前の）置き場が、anchor を持つ repo を取り込むと、狭めないので偽の違反が残る（決定 (2)・写しの最小の形で履歴に在った 3）。その置き場は先に凍結してから取り込むか、案 b の形で取り込む。本流の根の anchor の削除を commit した場合も狭めないので、取り込んだ列の anchor の偽の違反が本物の違反と並んで出る。
  - 取り込んだ置き場（下の階層・sub-dir）の床は取り込む前の履歴を照らさない（本判断の前から同じ）。写しで下の階層（folio2/）の置き場の anchor の削除を commit すると、床は「まだ分からない」（終了コード 2・索引の照らし）で、版管理の違反は出ない。案 b の形では違反 1 で落ちる。
  - 床の版管理の命令が 1 本（git rev-list --parents HEAD）増える（外の利用者の写しの先頭の祖先 1,305 commit で 0.01 秒・参考値）。
  - 外の利用者は、便 210 の着地の後に folio schema --write（判断の記録の欄の決まりの注 2 つ）を 1 回撃つまで folio schema --check が落ちる。床（folio check）は注を数えないので落ちない。

retreat:
  kind: measure
  condition: |
    数えるのは orchestrator 席（合流の後は tsuzuri の席）で、台帳の notes に 1 件ごとに記帳する（日付・材料の在り処・当たった条件）。
    (1) 便 210 の着地の後、根の commit と共通の祖先を持つ履歴（本流の元の列）の anchor の削除か書き換えが本流の先頭の祖先に入ったのに、取り込みの後の本流の床（folio check）が版管理の違反も列の根の違反も出さなかった件が 1 件でも出たら（数え方 = 本流で folio check を撃ち、終了コードと違反の字を記帳する）、本判断を捨てて ADR-34 の範囲へ戻す判断の記録を起こす。
    (2) 外の利用者の置き場で、別の repo から取り込んだ履歴のせいで本流の床が偽の違反を出した件（決定 (2) の狭めないときを除く）が 1 件でも出たら、決定 (1)(3) の見分け方を測り直す。
    (3) 決定 (2) の狭めないときの偽の違反（根の anchor が無い置き場の取り込み）が外の利用者の置き場で 1 件でも出たら、形を外の利用者の席と持ち主に問う。
    (4) 取り込んだ置き場（下の階層・sub-dir）の床が取り込む前の履歴を照らさないために、その置き場の anchor の削除か書き換えを床が見落とした件が 1 件でも出たら、取り込む前の履歴を移した後の path で数える形か、案 b を持ち込みの既定にする形を、外の利用者の席と持ち主に問う。

