# folio2 判断の記録 ADR-9 — 正本（1 判断 = YAML 1 file）。欄の決まりは adr/schema.yaml。人が読む面は判断の記録の面（adr-9.html・生成物・手で直さない）。
# 状態: proposed（持ち主の承認待ち・裁定 2「ひとまず全部推奨でよい。」2026-09-19 で方向は承認済み・発効の逐語は approval 欄に）。条文の改訂ではない（amends は空）。
# 位置: 天井の 1 周目（2026-09-19・f2-648 notes）で「文書どうしの整合」の止める所見 F-1（反証 支持）の解消。判断の記録 ADR-1 の帰結 4 つ目の道筋の完了。

id: ADR-9
title: 欄の決まりの file（判断の記録・設計ノート）は床の定数から folio が導出する生成物とし、人は書かない
status: proposed
date: 2026-09-19
context: 判断の記録 ADR-1 は、欄の決まりの閾値・値域・置き場を床（当時は検査の script）の定数とし、欄の決まりの file（adr/schema.yaml）を「その写し」として置き、型も値も 1 字でも食い違えば床が落とすと決めた。設計ノートの欄の決まり（design-note/schema.yaml）も同じ形を M1 へ広げた。天井の 1 周目（2026-09-19・folio2 自身の設計文書）で「文書どうしの整合」の審査役がこれを憲法 P-6.4（2 つの面を人が書き、一致を検査で強制する設計を採らない）と両立しない止める所見として挙げ、独立の文脈の反証役が支持した。根拠 = 2 つの面（実装の定数と欄の決まりの file）をどちらも人が書き、生成の命令も生成物の宣言も無く（同じ ADR-2 は凍結 anchor を生成物と明記する非対称）、一致を 1 字の食い違いで落とす形は P-6.4 の 3 要素にそのまま当たり、P-6 の出所である前の版の失敗（両面手書き + 門 → 正本からの導出へ全面転換）と同型である。ADR-1 の帰結 4 つ目は「folio が同じ検査を出せた時点で欄の決まりの file を正本から外す」と既に道筋を書いており、床の script（Python）は便 22 で退役したが、欄の決まりの file は正本に残ったままだった（実態との整合の所見 F-7 も同じ指摘）。持ち主は 2026-09-19 に裁定 2 として案 a（導出物にする）を推奨どおり承認した。
decision: 欄の決まりの file 2 本（adr/schema.yaml・design-note/schema.yaml）は、床の定数（実装の中の型付きの定数・adr.rs と note.rs の FLOOR と人が読む説明の注）から folio が決定的に導出する生成物とする（P-6.3）。人は生成物を直さない（P-6.2）。導出の口は folio schema --write（書く）／--check（配信先と導出の byte 一致を数え、無い 2・不一致 1・一致 0・folio inject と同じ型）で、folio check は欄の決まりの file の「写しの一致」（現行の欄単位の突き合わせ）を「導出との byte 一致」に置き換える（P-14.2 と同じ形）。値も注も正本は実装の定数 1 か所で、data 側に旗も値を緩める欄も無い（N-3.1 は保つ）。生成物の先頭の注は「生成物・手で直さない・正本は実装の定数」と書き換える。判断の記録と設計ノートの欄の決まりそのもの（欄・値域・閾値）は変えない。
options:
  - id: a
    name: 欄の決まりの file を床の定数からの導出物にする
    text: 実装の定数を正本とし、folio が欄の決まりの file 2 本を生成する。folio check は byte 一致を数える。人が読む写しは残る。
    verdict: adopted
    reason: P-6.3（一方を正本とし他方は導出する）・P-6.4（両面手書きを採らない）・P-6.2（生成物を手で直さない）と揃い、ADR-1 の帰結 4 つ目の道筋を「写しを残したまま」完了できる。憲法の生成区間（folio inject・P-14）と同じ型なので新しい機構を増やさない。N-3.1（data 側で緩められない）はそのまま保てる。
  - id: b
    name: 欄の決まりの file を正本から外す
    text: 欄の決まりの file 2 本を退役し、欄の決まりは実装の定数だけが持つ。人は判断の記録の面と用語集で読む。
    verdict: rejected
    reason: 変更は最小だが、人が読める欄の一覧が無くなり、P-5.1（型の一覧は型付きデータに置く）を実装の定数だけで満たす説明が要る。案 a の撤退先として残す。
  - id: c
    name: 両立の根拠を判断の記録に書き足す
    text: ADR-1 に「実装の定数は人が書く面ではない」等の根拠を足し、所見を退ける。
    verdict: rejected
    reason: 反証役が「床は初日（day-1）の道具そのもので P-5 と P-14 の機構が名指す・ADR-1 自身が同じ配置に N-3.1 を当てている＝当事者の読みでも道具（tool）を縛る条の射程の内側」と潰しており、根拠が立たない。P-6 の出所の失敗と同型のまま残る。
basis: [P-2, P-5, P-6, P-10, P-14, N-3, ADR-1, ADR-2, ADR-8, FR6]
retreat:
  kind: measure
  condition: 数えるのは planner 席で、台帳に記帳する。発効後、生成物の欄の決まりの file を人が直して folio check が落ちた回数、または導出の口の不一致で便の受付が止まった回数が、同じ種類の失敗として rules 行 R-7 の上限を超えたら、本判断を捨てて案 b（欄の決まりの file を正本から外す）へ移る判断の記録を起こす。
amends: []
plain: 「判断の記録の書き方」と「設計ノートの書き方」を決めたファイルが 2 枚あり、今は機械の中の決まりと人が書いたファイルの両方に同じ中身があって、機械が「1 文字でも違えば止める」形でした。憲法は「同じ中身を 2 か所に人が書いて見張る形は採らない」と言っています。そこで、人が書くのをやめて、機械の決まりから folio が自動でそのファイルを作る形にします。読める写しは残りますが、直すときは機械の決まりの側を直します。
consequences:
  - 便で運ぶもの＝命令 folio schema（--write / --check）・床の判断の記録の検査（adr.rs）と設計ノートの検査（note.rs）の欄の決まりの検査を byte 一致に置き換え・生成物 2 本の書き換え（先頭の注を「生成物」に）・凍結 anchor（P-10.1・導出物の期待）。要件書の次の版に導出物の要件と受入基準を足し、本判断の発効と同じ承認で発効する（P-13.3）。
  - 判断の記録 ADR-1 は判断を変えず、帰結 4 つ目（欄の決まりの file を正本から外す）の完了の形を本判断が引き取る（道具の移管の完了）。
  - 天井の 1 周目の止める所見（文書どうしの整合 F-1）は本判断の発効と便の着地で解消し、天井の門（裁定 1・案 A）はその後の便から掛ける。
  - 欄の決まりの file の *_note（人が読む説明）は実装の定数の側に持つ（値と同じ 1 か所）。説明を直す変更は実装の変更になる。
note: 元になった持ち主の逐語は台帳 f2-648 notes 2026-09-19「ひとまず全部推奨でよい。」（裁定 2 = 案 a）。天井の所見と反証の逐語は ~/.local/share/folio2/ceiling/2026-09-19-round1/bundle/coherence/（findings.yaml F-1・refute.yaml）。発効の前に反対側からの検証（grill）を独立の文脈で行い、記録を grill 欄に写す。
