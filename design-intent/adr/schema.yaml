# folio2 判断の記録（ADR）— 正本 schema（v1・2026-09-12・f2-648.2）
# 1 判断 = YAML 1 file（adr/ADR-n.yaml・file 名 = id・P-6.1）。この file は「判断の記録の書き方」の型付きデータ（P-5.1）。
# 読み方は schema 節が持つ（コメントは規則ではない）。置き場と形の判断 = ADR-1、凍結 anchor の判断 = ADR-2。
# 憲法の各条 amended_by の欄集合もここに持つ（憲法の schema 節は A-2 の差分の母集合なので触らない）。

meta: {id: folio2-adr-schema, version: 1, date: 2026-09-12, decided_by: [ADR-1, ADR-2], owner: 持ち主（shuu5）, author: planner 席（AI・fable 5.1）}

schema:
  version: 1
  id_pattern: '^ADR-[1-9][0-9]*$'                 # folio2 の他の id（P-1・R-7・FR1）と同じくゼロ詰めしない。4 桁（ADR-0047）は前の版（v1）か scribe2 の記録＝外部の参照
  file_name: '<id>.yaml'                           # file 名 = id
  top_level: [id, title, status, date, context, decision, options, basis, retreat, amends, grill, approval, plain, consequences, supersedes, superseded_by, note]
  required: [id, title, status, date, context, decision, options, basis, retreat, plain]
  optional: [amends, grill, approval, consequences, supersedes, superseded_by, note]
  non_empty: [title, context, decision, plain]     # 空文字を拒む欄
  enums:
    status: [proposed, accepted, retired]
    verdict: [adopted, rejected]
    retreat_kind: [spike, measure, ruling]         # 憲法 schema.enums.retreat_kind の写し（食い違えば検査が落とす）
    approver: [持ち主, planner 席]
  status_meaning:
    proposed: 提案中・拘束力なし（承認欄は空でよい）
    accepted: 発効（承認欄が必須。条文を改訂する判断なら承認者は持ち主・N-4）
    retired: 廃止（番号は空けたまま・superseded_by に後継の id・P-7.2）
  option: {required: [id, name, text, verdict, reason], optional: []}
  options_rule: {min: 2, adopted: 1}               # 退けた案を 1 つ以上含み、採用は 1 つ
  retreat: {required: [kind, condition], optional: [], condition_non_empty: true}   # P-8.1（空なら落ちる）
  basis: {non_empty: true, note: 条・要件・rules 行の id。未解決は R-4 の検査（母集団に判断の記録を足す・id 空間は 3 つのまま）が落とす}
  amends_entry: {required: [target, previous_text, new_text], optional: [], targets_extra: [schema, precedence]}   # target = 条 id か schema / precedence
  grill: {required: [when, who, where, summary], optional: []}                     # A-2.3 の記録
  approval: {required: [who, date, ruling, verbatim, surface], optional: []}       # P-12.2（逐語・日付・裁定 id・対話面）
  approval_rule:
    accepted_requires_approval: true               # accepted なのに approval が無い → N-4
    amends_requires_owner: true                    # amends を持つ accepted な判断の approval.who は 持ち主 → N-4
    amends_requires_grill: true                    # amends を持つ判断は grill 必須 → A-2.3
    surface_prefix: 持ち主と planner 席の対話面     # approval.surface はこの語で始まる。rules 行 R-8 の value も同じ語で始まる（食い違えば落ちる）
    surface_rules_row: R-8
  amended_by_entry: {required: [adr, date, approved_by, ruling, previous_text, rationale], optional: []}   # 憲法 各条 amended_by[] の欄（A-2 の機構 note）
  bidirectional: accepted な判断の amends[].target（条）⇔ その条の amended_by[].adr。片方だけなら落とす。previous_text は両側で同じ文字列
  supersede_rule: superseded_by を持つ判断は status retired、後継の supersedes に自分の id（双方向）
  anchor:                                          # ADR-2 — A-2 / N-4 の差分検査の比較元
    dir: anchors
    file_name: 'constitution-<version>.yaml'            # version は憲法 meta.version の値そのまま（v1.0 → constitution-v1.0.yaml）
    projection_sections: [schema, precedence, articles]              # 憲法 schema.amendment_scope と同じ
    projection_article_fields: [id, title, tier, binds, statements]  # 条文 = 5 欄
    rules:
      - 現行の射影は最新 anchor と一致する（不一致 = 判断の記録と承認を伴わない改憲 → N-4）
      - 最新 anchor の版は憲法 meta.version と同じ（違えば「版を上げたのに凍結していない」→ A-2）
      - 直前 anchor との差分は、変わった各条の amended_by（accepted な判断・裁定 id・逐語）で説明される。previous_text は直前 anchor の条文に見つかる（無ければ N-4 / A-2）
      - anchor に在って現行に無い条は落とす（番号は消さない・廃止は状態で・P-7）
      - anchor が 0 本なら差分検査は「まだ分からない」（P-10.3・終了コード 2）
      - 同じ版の anchor は上書きしない（凍結）。生成は check_draft.py --freeze-anchor（検査と同じ射影関数・P-15.2）
  limits:
    - 前文（precedence）と schema 節の差分は amended_by を持てない（憲法 schema の precedence.optional が空）ので、それを amends に持つ accepted な判断の記録の実在だけを確かめる。前文に amended_by を足すのは A-2 の改訂で行う。
    - 「番号を再利用していないか」（P-7.1）は履歴が要るので床では見ない。id の重複と形だけを見る。

plain: 「なぜそう決めたか」を残す記録（判断の記録）の書き方の決まりです。1 つの決定につき 1 枚のファイルで、番号は 1 から順に付けます。書く欄は決まっていて（何が問題か・何を決めたか・他の案となぜ選ばなかったか・うまくいかなかったらいつやめるか・あなたの OK の言葉）、欄が空だと機械が止めます。憲法の文を直す決定には、あなたの OK の言葉と反対側からの確認の記録が必ず要ります。
