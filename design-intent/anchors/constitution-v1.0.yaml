# folio2 憲法 v1.0 の凍結 anchor（P-10.1・ADR-2）。発効版の条文の射影（schema 節・前文・各条の id・title・tier・binds・statements）+ digest + 承認欄。手で直さない・消さない・同じ版は上書きしない（check_draft.py --freeze-anchor が全検査 0 違反のときだけ作る）。
kind: constitution-anchor
version: v1.0
previous: null
projection_article_fields:
- id
- title
- tier
- binds
- statements
digest: 2e5383705e5ac81ff3c6cadbc057b2a9e68204dadf9191c036d557d579b711da
approval:
  who: 持ち主（shuu5）
  date: 2026-09-12
  ruling: f2-648.1 notes 2026-09-12 20:2x（発効承認）
  verbatim: 承認する
  adr: null
schema:
  version: 1
  top_level:
  - schema
  - meta
  - north_star
  - precedence
  - articles
  - rules_pointer
  - amendment
  - glossary_pointer
  - sources
  meta:
    required:
    - id
    - version
    - status
    - binding
    - baseline
    - generated
    - owner
    - author
    - counts
    - approval
    optional:
    - changes_from_v0_1
    - changes_from_v0_2
  precedence:
    required:
    - text
    - plain
    - binds
    - mechanism
    - rationale
    optional: []
  article:
    required:
    - id
    - title
    - tier
    - binds
    - statements
    - plain
    - rationale
    - mechanism
    optional:
    - relations
    - retreat
    - amended_by
    - supersedes_v1
    - note
  mechanism:
    required:
    - kind
    - live
    optional:
    - note
    - stage
    - polarity
    stage_polarity_required_for:
    - reject
    - build-check
  amendment_scope:
  - schema
  - precedence
  - articles
  statement:
    required:
    - id
    - pattern
    - strength
    - text
    one_sentence: true
    one_polarity: true
    numbers: forbidden
    language: ja-first
  plain:
    required: true
  enums:
    tier:
    - always
    - ask-first
    - never
    binds:
    - tool
    - practice
    - both
    pattern:
    - ubiquitous
    - event
    - state
    - unwanted
    - optional
    strength:
    - must
    - must-not
    - should
    rationale_kind:
    - v1-incident
    - scribe2-article
    - folio2-ruling
    mechanism_kind:
    - reject
    - build-check
    - human-review
    - none
    mechanism_live:
    - now
    - M0
    - delivery-0
    - M1
    - adr
    retreat_kind:
    - spike
    - measure
    - ruling
    stage:
    - in-loop
    - post
    polarity:
    - fail-open
    - fail-closed
  mechanism_live_meaning:
    now: 発効（design-intent/ と CLAUDE.md の配置）の時点で、不合格を出せる検査が実在する
    M0: 要件書 M0 の受入で実在する
    delivery-0: 便 0（CI と編集時 guard）で実在する
    M1: M1 で実在する
    adr: 判断の記録（ADR）の正本 schema が置かれたときに実在する
  mechanism_kind_meaning:
    reject: 実行時に機械が操作そのものを拒む（操作は起きない）。操作の口を持たないこと（削除の経路が無い等）も含む
    build-check: 生成・検査の時点で機械が判定し、不合格なら成果物を出さない
    human-review: 人が目で確かめる（機械可読な根拠があればそれを見る）
    none: 機構なし（note に理由が必須）
  mechanism_live_rule: kind が reject / build-check でも live が now でない条は、その検査結果を「まだ分からない」として出す（P-4.2）。
  tier_mechanism_allowed:
    always:
    - reject
    - build-check
    - human-review
    - none
    ask-first:
    - human-review
    - reject
    - build-check
    never:
    - reject
    - build-check
  tier_precedence:
  - never
  - ask-first
  - always
  preamble: precedence
precedence:
  text: 条どうしが衝突したら「網羅より揃い ／ 速さより黙らないこと ／ 賢さより戻せること」の順で解き、段どうしが衝突したら「絶対にやらない ＞ 確認してから ＞ いつも守る」の順で解く。
  plain: 迷ったら「全部そろえる」より「そろっている」、「早い」より「黙って飛ばさない」、「賢い」より「元に戻せる」を選びます。段が食い違ったら、強い段（絶対にやらない）が勝ちます。
  binds: both
  mechanism:
    kind: none
    live: now
    note: 判断の規則であって機械では検査できない。生成区間（P-14）の先頭に写す。
  rationale:
  - kind: folio2-ruling
    ref: 見本 v4 §0「迷ったらどちらへ倒すか」（walk 承認済み・2026-09-12）
  - kind: scribe2-article
    ref: 順位は条 id を持たず全条に先立つ（scribe2 憲法 §1）
articles:
- id: P-1
  title: 判断する道具を作らない
  tier: always
  binds: tool
  statements:
  - id: P-1.1
    pattern: ubiquitous
    strength: must
    text: folio は文書を生成し、機械で検査し、結果を知らせるところまでを担う。
  - id: P-1.2
    pattern: ubiquitous
    strength: must-not
    text: folio は要否・採否の最終判断を代行する機能を持たない。
- id: P-2
  title: 提示層は単一の生成器が所有する
  tier: always
  binds: tool
  statements:
  - id: P-2.1
    pattern: ubiquitous
    strength: must
    text: 人が読むページはすべて 1 つの生成器から出力する。
  - id: P-2.2
    pattern: ubiquitous
    strength: must-not
    text: 手書きのページを配信先と入口の導線に置かない。
  - id: P-2.3
    pattern: ubiquitous
    strength: must
    text: 色・字の大きさ・余白の元の値（design token）は 1 か所で定義する。
  - id: P-2.4
    pattern: ubiquitous
    strength: must
    text: 部品・図の型・密度 profile は閉じた一覧（部品目録）で持ち、追加には判断の記録を要する。
- id: P-3
  title: 検査は二層 — 機械の床と AI の天井
  tier: always
  binds: tool
  statements:
  - id: P-3.1
    pattern: ubiquitous
    strength: must
    text: 機械で決定的に検査できる項目は床に置く。
  - id: P-3.2
    pattern: ubiquitous
    strength: must
    text: 意味の検査（読みやすさ・忠実さ）は AI の天井に置く。
  - id: P-3.3
    pattern: ubiquitous
    strength: must-not
    text: 床の合格を、完成や天井の合格として扱わない。
- id: P-4
  title: 黙って飛ばさない（fail-closed）
  tier: always
  binds: tool
  statements:
  - id: P-4.1
    pattern: ubiquitous
    strength: must-not
    text: 検査・生成が実行できなかった結果を「異常なし」として扱わない。
  - id: P-4.2
    pattern: ubiquitous
    strength: must
    text: 判定できないものは「まだ分からない」として表に出す。
- id: P-5
  title: 規則は型付きデータに置き、番号で呼ぶ
  tier: always
  binds: both
  statements:
  - id: P-5.1
    pattern: ubiquitous
    strength: must
    text: 規則・閾値・型の一覧は型付きデータ（正本 YAML・rules 行・部品目録）に置く。
  - id: P-5.2
    pattern: ubiquitous
    strength: must
    text: 文書と台帳（bd）からは、規則を id で参照する。
  - id: P-5.3
    pattern: ubiquitous
    strength: must
    text: 文書の種類による違いは、汎用の検査と密度 profile のデータで表す。
  - id: P-5.4
    pattern: ubiquitous
    strength: must-not
    text: 台帳（bd）はタスクと裁定の記帳先であり、規則を置かない。
  - id: P-5.5
    pattern: ubiquitous
    strength: must
    text: 原則と裁定の正本は設計文書、機械が執行する規則の正本は型付きデータとし、置き場をこの 2 面に限る。
- id: P-6
  title: 正本は 1 つ、ほかはそこから導出する
  tier: always
  binds: tool
  statements:
  - id: P-6.1
    pattern: ubiquitous
    strength: must
    text: folio が生成する各文書の正本は YAML 1 file であり、人が読むページはそこから逐語で生成する。
  - id: P-6.2
    pattern: ubiquitous
    strength: must-not
    text: 生成物を手で直さない。
  - id: P-6.3
    pattern: ubiquitous
    strength: must
    text: 同じ内容を 2 つの面が持つとき、一方を正本とし、他方は導出する。
  - id: P-6.4
    pattern: ubiquitous
    strength: must-not
    text: 2 つの面を人が書き、一致を検査で強制する設計を採らない。
- id: P-7
  title: 番号は増やすだけ（append only）
  tier: always
  binds: both
  statements:
  - id: P-7.1
    pattern: ubiquitous
    strength: must-not
    text: 要件・条文・判断・受入基準の id を再利用・改番しない。
  - id: P-7.2
    pattern: ubiquitous
    strength: must
    text: 廃止は状態（status）で表し、番号は空けたままにする。
- id: P-8
  title: 撤退条件を決定と同時に書く
  tier: always
  binds: practice
  statements:
  - id: P-8.1
    pattern: ubiquitous
    strength: must
    text: 取り消しにくい判断（ADR）には、それを捨てる条件を同時に書く。
- id: P-10
  title: 検査の物差しを、検査されるものから独立に持つ
  tier: always
  binds: tool
  statements:
  - id: P-10.1
    pattern: ubiquitous
    strength: must
    text: 検査は、生成側からも検査側からも独立した凍結 anchor（固定の fixture）を 1 本以上持つ。
  - id: P-10.2
    pattern: ubiquitous
    strength: must-not
    text: 生成物どうしの突き合わせを唯一の合格判定にしない。
  - id: P-10.3
    pattern: unwanted
    strength: must
    text: anchor が維持できなくなった検査の結果は「まだ分からない」に落とす。
- id: P-11
  title: 同じ穴が繰り返したら、止めて人へ渡す
  tier: always
  binds: both
  statements:
  - id: P-11.1
    pattern: event
    strength: must
    text: 同じ種類の失敗が rules 行 R-7 の回数を超えたとき、自動の修正を続けず、止めて持ち主へ渡す。
- id: P-12
  title: 承認は 1 つの面から、言葉どおりに残す
  tier: always
  binds: practice
  statements:
  - id: P-12.1
    pattern: ubiquitous
    strength: must
    text: 持ち主の承認は、rules 行 R-8 が指す 1 つの対話面を通ったものだけを受け取る。
  - id: P-12.2
    pattern: ubiquitous
    strength: must
    text: 受け取った承認は、逐語と日付を添えて台帳の notes と文書の承認欄に記帳する。
  - id: P-12.3
    pattern: ubiquitous
    strength: must-not
    text: 会話の記憶を承認の根拠にしない。
- id: P-13
  title: 拘束するのは設計文書、前の版は道具、自分を作るのは最後
  tier: always
  binds: practice
  statements:
  - id: P-13.1
    pattern: ubiquitous
    strength: must
    text: folio2 の開発を拘束するのは設計文書（design-intent）である。
  - id: P-13.2
    pattern: ubiquitous
    strength: must-not
    text: 前の版（folio v1）を、受入の物差し役にも停止権の持ち主にもしない。
  - id: P-13.3
    pattern: ubiquitous
    strength: must
    text: 設計文書の変更は、判断の記録か版付きの文書として残す。
  - id: P-13.4
    pattern: state
    strength: must
    text: 自分のコードの変更を自分の便で運ぶ運用（self-host）は、外部の利用者で受入が通った後に始める。
- id: P-14
  title: 憲法を AI の手元へ写す（注入）
  tier: always
  binds: tool
  statements:
  - id: P-14.1
    pattern: event
    strength: must
    text: folio inject --write を実行したとき、憲法の前文と規範文を持つ条を CLAUDE.md の生成区間へ決定的に導出して書く。
  - id: P-14.2
    pattern: event
    strength: must
    text: folio inject --check は生成区間と正本の差分を検出し、差があれば失敗（非 0）で終える。
  - id: P-14.3
    pattern: ubiquitous
    strength: must
    text: 生成区間の総バイト数は rules 行 R-2 以下に収める。
- id: P-15
  title: 自動の仕掛けに寄りかからない
  tier: always
  binds: tool
  statements:
  - id: P-15.1
    pattern: ubiquitous
    strength: must-not
    text: 自動で走る仕掛け（hook）を「守られる保証」として設計しない。
  - id: P-15.2
    pattern: ubiquitous
    strength: must
    text: 編集の時点で止める仕掛けを持つときは、その判定の式を事後の検査が同じ関数で確かめる。
- id: P-16
  title: 設計判断を下す席は、その時点で最上位のモデルで動かす
  tier: always
  binds: practice
  statements:
  - id: P-16.1
    pattern: ubiquitous
    strength: must
    text: folio の設計判断を下す席は、その時点で最上位の AI モデルで動かす。
  - id: P-16.2
    pattern: ubiquitous
    strength: must-not
    text: 道具（並列実行・便・作業者）の内側には最上位のモデルを求めない。
- id: P-17
  title: 数値の表を変えるときは、裁定 id を行に付ける
  tier: always
  binds: both
  statements:
  - id: P-17.1
    pattern: ubiquitous
    strength: must
    text: rules 表（R-n・D-n）の行の追加・変更は、裁定 id と時刻を行に付ける。
  - id: P-17.2
    pattern: unwanted
    strength: must
    text: 裁定 id の無い rules 行の変更があったら、検査がそれを落とす。
  - id: P-17.3
    pattern: ubiquitous
    strength: must
    text: 初版の行は、この憲法の発効の承認を裁定とみなし、発効時にその id と時刻を全行に付ける。
  - id: P-17.4
    pattern: event
    strength: must
    text: folio の振る舞いを縛る閾値行（deny 種別）の値を緩めるとき、A-2.3 の検証を前置する。
- id: P-18
  title: 逸脱は編集の時点で止める（極性一覧）
  tier: always
  binds: tool
  statements:
  - id: P-18.1
    pattern: event
    strength: must
    text: 編集が設計文書か rules と食い違うとき、その編集を編集の時点で止める。
  - id: P-18.2
    pattern: ubiquitous
    strength: must-not
    text: 事後の検査を、編集の時点で止めることの代わりにしない。
  - id: P-18.3
    pattern: ubiquitous
    strength: must
    text: 止める仕掛け（guard）は「開く／閉じる」の極性と「編集時／事後」の別を型で持ち、その一覧（極性一覧）を生成時に出す。
  - id: P-18.4
    pattern: unwanted
    strength: must
    text: 編集の時点で止める guard が 1 本も無い構成なら、検査がそれを落とす。
- id: A-1
  title: 消す・外へ出す・使う は確認してから
  tier: ask-first
  binds: both
  statements:
  - id: A-1.1
    pattern: event
    strength: must
    text: 既存の文書やデータを消す、外へ出す、外部の道具や鍵を使う（課金を含む）操作を行うとき、実行前に rules 行 R-8 の対話面で持ち主の確認を得る。
- id: A-2
  title: 憲法の条文を変えるとき
  tier: ask-first
  binds: practice
  statements:
  - id: A-2.1
    pattern: event
    strength: must
    text: 条文を改訂するとき、判断の記録と撤退条件を先に書き、持ち主の承認（逐語・日付・裁定 id）を得てから版を上げる。
  - id: A-2.2
    pattern: ubiquitous
    strength: must-not
    text: 条文（id・見出し・規範文・段・縛る相手）と schema 節・前文が 1 文字も変わらない変更を改訂として扱わない。
  - id: A-2.3
    pattern: event
    strength: must
    text: 改訂の前に、その改訂が主張する利益を敵対的に検証し（grill）、記録を判断の記録に添える。
- id: A-3
  title: 依存する外部ソフトの増減
  tier: ask-first
  binds: tool
  statements:
  - id: A-3.1
    pattern: event
    strength: must
    text: 外部ライブラリを増やす・減らすとき、予算（rules 行 R-6）と使ってよい条件（ライセンス）に照らし、持ち主の確認を得る。
- id: A-4
  title: 自分で自分を作ること（self-host）は既定で許可、取り消せない操作だけ確認
  tier: ask-first
  binds: practice
  statements:
  - id: A-4.1
    pattern: ubiquitous
    strength: must
    text: folio が folio 自身の文書・コードを変える運用は、既定で許可する。
  - id: A-4.2
    pattern: event
    strength: must
    text: その操作が取り消せない（消す・出す・使う）とき、A-1 として持ち主に確認する。
  - id: A-4.3
    pattern: ubiquitous
    strength: must
    text: 取り込み（merge）・公開へ出ない便・外部依存を増やさない変更は、A-4.2 の判定で「取り消せる」と扱う。
- id: N-1
  title: 取り消せない削除をしない
  tier: never
  binds: tool
  statements:
  - id: N-1.1
    pattern: unwanted
    strength: must
    text: 操作が管理下の対象を回復不能に削除するなら、folio はそれを拒む。
  - id: N-1.2
    pattern: ubiquitous
    strength: must
    text: 退役（廃止）は可逆な移動としてのみ行う。
- id: N-2
  title: 文章にしか無い規則を、規則として扱わない
  tier: never
  binds: both
  statements:
  - id: N-2.1
    pattern: unwanted
    strength: must-not
    text: 変更が、散文・記憶・会話にしか無い規則を持ち込むなら、それを規則として扱わない。
  - id: N-2.2
    pattern: unwanted
    strength: must
    text: 変更が、散文・記憶・会話にしか無い規則を持ち込むなら、検査がそれを落とす。
- id: N-3
  title: 例外の仕組みを作らない
  tier: never
  binds: tool
  statements:
  - id: N-3.1
    pattern: unwanted
    strength: must
    text: 変更が規則の例外機構（無効化の旗・「今回だけ」の口）を足すなら、それを拒む。
- id: N-4
  title: 判断の記録と裁定 id を伴わない改憲をしない
  tier: never
  binds: practice
  statements:
  - id: N-4.1
    pattern: unwanted
    strength: must
    text: 条文の改訂が、判断の記録・裁定 id・承認の逐語のいずれかを欠くなら、それを拒む。
- id: N-5
  title: 文書の種類ごとに専用の AI 係を作らない
  tier: never
  binds: tool
  statements:
  - id: N-5.1
    pattern: unwanted
    strength: must
    text: 変更が文書の型ごとの AI 係（agent）や検査の観点（lens）を増設するなら、それを拒む。
- id: N-6
  title: 見せる先を tailnet の外へ広げない
  tier: never
  binds: tool
  statements:
  - id: N-6.1
    pattern: unwanted
    strength: must
    text: 配信（serve）の接続先（bind 先）が tailnet の外なら、起動を拒む。
  - id: N-6.2
    pattern: ubiquitous
    strength: must-not
    text: 配信の出力と、支度表・台帳の中身を、認証なしの公開ネットに晒さない。
