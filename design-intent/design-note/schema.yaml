# folio2 設計ノート — 欄の決まり（v1・2026-09-17・f2-648.7）
# 設計ノート = 「どう作るか」を書く文書の 1 つの型（判断の記録 ADR-3 決定 (1)・要件書 FR9）。正本は YAML 1 file（P-6.1）で、置き場は design-intent/design-note/<doc id>.yaml。
# この file は欄の決まりの型付きデータ（P-5.1）。機械の検査（床）はこの欄の決まりを M1 の folio が持つ（要件書 FR9〜FR12）＝それまで検査の結果は「まだ分からない」（P-10.3）。
# day-1 の床（scripts/check_draft.py）は本 dir を読まない（母集団 = 正本 4 file・adr/・anchors/ のまま・ADR-3 決定 (6)）。
# 読み方: *_note で終わる欄は人が読む説明（規則ではない・N-2）。それ以外の欄が M1 の床の定数の写しになる（判断の記録の欄の決まりと同じ形・ADR-1）。

meta:
  id: folio2-design-note-schema
  version: 1
  date: 2026-09-17
  decided_by: [ADR-3, ADR-4]
  requirements: [FR9, FR10, FR11, FR12, FR13, FR14, FR15]
  owner: 持ち主（shuu5）
  author: planner 席（AI・fable 5.1）
  floor: {live: M1, until_then: まだ分からない}
  floor_note: 床が実在するまで、この欄の決まりに照らした合格を名乗らない（P-4.1・P-10.3）。見本 example.yaml は生成器から独立した固定の材料で、M1 の凍結 anchor（P-10.1）の元になる。

schema:
  doc:
    required: [meta, sections]
    optional: [figures, sources]
    doc_note: 1 設計ノート = YAML 1 file。節（sections）の並びが本文。図（figures）は判断の記録 ADR-4 の型付き記述で持つ。外部への参照（報告 HTML 等）は sources に置き、参照 id の母集団に入れない（要件書 NFR3 と同じ）
  doc_meta:
    required: [id, title, version, status, generated, profile, approval]
    optional: [supersedes, superseded_by, note]
    id_pattern: '^[a-z][a-z0-9-]*$'
    id_note: 文書 id（doc id）= file 名の stem。append-only＝改名は「新しい id + 旧 id の廃止（status retired・superseded_by）」で表し、番号や名を再利用しない（P-7）。契約 id は「<doc id>#<row id>」の形で、前半がこの id（器 scribe2 の契約表と同じ形）
    version_pattern: '^v[0-9]+\.[0-9]+$'
    status_enum: [draft, effective, retired, example]
    status_note: {draft: 未承認・拘束力なし, effective: 発効（承認欄に持ち主の逐語・日付・裁定 id）, retired: 廃止（superseded_by 必須・P-7.2）, example: 見本（拘束力なし・凍結 anchor の材料）}
    profile_enum: [design-note]
    profile_note: 密度 profile は 1 行（見せ方だけを持つ・拘束の旗を置かない・ADR-3 決定 (1)・N-3）。文書の種類による違いは節の型で表す（P-5.3）
    approval: {required: [who, date, ruling, verbatim, surface], surface_enum: [R-8]}
    approval_note: P-12.2。発効した設計ノートに必須。承認者の値域・裁定 id の形は判断の記録の欄の決まり（adr/schema.yaml）と同じ定数を M1 の床が持つ
  section:
    required: [n, type, title]
    optional: [body, rows, note]
    n_note: 節番号（§N の N）。1 から昇順・append-only（欠番可・改番しない・P-7.1）。契約表の行の section 欄はこの n を指す（見出しの字面ではない）。器（scribe2）の設計文書の「## N.」と同じ意味
    type_enum: [prose, parts-table, ports-table, fields-table, teeth-table, contract-table]
    type_note: 節の型の閉じた一覧（P-2.4・判断の記録 ADR-3 決定 (1) が名指す 部品の表・口の表・欄の表・歯の表・契約表 + 散文の節）。追加は判断の記録（ADR）を要する。要件書 FR9 = 一覧に無い型の節を持つ正本は生成せずに落とす
    by_type:
      prose:
        required: [body]
        forbid: [rows]
        body_note: 散文。規範の印を持つ文（rules 行 R-16 の印の一覧）は同じ文の中に参照 id（条 id・rules 行 id・要件 id・契約 id）を持ち、数と単位（R-16 の単位の一覧）を持たない（要件書 FR12・散文の門）。記述の文は自由。code fence の内側・縦線で始まる表の行・注釈の行は母集団の外。文の区切りは「。」か行末
      parts-table:
        required: [rows]
        row: {required: [id, name, role], optional: [ref, note]}
        row_note: 部品の表。role = その部品が何をするか（1 行）。ref = 参照 id（条・要件・rules 行・判断の記録）の一覧
      ports-table:
        required: [rows]
        row: {required: [id, name, input, output, refuses], optional: [ref, note]}
        row_note: 口の表（命令・関数・接点）。refuses = 何を断るか（黙って飛ばさない・P-4）。断らない口は「なし」と明記する
      fields-table:
        required: [rows]
        row: {required: [id, name, need, shape], optional: [enum, note]}
        need_enum: [required, optional]
        shape_enum: [text, list, number, bool, table]
        row_note: 欄の表（型付きデータの欄）。器（scribe2）の contracts/schema.toml の field 行（name / need / shape）と同じ 3 欄を核にし、閉じた値域は enum に持つ
      teeth-table:
        required: [rows]
        row: {required: [id, name, red_when, fixture], optional: [ref, note]}
        row_note: 歯の表（検査・test）。red_when = 何を壊せば落ちるか（1 文）。fixture = 固定の材料の path（凍結 anchor・P-10.1）。要件書の受入基準の red_test と同じ形
      contract-table:
        required: [rows]
        rows_note: 契約表。行の欄の集合と値域は本 file に書かない＝external_schema が指す器（scribe2）の導出 file をそのまま読む（ADR-3 決定 (2)・要件書 FR10）。行の id は文書内で一意・append-only
  contract_table:
    external_schema:
      owner: scribe2
      path: contracts/schema.toml
      format: toml
      head: schema = 1
      rows_key: field
      row_fields: [name, need, shape]
      need_enum: [required, optional]
      shape_enum: [text, list]
    external_schema_note: 器（scribe2）が自分の型（pipe/table.rs の定数）から導出した生成物。folio2 はこれを読んで契約表の節の欄を登録し、欄の一覧を自分の型にも散文にも持たない（P-5.1・P-6.3・N-2）。欄の追加・値域の変更は器の版上げで足り、folio2 の判断の記録は要らない。読めないときは「まだ分からない」（FR10・AC8）。折り返しに、folio2 が読むのはこの導出 file と設計文書内の契約表だけで、便ごとの契約 file（contract.toml）は読まない（scribe2 planner の助言 2026-09-16）
    row_id_pattern: '^[a-z][a-z0-9]*$'
    row_id_note: 文書内で一意・append-only。契約 id = <doc id>#<row id>
    section_ref_note: 行の section 欄は同じ文書の節番号 n（prose の節）を指す。導出時にその節の body の逐語を goal へ写す（説明文を二重に書かない・P-6.3）
    semantic_check_owner: scribe2
    semantic_check_note: 行の id の一意・要件の欄が要件書に実在・節の欄が同じ文書に実在し本文が非空・依存の解決と輪の無さ・検証の欄の形・触る型の閉包が書き込み範囲に収まること、は器（scribe2）の 1 つの関数（編集時・黙って飛ばさない）が持つ。folio2 は持たない（ADR-3 決定 (3)・要件書 scope_m1.not_build）
    folio_check: [yaml-form, derived-diff-zero, own-id-space]
    folio_check_note: folio2 が持つ検査は 3 つだけ = 正本の形（重複キー・未知の欄・欄の非空・FR9）/ 導出物の差分 0（FR11・事後の検出・P-18.2）/ folio2 が所有する文書の id 空間の解決（R-4・母集団は広げない）
  derived:
    format: toml-subset
    head: schema = 1
    array: contract
    row_fields: external_schema の field の name をそのまま + goal
    goal: 行の section が指す節の body の逐語を単一行に写す（各行を trim し空行を落とし空白 1 つで繋ぐ・引用符と逆斜線は escape しない）
    empty_list: omit-key
    value_grammar: [text, list-of-text, number, bool]
    placement: 消費側（器 scribe2）の repo に版管理で置く。path は消費側が宣言する
    check: {command: folio build --check, verdict_on_diff: nonzero, stage: post}
    derived_note: 判断の記録 ADR-3 決定 (4)・要件書 FR11。器は統合先（main）へ着地した後の受付からしか新しい表を読まない（正本の改訂 → 取り込みの要求 → 着地 → 再受付）。契約 file の読み手は共有の scalar の読み手で escape を解かず複数行の値も扱わない（scribe2 contract-source.md §2・実測 2026-09-16）＝goal の単一行化はそのため
  landing:
    source_of_truth: scribe2 の記録（record）
    read_port: 統合先の commit（squash）の本文の末尾の印（trailer・契約 id と要件 id・器が書く）
    verdict: {present: 着地（印の commit の要約値（sha）を添える）, absent: まだ分からない}
    forbidden_wording: 未着地
    landing_note: 要件書 FR13・ADR-3 決定 (5)(6)。他の repo の要件 id・契約 id・便の id は参照 id の床（R-4）の母集団に入れず、出所付きの測定値（3 値）として扱う。自分の repo への取り込みの要求で終わる形は印も記録も持たないので恒久に「まだ分からない」
  index:
    entries: [doc, requirement, contract]
    entry_fields: [id, title]
    index_note: 要件書 FR14。機械が読む id の索引（文書・要件・契約の id と 1 行の題）。中身を席へ届ける経路は器の役割の注入が持つ（要件書 CON9）
  figures:
    spec: 図の道具（archify）の型付き記述（JSON の 5 型の欄の決まりそのまま・ADR-4 決定 (1)）
    type_enum_ref: preview/parts.json figure_type_enum
    quality_rules_row: R-14
    tool_version_rules_row: R-15
    retry_rules_row: R-7
    figures_note: 図の正本は設計ノートの figures 節に型付き記述で置き、別 file にも散文にも持たない。生成は要件書 FR15（検査を通らない図は生成しない・前の生成物を上書きしない・凍結 anchor が落ちたら「まだ分からない」）

mapping_note:
  - {source: ADR-3 決定 (1), here: schema.doc_meta.profile_enum / schema.section.type_enum, requirement: FR9}
  - {source: ADR-3 決定 (2), here: schema.contract_table.external_schema, requirement: FR10}
  - {source: ADR-3 決定 (3), here: schema.contract_table.semantic_check_owner / folio_check, requirement: FR9・scope_m1.not_build}
  - {source: ADR-3 決定 (4), here: schema.derived, requirement: FR11}
  - {source: ADR-3 決定 (5)(6), here: schema.landing, requirement: FR13}
  - {source: ADR-3 決定 (7), here: schema.section.by_type.prose.body_note（式は rules 行 R-16）, requirement: FR12}
  - {source: ADR-3 決定 (8), here: 本 file の外（順序と範囲 = 要件書 CON8）, requirement: CON8}
  - {source: ADR-3 決定 (9), here: schema.index, requirement: FR14・CON9}
  - {source: ADR-4 決定 (1)〜(7), here: schema.figures, requirement: FR15}

plain: 「どう作るか」を書く設計の文書（設計ノート）の書き方の決まりです。文書は 1 種類だけで、中は番号つきの節を並べます。節の種類は 6 つ（説明の文・部品の表・口の表・欄の表・検査の表・契約表）に限り、それ以外の節があれば機械が作らずに止めます。契約表（便 1 本ごとの約束の表）の「どんな欄があるか」は scribe2 の機械が持つ写しをそのまま読み、folio 側には書きません。契約表から scribe2 が読む file を機械が作り、repo に置いた file とずれていれば「ずれている」と言います。便が本当に入ったかは commit の末尾の印だけを見て、無ければ「まだ分からない」と言います。説明の文の中で「〜しなければならない」と書いた文には番号を添え、「30 秒」のような単位のついた数を書きません。この決まりを機械で確かめる仕組みは M1 で作るので、それまでは「まだ分からない」のままです。
